version: "3.9"
x-ontology-llm-environment: &ontology-llm-environment
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-noop}
  LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-""}
  LLM_OPENAI_ENDPOINT: ${LLM_OPENAI_ENDPOINT:-""}
  LLM_OPENAI_DEPLOYMENT: ${LLM_OPENAI_DEPLOYMENT:-""}
  LLM_GOOGLE_API_KEY: ${LLM_GOOGLE_API_KEY:-""}
  LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-""}
  BEDROCK_AWS_IAM_AUTH_ENABLED: ${BEDROCK_AWS_IAM_AUTH_ENABLED:-true}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-""}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-""}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-""}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-""}


# Compose override for RDF-enabled local stacks.
# Use together with docker-compose.yml or docker-compose-postgres.yml.
services:
  execute-migrate-all:
    environment:
      <<: *ontology-llm-environment
      RDF_ENABLED: ${RDF_ENABLED:-true}
      RDF_STORAGE_TYPE: ${RDF_STORAGE_TYPE:-FUSEKI}
      RDF_ENDPOINT: ${RDF_ENDPOINT:-${RDF_REMOTE_ENDPOINT:-http://fuseki:3030/openmetadata}}
      RDF_REMOTE_USERNAME: ${RDF_REMOTE_USERNAME:-admin}
      RDF_REMOTE_PASSWORD: ${RDF_REMOTE_PASSWORD:-admin}
      RDF_BASE_URI: ${RDF_BASE_URI:-https://open-metadata.org/}
      RDF_JSONLD_ENABLED: ${RDF_JSONLD_ENABLED:-true}
      RDF_MATERIALIZED_INFERENCE_ENABLED: ${RDF_MATERIALIZED_INFERENCE_ENABLED:-true}
      RDF_INFERENCE_ENABLED: ${RDF_INFERENCE_ENABLED:-true}
      RDF_DEFAULT_INFERENCE_LEVEL: ${RDF_DEFAULT_INFERENCE_LEVEL:-CUSTOM}
      RDF_SHACL_VALIDATION_MODE: ${RDF_SHACL_VALIDATION_MODE:-REPORT}
      RDF_DEREFERENCEABLE_IRIS: ${RDF_DEREFERENCEABLE_IRIS:-false}
      RDF_STRICT_OWL_PROFILE: ${RDF_STRICT_OWL_PROFILE:-true}
      RDF_AI_ENABLED: ${RDF_AI_ENABLED:-false}
      RDF_SPARQL_ENABLED: ${RDF_SPARQL_ENABLED:-true}
      RDF_DATASET: ${RDF_DATASET:-openmetadata}
    depends_on:
      fuseki:
        condition: service_healthy

  openmetadata-server:
    environment:
      <<: *ontology-llm-environment
      RDF_ENABLED: ${RDF_ENABLED:-true}
      RDF_STORAGE_TYPE: ${RDF_STORAGE_TYPE:-FUSEKI}
      RDF_ENDPOINT: ${RDF_ENDPOINT:-${RDF_REMOTE_ENDPOINT:-http://fuseki:3030/openmetadata}}
      RDF_REMOTE_USERNAME: ${RDF_REMOTE_USERNAME:-admin}
      RDF_REMOTE_PASSWORD: ${RDF_REMOTE_PASSWORD:-admin}
      RDF_BASE_URI: ${RDF_BASE_URI:-https://open-metadata.org/}
      RDF_JSONLD_ENABLED: ${RDF_JSONLD_ENABLED:-true}
      RDF_MATERIALIZED_INFERENCE_ENABLED: ${RDF_MATERIALIZED_INFERENCE_ENABLED:-true}
      RDF_INFERENCE_ENABLED: ${RDF_INFERENCE_ENABLED:-true}
      RDF_DEFAULT_INFERENCE_LEVEL: ${RDF_DEFAULT_INFERENCE_LEVEL:-CUSTOM}
      RDF_SHACL_VALIDATION_MODE: ${RDF_SHACL_VALIDATION_MODE:-REPORT}
      RDF_DEREFERENCEABLE_IRIS: ${RDF_DEREFERENCEABLE_IRIS:-false}
      RDF_STRICT_OWL_PROFILE: ${RDF_STRICT_OWL_PROFILE:-true}
      RDF_AI_ENABLED: ${RDF_AI_ENABLED:-false}
      RDF_SPARQL_ENABLED: ${RDF_SPARQL_ENABLED:-true}
      RDF_DATASET: ${RDF_DATASET:-openmetadata}
    depends_on:
      fuseki:
        condition: service_healthy

  fuseki:
    # The published OpenMetadata Fuseki image (built in open-metadata/jena), pinned to its
    # immutable <version>-<commit> tag. See docs/rdf-fuseki-image-release.md.
    image: openmetadata/fuseki:6.2.0-600514c
    container_name: openmetadata-fuseki
    hostname: fuseki
    ports:
      - "3030:3030"
    networks:
      - local_app_net
    environment:
      # The image's environment contract, set as OpenMetadata needs it: the serving dataset and
      # its two blue/green rebuild targets, the union default graph (OpenMetadata writes every
      # entity into a named graph), server-side deadlines below the 60 s client deadline, and the
      # bounded Graph Store extension. docs/rdf-production-setup.md explains each one.
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-admin}
      - FUSEKI_DATASETS=openmetadata,openmetadata_a,openmetadata_b
      - FUSEKI_UNION_DEFAULT_GRAPH=true
      - FUSEKI_QUERY_TIMEOUT_MS=50000
      - FUSEKI_UPDATE_TIMEOUT_MS=50000
      - OPENMETADATA_EXTENSION_ENABLED=true
      # JVM_ARGS replaces the image's FUSEKI_HEAP flags. It caps direct buffers until the pinned
      # image applies that cap itself (open-metadata/jena#6).
      - JVM_ARGS=-Xms${FUSEKI_HEAP:-1500m} -Xmx${FUSEKI_HEAP:-1500m} -XX:MaxDirectMemorySize=256m
    volumes:
      - fuseki-store:/fuseki
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256m
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

networks:
  local_app_net:
    name: ometa_network
    ipam:
      driver: default
      config:
        - subnet: "172.16.239.0/24"

volumes:
  # TDB2 datasets, configuration and shiro.ini of the published image live under /fuseki. Not the
  # older `fuseki-tdb2-data` volume: it holds the retired in-repo image's /fuseki-data layout, and
  # mounting it here would start an empty store. docs/rdf-production-setup.md has the migration.
  fuseki-store:
    driver: local
