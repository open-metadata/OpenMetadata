version: "3.9"

# Override file to increase disk storage for persistent volumes
# Place this file in the same directory as docker-compose-rdf.yml

volumes:
  # Increase Elasticsearch data volume
  es-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./docker-volume/elasticsearch-data

  # Fuseki volume (/fuseki in the published image). A new host path, because
  # ./docker-volume/fuseki-tdb2-data holds the retired in-repo image's layout and
  # would start an empty store here; see docs/rdf-production-setup.md.
  fuseki-store:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./docker-volume/fuseki-store

services:
  # Additional Elasticsearch optimizations
  elasticsearch:
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - vm.max_map_count=262144

  # Additional Fuseki optimizations
  fuseki:
    ulimits:
      nofile:
        soft: 65536
        hard: 65536