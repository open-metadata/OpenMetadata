apiVersion: v1
kind: Service
metadata:
  name: openmetadata-fuseki
  labels:
    app: openmetadata-fuseki
spec:
  ports:
    - port: 3030
      targetPort: 3030
      name: fuseki
  selector:
    app: openmetadata-fuseki
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fuseki-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Development default only. Production sizing: >= 2 datasets x live size x 2.5.
      # Two datasets because blue/green rebuilds keep an a/b alternate alongside the
      # serving one; x2.5 because TDB2 compaction builds a full replacement copy
      # before deleting the old generation. Reasoning, when enabled, adds its own quota
      # under /fuseki/reasoning (see the image README).
      storage: 10Gi
  # Development default only. TDB2 commits are fsync/IOPS-bound (journal write per
  # transaction) — production must use an SSD-backed class with provisioned IOPS
  # (pd-ssd, gp3 with IOPS set, or local NVMe). A network-HDD "standard" class is
  # the single most common cause of slow RDF indexing.
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata-fuseki
  labels:
    app: openmetadata-fuseki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata-fuseki
  template:
    metadata:
      labels:
        app: openmetadata-fuseki
    spec:
      # The image runs as uid 1000 (group 0 writable for OpenShift); fsGroup makes the
      # PVC writable. Data written by the retired in-repo image lives under /fuseki-data
      # and must be moved into /fuseki/databases first (docs/rdf-production-setup.md).
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: fuseki
          # The published image of record, pinned to its immutable <version>-<commit> tag.
          image: openmetadata/fuseki:6.2.0-c75b095
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
              name: fuseki
          env:
            # OpenMetadata connects as admin (RDF_REMOTE_USERNAME=admin).
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fuseki-secrets
                  key: admin-password
            # The serving dataset and its two blue/green rebuild targets.
            - name: FUSEKI_DATASETS
              value: "openmetadata,openmetadata_a,openmetadata_b"
            # OpenMetadata writes every entity into a named graph.
            - name: FUSEKI_UNION_DEFAULT_GRAPH
              value: "true"
            # Below OpenMetadata's 60 s client deadline, so Fuseki stops abandoned work.
            - name: FUSEKI_QUERY_TIMEOUT_MS
              value: "50000"
            - name: FUSEKI_UPDATE_TIMEOUT_MS
              value: "50000"
            - name: OPENMETADATA_EXTENSION_ENABLED
              value: "true"
            # Equal min/max heap keeps the page-cache budget predictable. JVM_ARGS replaces the
            # image's FUSEKI_HEAP flags and caps direct buffers until the pinned image applies
            # that cap itself (open-metadata/jena#6).
            - name: JVM_ARGS
              value: "-Xms4g -Xmx4g -XX:MaxDirectMemorySize=256m"
          volumeMounts:
            - name: fuseki-data
              mountPath: /fuseki
          resources:
            # TDB2 memory-maps indexes outside the JVM heap. Keep the heap modest
            # and reserve container memory for the OS page cache: memory limit
            # should exceed -Xmx by the page-cache headroom (roughly the hot
            # index working set — for two blue/green datasets budget both).
            #
            # CPU request equals the limit deliberately: with a low request the
            # scheduler over-packs the node and CFS throttling stretches request
            # latency during bulk indexing — and every millisecond of a write
            # request happens inside TDB2's single writer lock. Memory request
            # equals the limit (Guaranteed QoS), which reasoning requires.
            requests:
              memory: "8Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /$/ping
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: fuseki-data
          persistentVolumeClaim:
            claimName: fuseki-data-pvc
---
apiVersion: v1
kind: Secret
metadata:
  name: fuseki-secrets
type: Opaque
stringData:
  admin-password: "your-secure-admin-password"
