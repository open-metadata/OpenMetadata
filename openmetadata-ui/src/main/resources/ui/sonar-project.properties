sonar.projectKey=open-metadata-ui
sonar.projectName=open-metadata-ui
sonar.organization=open-metadata
sonar.language=ts

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set. 
sonar.sources=src
sonar.tests=src/test/unit
sonar.exclusions=src/enums/**, src/generated/**, src/cypress/**, src/interface/**, src/jsons/**, src/mocks/**, src/styles/**, src/test/**, src/**/*.mock.*, src/*.js, src/**/*.test.ts, src/**/*.test.tsx, src/**/*.test.js, src/**/*.test.jsx
sonar.inclusions=src/**/*.ts, src/**/*.tsx, src/**/*.js, src/**/*.jsx
sonar.typescript.lcov.reportPaths=src/test/unit/coverage/lcov.info
sonar.testExecutionReportPaths=test-report.xml

# Block the scanner until SonarCloud returns the quality gate result, and exit
# non-zero when it fails. ui-sonar-gate turns that outcome into the required PR
# check. Kept here rather than as a -D flag so it is version-controlled and
# applies to every invocation, not just the one CI command that remembers it.
#
# NOTE: the gate CONDITIONS (Coverage on New Code >= 90%, Issues 0, Security
# Hotspots Reviewed 100%, Duplicated Lines <= 3%, nothing on Overall Code) are
# server-side policy in SonarCloud and cannot be set from this file — there is
# no sonar.qualitygate.<metric> property. See docs/ui-code-quality-gate.md.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# New Code = everything not on main. Setting it here keeps the definition in the
# repo instead of only in project settings.
sonar.newCode.referenceBranch=main
