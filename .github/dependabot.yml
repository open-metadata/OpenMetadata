version: 2

# NOTE: This file controls Dependabot version-update PRs only.
# It does NOT suppress Dependabot security alerts on the Security tab.
# To auto-dismiss transitive (indirect) alerts, configure auto-triage rules at
# Settings -> Code security -> Dependabot -> "Manage rules".

updates:
  - package-ecosystem: "uv"
    directories:
      - "/ingestion"
      - "/ingestion/images/runtime"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # setup.py retains shared constraints; lock-only updates include its resolved graph.
    versioning-strategy: "lockfile-only"
    allow:
      - dependency-type: "all"
    groups:
      python-tooling-minor-patch:
        patterns:
          - "ruff"
          - "basedpyright"
          - "pytest*"
          - "nox"
          - "coverage"
          - "pre-commit"
          - "datamodel-code-generator"
          - "uvloop"
          - "build"
          - "twine"
          - "*stubs*"
          - "types-*"
        update-types: ["minor", "patch"]
      python-runtime-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Logback 1.6 removed a field Dropwizard's request logging uses, so the
      # server fails at startup. Remove once Dropwizard supports it, see #34308.
      - dependency-name: "ch.qos.logback:logback-core"
        versions: [">=1.6.0"]
      - dependency-name: "ch.qos.logback:logback-classic"
        versions: [">=1.6.0"]

  - package-ecosystem: "npm"
    directory: "/openmetadata-ui/src/main/resources/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
