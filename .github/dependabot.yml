version: 2

# NOTE: This file controls Dependabot version-update PRs only.
# It does NOT suppress Dependabot security alerts on the Security tab.
# To auto-dismiss transitive (indirect) alerts, configure auto-triage rules at
# Settings -> Code security -> Dependabot -> "Manage rules".

updates:
  - package-ecosystem: "pip"
    directory: "/ingestion"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # urllib3 is pinned <2.0 transitively via tableauserverclient==0.25.
      # See ingestion/setup.py comment on the tableau pin.
      - dependency-name: "urllib3"
        versions: [">=2.0.0"]

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Logback 1.6 removed a field Dropwizard's request logging uses, so the
      # server fails at startup. Remove once Dropwizard supports it, see #34308.
      - dependency-name: "ch.qos.logback:logback-core"
        versions: [">=1.6.0"]
      - dependency-name: "ch.qos.logback:logback-classic"
        versions: [">=1.6.0"]
      # Hibernate Validator 9 removed ConstraintValidatorFactoryImpl, which Dropwizard
      # 5 builds its validator from, so the server fails at startup. Dropwizard 5.0.2
      # still targets 8.0.x. Remove once Dropwizard supports 9.
      - dependency-name: "org.hibernate.validator:hibernate-validator"
        versions: [">=9.0.0"]

  - package-ecosystem: "npm"
    directory: "/openmetadata-ui/src/main/resources/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The shipped database images, and the ingestion images' mysqldump stage, which must
  # match the MySQL one. Tests read their images from the shipped Dockerfiles, so one
  # PR here moves everything. ADR:2026-11-19-test-database-images-come-from-the-shipped-image
  - package-ecosystem: "docker"
    directories:
      - "/docker/mysql"
      - "/docker/postgresql"
      - "/ingestion"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    allow:
      - dependency-name: "mysql"
      - dependency-name: "postgres"
    groups:
      database-images:
        patterns:
          - "mysql"
          - "postgres"
    ignore:
      # Stay on the 8.4 LTS line: ADR:2026-11-19-shipped-mysql-uses-the-8-4-lts-line.
      - dependency-name: "mysql"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # A Postgres major is an upgrade decision for deployments, not a routine bump.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
