name: Warm classification models

on:
  push:
    branches: [main]
    paths:
      - ingestion/pyproject.toml
      - ingestion/uv.lock
      - scripts/prepare_classification_models.py
      - .github/scripts/classification_model_revisions.py
      - .github/actions/prepare-classification-models/**
      - .github/workflows/warm-classification-models.yml
  workflow_dispatch:
    inputs:
      revision:
        description: Exact commit SHA; leave empty to sweep supported heads and retained revisions
        type: string
        default: ''
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: read

concurrency:
  group: classification-model-warmer
  queue: single
  cancel-in-progress: false

jobs:
  warm:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    cache-mode: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: revisions
        env:
          REQUESTED_REVISION: ${{ github.event_name == 'push' && github.sha || inputs.revision }}
          SUPPORTED_HEADS: '["main"]'
          RETAINED_REVISIONS: '[]'
        run: python3 .github/scripts/classification_model_revisions.py --discover-models >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prepare-classification-models
        with:
          models: ${{ steps.revisions.outputs.models }}
          save-cache: 'true'
