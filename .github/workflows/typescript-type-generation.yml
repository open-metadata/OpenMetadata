name: TypeScript Type Generation

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'openmetadata-spec/src/main/resources/json/schema/**'
      - 'openmetadata-ui/src/main/resources/ui/src/generated/**'
      - 'openmetadata-ui/src/main/resources/ui/src/jsons/**'
      - 'openmetadata-ui/src/main/resources/ui/public/jsons/**'
      - 'openmetadata-ui/src/main/resources/ui/parseSchemas.js'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on (ignored if pr_number is provided)'
        required: false
        default: 'main'
        type: string
      pr_number:
        description: 'PR number to run the workflow for (same-repo PRs only; fork PRs regenerate locally)'
        required: false
        type: string

concurrency:
  group: typescript-generation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-types:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Get PR details for workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
        id: pr-details
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view "$PR_NUMBER" --json headRepository,headRefName,headRepositoryOwner,headRefOid --repo "$BASE_REPO")
          echo "head_repo=$(echo "$PR_DATA" | jq -r '.headRepository.name')" >> $GITHUB_OUTPUT
          echo "head_owner=$(echo "$PR_DATA" | jq -r '.headRepositoryOwner.login')" >> $GITHUB_OUTPUT
          echo "head_ref=$(echo "$PR_DATA" | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "head_sha=$(echo "$PR_DATA" | jq -r '.headRefOid')" >> $GITHUB_OUTPUT
          echo "full_repo=$(echo "$PR_DATA" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')" >> $GITHUB_OUTPUT

      - name: Check if repository is a fork
        id: check-fork
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REPO: ${{ steps.pr-details.outputs.full_repo }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ] && [ -n "$FULL_REPO" ]; then
            # For workflow_dispatch with PR number
            if [ "$FULL_REPO" != "$BASE_REPO" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            # Dependabot runs get no secrets either, so they are handled like a fork.
            if [ "$HEAD_REPO_FULL_NAME" != "$BASE_REPO" ] || [ "$ACTOR" == "dependabot[bot]" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          else
            # Default to non-fork for direct branch runs
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      # A dispatch runs with this repository's secrets, so it must never execute a fork's code.
      - name: Refuse to run a fork PR's code on dispatch
        if: github.event_name == 'workflow_dispatch' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "::error title=Fork PR::A dispatch cannot run a fork's code. Ask the author to run ./json2ts-generate-all.sh -l true and yarn parse-schema in openmetadata-ui/src/main/resources/ui and commit the result."
          exit 1

      - name: Determine checkout ref
        id: checkout-ref
        env:
          IS_FORK: ${{ steps.check-fork.outputs.is_fork }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_DETAILS_HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
          PR_DETAILS_HEAD_REF: ${{ steps.pr-details.outputs.head_ref }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" == "merge_group" ]; then
            echo "ref=$GITHUB_SHA_VAL" >> $GITHUB_OUTPUT
          elif [ "$IS_FORK" == "true" ] && [ "$EVENT_NAME" == "pull_request" ]; then
            echo "ref=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "ref=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ "$IS_FORK" == "true" ] && [ -n "$PR_DETAILS_HEAD_SHA" ]; then
            echo "ref=$PR_DETAILS_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ -n "$PR_DETAILS_HEAD_REF" ]; then
            echo "ref=$PR_DETAILS_HEAD_REF" >> $GITHUB_OUTPUT
          elif [ -n "$INPUT_BRANCH" ]; then
            echo "ref=$INPUT_BRANCH" >> $GITHUB_OUTPUT
          else
            echo "ref=$GITHUB_REF" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr-details.outputs.full_repo || github.repository }}
          ref: ${{ steps.checkout-ref.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: 'openmetadata-ui/src/main/resources/ui/.nvmrc'

      - name: Generate TypeScript types
        # json2ts-generate-all.sh fetches its pinned quicktype via npx. A branch
        # still on the old script expects a root node_modules this job no longer
        # installs; it then "succeeds" with zero types, so fail rather than push
        # the deletion of every generated file.
        run: |
          ./openmetadata-ui/src/main/resources/ui/json2ts-generate-all.sh -l true
          [ -n "$(find openmetadata-ui/src/main/resources/ui/src/generated -name '*.ts' -print -quit 2>/dev/null)" ] || {
            echo "::error::No TypeScript types were generated — rebase the branch on main."
            exit 1
          }

      - name: Generate dereferenced JSON schemas
        run: |
          cd openmetadata-ui/src/main/resources/ui
          # parseSchemas.js needs the UI package's own dependencies
          # (@apidevtools/json-schema-ref-parser, fs-extra).
          # --frozen-lockfile pins the versions a contributor resolves locally, so the
          # committed output is byte-identical whoever regenerates it; --ignore-scripts
          # skips preinstall (core-components build) and postinstall (js-antlr), neither
          # of which parseSchemas.js needs.
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --ignore-scripts --network-timeout 100000 && break
            if [[ "$attempt" -eq 3 ]]; then
              echo "yarn install failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::yarn install attempt $attempt failed (registry blip?); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          yarn parse-schema

      - name: Check for changes
        id: git-check
        continue-on-error: true
        run: |
          for dir in openmetadata-ui/src/main/resources/ui/src/generated/ \
                     openmetadata-ui/src/main/resources/ui/src/jsons/ \
                     openmetadata-ui/src/main/resources/ui/public/jsons/; do
            [ -d "$dir" ] && git add "$dir"
          done
          git diff --cached --quiet

      - name: Fail workflow when generated sources are stale
        if: steps.git-check.outcome != 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ Generated Sources Need Update

          **The generated TypeScript types and/or dereferenced JSON schemas are out of sync with the JSON schema changes.**

          CI checks generated sources without pushing changes to PR branches.
          Generate and commit them locally:

          ```bash
          cd openmetadata-ui/src/main/resources/ui
          ./json2ts-generate-all.sh -l true
          yarn parse-schema
          git add src/generated/ src/jsons/ public/jsons/
          git commit -m "Update generated TypeScript types and dereferenced schemas"
          git push
          ```

          After pushing the changes, this check will pass automatically.
          EOF
          echo "::error title=Generated sources need update::Regenerate the TypeScript types and dereferenced schemas and commit them; the job summary has the commands."
          exit 1
