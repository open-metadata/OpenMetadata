name: Build backend distribution
'on':
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact revision to build
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Build Backend Distribution
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
      - name: Restore Maven dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build backend distribution
        run: mvn -DskipTests -DonlyBackend clean package -pl openmetadata-dist -am
        shell: bash
      - name: Upload backend distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openmetadata-backend-distribution
          path: openmetadata-dist/target/openmetadata-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
