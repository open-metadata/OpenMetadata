# Thin dispatcher for the postgresql Playwright E2E PR gate.
# All pipeline logic lives in playwright-e2e-reusable.yml — this file only
# decides *when* the run fires (PRs, merge queue, manual dispatch on the
# current branch). Release-branch dry-runs live in
# `playwright-postgresql-nightly.yml`, which is dispatch-only and takes a
# `branch:` input; any change to shard planning, caching, gate rules, or the
# summary check belongs in the reusable so both callers stay aligned.

name: Postgresql PR Playwright E2E Tests
on:
  merge_group:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete duration-balanced suite
        required: true
        type: boolean
        default: true
      protocol:
        description: Application protocol used by Playwright
        required: true
        type: choice
        options:
          - http
          - h2
        default: http
      coarse_bundle:
        description: Build the CI-only coarse Vite bundle
        required: true
        type: boolean
        default: true
  # Same-repo PRs run under pull_request — unprivileged, secrets absent
  # from the runner. These jobs build PR code, populate caches, and
  # exchange artifacts.
  pull_request:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Fork PRs need cloud-connector secrets (TEST_SNOWFLAKE_*, TEST_BQ_*,
  # TEST_REDSHIFT_* …) that pull_request events cannot access on forks.
  # pull_request_target runs in the base repo's context so those secrets
  # resolve, but requires a maintainer to apply the "safe to test" label
  # first (enforced by the gate job in the reusable workflow). Same-repo
  # PRs already ran under pull_request above; the reusable short-circuits
  # on them via the head-repo check in the gate job.
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  playwright:
    uses: ./.github/workflows/playwright-e2e-reusable.yml
    # secrets: inherit passes the full TEST_* / GITHUB_TOKEN set into the
    # reusable without re-listing each one; the reusable only reads what it
    # needs.
    secrets: inherit
    # The caller's job permissions are the UPPER BOUND on what any reusable
    # job can request. `refresh-timing-baseline` needs contents+pull-requests
    # write; every other reusable job declares its own read-only permissions
    # block, so the write grant is only actually used by the one job — and
    # that job is gated on `github.event_name == 'merge_group'`, so PRs and
    # dispatches never invoke a writer.
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: read
    with:
      database: postgresql
      profile: postgresql-pr
      workflow_filename: playwright-postgresql-e2e.yml
      # Defaults inline what workflow_dispatch collects; non-dispatch events
      # fall back to the reusable's own defaults (full_suite=true, http,
      # coarse_bundle=true).
      full_suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite || true }}
      protocol: ${{ github.event_name == 'workflow_dispatch' && inputs.protocol || 'http' }}
      coarse_bundle: ${{ github.event_name == 'workflow_dispatch' && inputs.coarse_bundle || true }}
