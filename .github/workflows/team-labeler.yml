on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

name: Team Label
jobs:
  labeler:
    runs-on: ubuntu-latest
    name: Team Label
    steps:
      - uses: JulienKode/team-labeler-action@v3.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      # One random reviewer per team label, on top of any CODEOWNERS requests, so review requests
      # keep spreading across each team. Runs once per PR: when it opens ready for review, or when
      # a draft is marked ready.
      - name: Request a reviewer from each team
        if: >-
          (github.event.action == 'opened' && !github.event.pull_request.draft) ||
          github.event.action == 'ready_for_review'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login.toLowerCase();

            // pull_request_target runs on the default branch, so context.sha reads the
            // maintained teams.yml, never the PR's copy.
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: '.github/teams.yml', ref: context.sha,
            });
            const teams = {};
            let team = null;
            for (const line of Buffer.from(file.content, 'base64').toString('utf8').split('\n')) {
              const key = line.match(/^["']?([^\s"'#:][^"':]*)["']?:\s*$/);
              const member = line.match(/^\s+-\s+["']?@([A-Za-z0-9-]+)["']?\s*$/);
              if (key) {
                team = key[1].toLowerCase();
                teams[team] = [];
              } else if (member && team) {
                teams[team].push(member[1]);
              }
            }

            // The labeler step's labels are not in the event payload, so read them back.
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pull_number,
            });
            const { data: requested } = await github.rest.pulls.listRequestedReviewers({
              owner, repo, pull_number,
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number,
            });
            const engaged = new Set([
              ...requested.users.map((user) => user.login.toLowerCase()),
              ...reviews.filter((review) => review.user).map((review) => review.user.login.toLowerCase()),
            ]);

            for (const label of labels.map((l) => l.name.toLowerCase()).filter((name) => teams[name])) {
              const candidates = teams[label].filter(
                (login) => login.toLowerCase() !== author && !engaged.has(login.toLowerCase()),
              );
              if (candidates.length === 0) {
                core.info(`${label}: every other team member is already reviewing`);
                continue;
              }
              const reviewer = candidates[Math.floor(Math.random() * candidates.length)];
              try {
                await github.rest.pulls.requestReviewers({ owner, repo, pull_number, reviewers: [reviewer] });
                engaged.add(reviewer.toLowerCase());
                core.info(`${label}: requested a review from @${reviewer}`);
              } catch (error) {
                core.warning(`${label}: could not request a review from @${reviewer}: ${error.message}`);
              }
            }
