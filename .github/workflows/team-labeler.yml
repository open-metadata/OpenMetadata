on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write
  issues: write

name: Team Label
jobs:
  labeler:
    runs-on: ubuntu-latest
    name: Team Label
    steps:
      # Keep fork approval scoped to the current head SHA. This must run in
      # the same job as the trusted-author labeler so synchronize events first
      # invalidate an earlier approval and then revalidate allowlisted authors.
      - name: Invalidate safe-to-test on fork sync
        if: |
          github.event.action == 'synchronize' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          contains(github.event.pull_request.labels.*.name, 'safe to test')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! response=$(gh api --silent -X DELETE \
            "/repos/${REPO}/issues/${PR_NUMBER}/labels/safe%20to%20test" 2>&1); then
            if [[ "$response" != *"HTTP 404"* ]]; then
              echo "$response" >&2
              exit 1
            fi
            echo "safe to test label already absent"
          fi

      # Area labels follow the changed files (.github/labeler.yml). The labeler reads its config at
      # the base commit and lists changed files through the API; it never checks out PR code.
      - name: Label areas from changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `safe to test` follows org membership (ADR:2026-11-05-pr-labels-follow-paths-and-ci-trust-follows-org-membership).
      # The default GITHUB_TOKEN can't see private org members, so a GitHub App token with
      # members:read answers the membership check. Runs triggered by Dependabot get no Actions
      # secrets, so a missing token is tolerated and only the allow list can trust the author.
      - name: Mint org members read token
        id: org-read-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TEAM_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEAM_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Read team config from the base commit
        id: team-config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # github.sha is the base-branch commit this workflow was loaded from.
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          json=$(gh api "repos/${REPO}/contents/.github/team-config.yml?ref=${BASE_SHA}" --jq .content \
            | base64 -d | yq -o=json -I=0 '.')
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Label trusted authors safe to test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEAM_CONFIG: ${{ steps.team-config.outputs.json }}
          ORG_READ_TOKEN: ${{ steps.org-read-token.outputs.token }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { allow = [], deny = [] } = JSON.parse(process.env.TEAM_CONFIG)['safe-to-test'] ?? {};
            const listed = (logins) => logins.some((login) => login.toLowerCase() === author.toLowerCase());

            async function isOrgMember() {
              if (!process.env.ORG_READ_TOKEN) {
                core.warning('No members:read token; only the allow list can mark this PR safe to test.');
                return false;
              }
              try {
                await getOctokit(process.env.ORG_READ_TOKEN).rest.orgs.checkMembershipForUser({
                  org: owner,
                  username: author,
                });
                return true;
              } catch (error) {
                // Fail closed without failing the job: six CI workflows wait on `Team Label`.
                if (error.status !== 404) {
                  core.warning(`Org membership check for ${author} failed: ${error.message}`);
                }
                return false;
              }
            }

            if (listed(deny)) {
              return core.info(`${author} is on the safe-to-test deny list.`);
            }
            if (listed(allow) || (await isOrgMember())) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['safe to test'] });
              return core.info(`Marked #${pr.number} safe to test for ${author}.`);
            }
            core.info(`${author} is not an org member or allow-listed; a maintainer must add safe to test.`);

      - name: Verify PR labels
        id: verify
        continue-on-error: true
        uses: jesusvasquez333/verify-pr-label-action@v1.4.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          valid-labels: 'safe to test'
          pull-request-number: '${{ github.event.pull_request.number }}'
          disable-reviews: true  # To not auto approve changes

      - name: Add verification comment
        if: steps.verify.outcome != 'success'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Hi there 👋 Thanks for your contribution!**
            
            The OpenMetadata team will review the PR shortly! Once it has been labeled as `safe to test`, the CI workflows
            will start executing and we'll be able to make sure everything is working as expected.
            
            Let us know if you need any help!
