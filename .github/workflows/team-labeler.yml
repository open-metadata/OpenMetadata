on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write
  issues: write

name: Team Label
jobs:
  labeler:
    runs-on: ubuntu-latest
    name: Team Label
    steps:
      - uses: JulienKode/team-labeler-action@v3.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
