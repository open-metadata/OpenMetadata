name: Jest Coverage

on:
  merge_group:
  workflow_dispatch:
  # Trigger analysis when pushing in master or pull requests, and when creating
  # a pull request.
  # Note: paths filter removed — the workflow always triggers so that the
  # required status check (coverage-result) always completes. Path filtering
  # is handled inside the workflow via dorny/paths-filter, which lets PRs
  # without UI changes skip the expensive jobs while still reporting a
  # passing status.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  UI_WORKING_DIRECTORY: openmetadata-ui/src/main/resources/ui
concurrency:
  group: yarn-coverage-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      ui-changed: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        if: ${{ github.event_name == 'merge_group' }}
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            ui:
              - '.github/workflows/yarn-coverage.yml'
              - 'openmetadata-ui/src/main/resources/ui/src/**'
              - 'openmetadata-ui/src/main/resources/ui/jest.config.js'
              - 'openmetadata-ui/src/main/resources/ui/package.json'
              - 'openmetadata-ui/src/main/resources/ui/yarn.lock'
              - 'openmetadata-ui/src/main/resources/ui/tsconfig.json'
              - 'openmetadata-ui/src/main/resources/ui/babel.config.json'
              - 'openmetadata-ui/src/main/resources/ui/.nvmrc'
              - 'openmetadata-ui/src/main/resources/ui/sonar-project.properties'
              - 'openmetadata-ui-core-components/src/main/resources/ui/src/**'
              - 'openmetadata-ui-core-components/src/main/resources/ui/package.json'
              - 'openmetadata-ui-core-components/src/main/resources/ui/yarn.lock'
              - 'openmetadata-ui-core-components/src/main/resources/ui/vite.config.ts'

  ui-coverage-tests:
    needs: check-changes
    runs-on: ubuntu-latest
    if: |
      !github.event.pull_request.draft &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.ui-changed == 'true')
    name: ui-coverage-tests (shard ${{ matrix.shard }})
    # Coverage is collected nightly by ui-sonarcloud-nightly.yml; PR and queue
    # runs only need pass/fail, so they skip instrumentation and shard the suite.
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          # Path diffing happens in check-changes; Jest needs only the tree.
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "openmetadata-ui/src/main/resources/ui/.nvmrc"

      # populate-playwright-caches.yml populates this shared Yarn cache. Validation
      # must not evict main's fixtures with large copies on ephemeral queue refs.
      - name: Restore Yarn dependencies
        uses: actions/cache/restore@v6
        id: yarn-cache
        with:
          path: ~/.yarn/berry/cache
          key: yarn4-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}
          restore-keys: |
            yarn4-pkg-cache-${{ runner.os }}-

      - name: Install Antlr4 CLI
        run: |
          sudo make install_antlr_cli
      - name: Install Yarn Packages
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: |
          # Retry transient registry failures (5xx on tarball fetches) —
          # Yarn retries each request, but not a sustained outage.
          for attempt in 1 2 3; do
            YARN_HTTP_TIMEOUT=100000 yarn install && break
            if [[ "$attempt" -eq 3 ]]; then
              echo "yarn install failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::yarn install attempt $attempt failed (registry blip?); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
      - name: Run SSO dev server tests
        if: matrix.shard == 1
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: node --test scripts/sso-dev-server.test.mjs
      - name: Run unit tests
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        # jest.config.js keeps '50%' for laptops; on the 4-vCPU hosted runner
        # that is only 2 workers, so CI asks for all 4. --silent plus the
        # summary + github-actions reporters drop the ~1.8M log lines (console
        # noise + PASS lines); failures still surface as inline annotations.
        run: yarn jest --silent --reporters=summary --reporters=github-actions --maxWorkers=4 --shard=${{ matrix.shard }}/4

  # This job is the one to set as the required status check in branch protection.
  # It always runs and passes when ui-coverage-tests succeeded OR was skipped
  # (i.e. no relevant UI paths changed), so PRs without UI changes are never blocked.
  ui-coverage:
    if: always()
    needs: [ui-coverage-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check coverage result
        run: |
          result="${{ needs.ui-coverage-tests.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "Coverage check passed or was not required for this PR"
          else
            echo "Coverage check failed with status: $result"
            exit 1
          fi
