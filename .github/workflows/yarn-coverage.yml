name: SonarCloud + Jest Coverage

on:
  merge_group:
  workflow_dispatch:
  # Trigger analysis when pushing in master or pull requests, and when creating
  # a pull request.
  # Note: paths filter removed — the workflow always triggers so that the
  # required status check (coverage-result) always completes. Path filtering
  # is handled inside the workflow via dorny/paths-filter, which lets PRs
  # without UI changes skip the expensive jobs while still reporting a
  # passing status.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write # Required for Providing Jest Coverage Comment

env:
  UI_WORKING_DIRECTORY: openmetadata-ui/src/main/resources/ui
  UI_COVERAGE_DIRECTORY: openmetadata-ui/src/main/resources/ui/src/test/unit/coverage
concurrency:
  group: yarn-coverage-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name != github.repository) }}
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      ui-changed: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        if: ${{ github.event_name == 'merge_group' }}
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            ui:
              - 'openmetadata-ui/src/main/resources/ui/src/**'
              - 'openmetadata-ui/src/main/resources/ui/jest.config.js'
              - 'openmetadata-ui/src/main/resources/ui/package.json'
              - 'openmetadata-ui/src/main/resources/ui/yarn.lock'
              - 'openmetadata-ui/src/main/resources/ui/tsconfig.json'
              - 'openmetadata-ui/src/main/resources/ui/babel.config.json'
              - 'openmetadata-ui/src/main/resources/ui/.nvmrc'
              - 'openmetadata-ui/src/main/resources/ui/sonar-project.properties'

  ui-coverage-tests:
    needs: check-changes
    runs-on: ubuntu-latest
    outputs:
      # Parsed from the scanner log: passed | failed | error. Only "failed" (a real
      # New Code gate failure) blocks; "error" means Sonar never returned a verdict
      # (upload error / rate limit / timeout) and must not fail the required check.
      sonar_gate_status: ${{ steps.sonar_pr_scan.outputs.gate_status }}
      # Exposed so the gate can tell "scanner never ran" apart from "gate passed".
      sonar_scanner_install: ${{ steps.npm_install_sonar_scanner.outcome }}
    if: |
      !github.event.pull_request.draft &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.ui-changed == 'true') &&
      (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test')
    steps:
      - name: Wait for the labeler
        uses: lewagon/wait-on-check-action@v1.7.0
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Team Label
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 90

      - name: Verify PR labels
        uses: jesusvasquez333/verify-pr-label-action@v1.4.0
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          valid-labels: "safe to test"
          pull-request-number: "${{ github.event.pull_request.number }}"
          disable-reviews: true # To not auto approve changes

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          # Sonar git blame runs only on the pull_request_target scan below, and blame
          # needs blob contents to drive PR New Code detection. A partial clone
          # (blob:none) left blobs missing, which forced sonar.scm.disabled=true and made
          # SonarCloud report the whole tree as "new code". So do a full clone only on PR
          # runs; keep the blob:none optimization for merge_group / workflow_dispatch,
          # which never run the Sonar scan.
          filter: ${{ github.event_name != 'pull_request_target' && 'blob:none' || '' }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "openmetadata-ui/src/main/resources/ui/.nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Caching NPM dependencies
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-yarn-

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Caching NPM dependencies
        uses: actions/cache@v6
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Antlr4 CLI
        run: |
          sudo make install_antlr_cli
      - name: Install Yarn Packages
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: yarn install
      - name: Run Coverage
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: yarn test:cov-summary
        id: yarn_coverage
      - name: Jest coverage comment
        uses: MishaKav/jest-coverage-comment@v1.0.34
        with:
          coverage-summary-path: ${{env.UI_COVERAGE_DIRECTORY}}/coverage-summary.json
          title: Jest test Coverage
          summary-title: UI tests summary
          badge-title: Coverage
      - name: yarn add sonarqube-scanner
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: npm install -g sonarqube-scanner@^4.3.0
        id: npm_install_sonar_scanner
      - name: SonarCloud Scan On PR
        id: sonar_pr_scan
        # The quality gate is a required PR check, so a failing scan must not kill
        # this job before the coverage comment is posted — ui-sonar-gate below turns
        # the parsed verdict into the check contributors see. The gate verdict is read
        # from the scanner log (not the exit code) so a real New Code failure can be
        # told apart from an upload error / rate limit / timeout, which never returns a
        # "QUALITY GATE STATUS" line and must not block the required check.
        continue-on-error: true
        if: github.event_name == 'pull_request_target' && steps.npm_install_sonar_scanner.outcome == 'success'
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: |
          set +e
          sonar-scanner -Dsonar.host.url=${SONARCLOUD_URL} \
          -Dproject.settings=sonar-project.properties \
          -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
          -Dsonar.pullrequest.branch=$PR_HEAD_REF \
          -Dsonar.pullrequest.base=main \
          -Dsonar.pullrequest.github.repository=OpenMetadata \
          -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }} \
          -Dsonar.pullrequest.provider=github \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=600 2>&1 | tee sonar-output.log
          scan_rc=${PIPESTATUS[0]}
          if grep -q "QUALITY GATE STATUS: PASSED" sonar-output.log; then
            status=passed
          elif grep -q "QUALITY GATE STATUS: FAILED" sonar-output.log; then
            status=failed
          else
            status=error
          fi
          echo "gate_status=$status" >> "$GITHUB_OUTPUT"
          echo "sonar-scanner exit=$scan_rc, gate_status=$status"
          # Never fail the step: ui-sonar-gate decides red/green from gate_status.
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.UI_SONAR_TOKEN }}
          SONARCLOUD_URL: https://sonarcloud.io
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: SonarCloud Scan
        if: github.event_name == 'push' && steps.npm_install_sonar_scanner.outcome == 'success'
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: |
          sonar-scanner -Dsonar.host.url=${SONARCLOUD_URL} \
          -Dproject.settings=sonar-project.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.UI_SONAR_TOKEN }}
          SONARCLOUD_URL: https://sonarcloud.io

  # This job is the one to set as the required status check in branch protection.
  # It always runs and passes when ui-coverage-tests succeeded OR was skipped
  # (i.e. no relevant UI paths changed), so PRs without UI changes are never blocked.
  ui-coverage:
    if: always()
    needs: [ui-coverage-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check coverage result
        run: |
          result="${{ needs.ui-coverage-tests.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "Coverage check passed or was not required for this PR"
          else
            echo "Coverage check failed with status: $result"
            exit 1
          fi

  # Sonar "Clean as You Code" gate, reported through a job that ALWAYS runs.
  #
  # Do not make SonarCloud's own check required instead: the scan is gated
  # behind dorny/paths-filter and the "safe to test" label, so a PR with no UI
  # changes never produces that check and would block forever waiting on it —
  # the exact failure mode the ui-coverage shim above exists to avoid.
  #
  # The gate itself is configured in SonarCloud (conditions on New Code only),
  # so legacy debt can never fail a PR. See docs/ui-code-quality-gate.md.
  ui-sonar-gate:
    if: always()
    needs: [ui-coverage-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check Sonar quality gate
        run: |
          job="${{ needs.ui-coverage-tests.result }}"
          status="${{ needs.ui-coverage-tests.outputs.sonar_gate_status }}"
          event="${{ github.event_name }}"

          # Skipped means no UI paths changed. Pass, exactly like ui-coverage —
          # a required check that never completes blocks the PR forever.
          if [[ "$job" == "skipped" ]]; then
            echo "No UI changes — Sonar gate not applicable."
            exit 0
          fi
          if [[ "$job" != "success" ]]; then
            echo "Upstream coverage job ended with '$job'; the gate could not be evaluated."
            exit 1
          fi

          # push / merge_group never run the PR scan, so there is no verdict to gate.
          if [[ "$event" != "pull_request_target" ]]; then
            echo "Sonar PR scan does not apply to '$event' — nothing to gate."
            exit 0
          fi

          # Only a real New Code gate FAILURE blocks the required check. An "error"
          # (Sonar returned no verdict: upload error / rate limit / timeout / scanner
          # install flake) is infra, not a code problem — warn and stay green.
          case "$status" in
            passed)
              echo "✔ Sonar quality gate passed on new code."
              ;;
            failed)
              echo "✖ Sonar quality gate FAILED on new code."
              echo ""
              echo "Every condition is scoped to the lines this PR adds — the legacy"
              echo "backlog is never in scope. Open the SonarCloud link on this PR and"
              echo "work the New Code tab. See docs/ui-code-quality-gate.md."
              exit 1
              ;;
            *)
              echo "⚠ Sonar did not return a gate verdict (status: '${status:-none}')."
              echo "  Likely a report-upload error, SonarCloud rate limit, or timeout —"
              echo "  not a code issue. Not blocking the required check; re-run to get a"
              echo "  fresh verdict if needed."
              ;;
          esac
