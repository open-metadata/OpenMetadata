name: Queue Conflicts
# Resolves merge-queue conflicts (docs/ci.md, "Conflicts").
#
#   requeue  a `queue conflict` PR (clean against main, clashed only with an entry
#            ahead) goes back in the queue once that entry left, head unchanged
#   scan     lists `merge conflict` PRs not attempted for their current head and
#            dispatches `resolve` for each, within the daily budget
#   resolve  merge main → mechanical resolvers → Claude for the rest (edit-only,
#            conflicted files only) → checks → one merge commit in a git bundle.
#            Holds only the AI credential.
#   publish  re-checks the merge commit with main's code (`git merge-tree`), pushes
#            it fast-forward onto the pinned head, and comments; auto-merge only for
#            a purely mechanical resolution that needs no regeneration.
#
# No job here runs PR code: no build, generator, package manager or script from the
# PR's tree. These events run in main's context, where anything executed could write
# main's caches. The push starts the PR's own CI, which builds and tests the merge
# commit, and auto-merge re-enters the queue only once those checks pass.
#
# vars.CI_CONFLICT_MODE: off | dry-run (default: comment a patch, push nothing) | on.
# Labels added with the default token trigger no workflow (ADR 2026-10-13), hence
# the schedule instead of the label. One PR on demand:
# `gh workflow run ci-conflict-resolve.yml -f pr=<number>`.

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to resolve
        required: true

permissions: {}

concurrency:
  group: queue-conflicts-${{ inputs.pr || github.event_name }}
  cancel-in-progress: false

env:
  MODE: ${{ vars.CI_CONFLICT_MODE || 'dry-run' }}

jobs:
  requeue:
    name: requeue
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && vars.CI_CONFLICT_MODE != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For the gate App's key only, which lives in this main-only environment.
    environment:
      name: ci-ai
      deployment: false
    permissions:
      contents: read
    steps:
      # A re-queue made with the default token may never start merge_group runs
      # (spike S6), so the gate App does it when configured.
      - name: Gate App token
        id: app
        if: ${{ vars.MERGE_GATE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MERGE_GATE_APP_ID }}
          private-key: ${{ secrets.MERGE_GATE_APP_KEY }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Re-queue queue conflicts that cleared
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: python3 .github/scripts/queue_conflicts.py --mode "$MODE" requeue

  scan:
    name: scan
    if: ${{ github.event_name == 'schedule' && vars.CI_CONFLICT_MODE != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dispatch the resolver within the daily budget
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_MAX: ${{ vars.CI_AI_DAILY_CONFLICT_MAX || '8' }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          used=$(gh api "repos/$REPO/actions/workflows/ci-conflict-resolve.yml/runs?event=workflow_dispatch&created=>=$today&per_page=1" --jq .total_count)
          left=$(( DAILY_MAX - used ))
          if (( left <= 0 )); then
            echo "Daily resolver budget used ($used/$DAILY_MAX)."
            exit 0
          fi
          python3 .github/scripts/queue_conflicts.py --mode "$MODE" candidates --limit "$left" --out "$RUNNER_TEMP/candidates.json"
          python3 -c 'import json,sys; [print(c["pr"]) for c in json.load(open(sys.argv[1]))["candidates"]]' "$RUNNER_TEMP/candidates.json" \
            | while read -r pr; do gh workflow run ci-conflict-resolve.yml --repo "$REPO" -f pr="$pr"; done

  resolve:
    name: resolve
    if: ${{ vars.CI_CONFLICT_MODE != 'off' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci-ai
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.result.outputs.state }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - name: Read the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 -I - "$RUNNER_TEMP/pr.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          pr = json.load(open(sys.argv[1]))
          print(f"number={pr['number']}")
          print(f"head_sha={pr['head']['sha']}")
          print(f"head_ref={pr['head']['ref']}")
          print(f"head_repo={pr['head']['repo']['full_name']}")
          PY
      # Main's scripts and agent configuration, never the PR's: a PR could ship
      # hooks or MCP servers that would run inside the agent.
      - name: Checkout trusted tooling (main)
        uses: actions/checkout@v7
        with:
          path: trusted
          persist-credentials: false
      # Out of the workspace, where the agent's file tools cannot write: every step
      # after it runs these copies.
      - name: Keep the tooling out of the agent's reach
        run: cp -R trusted/.github/scripts "$RUNNER_TEMP/tools"
      - name: Checkout the PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # Steps address the PR's tree as data from the workspace root (`git -C pr`,
      # `--repo pr`); none runs from inside it.
      - name: Merge main and resolve mechanically
        id: merge
        env:
          BASE_REPO: ${{ github.repository }}
        run: |
          git -C pr config user.name "openmetadata-ci"
          git -C pr config user.email "ci@open-metadata.org"
          git -C pr fetch --quiet "https://github.com/$BASE_REPO.git" main:refs/remotes/upstream/main
          if git -C pr merge --no-ff --no-commit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$RUNNER_TEMP/tools/conflict_resolvers.py" --repo pr apply --out "$RUNNER_TEMP/plan.json"
          # File names come from the PR: a fixed heredoc delimiter could be closed by
          # a file named after it and forge the outputs below.
          python3 -I - "$RUNNER_TEMP/plan.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, secrets, sys
          plan = json.load(open(sys.argv[1]))["plan"]
          delimiter = f"FILES_{secrets.token_hex(16)}"
          print(f"human={'true' if plan['human'] else 'false'}")
          print(f"needs_model={'true' if plan['ai'] or plan['sensitive'] else 'false'}")
          print(f"files<<{delimiter}")
          print("\n".join(plan["ai"] + plan["sensitive"]))
          print(delimiter)
          PY
      - name: Scrub git credentials
        run: git -C pr config --unset-all http.https://github.com/.extraheader || true
      # The agent can write anywhere in the workspace, .git included, and git runs
      # whatever .git/config or .git/hooks name; the copy is put back after it.
      - name: Keep the repository metadata out of the agent's reach
        id: snapshot
        if: ${{ steps.merge.outputs.needs_model == 'true' }}
        run: cp -R pr/.git "$RUNNER_TEMP/pr.git"
      # The agent runs from the workspace root, not from `pr/`, so a PR's own
      # .claude hooks, settings and MCP servers are never loaded.
      - name: Resolve the rest with Claude
        id: agent
        if: ${{ steps.merge.outputs.clean != 'true' && steps.merge.outputs.human != 'true' && steps.merge.outputs.needs_model == 'true' && vars.CI_AI_MODE == 'on' }}
        # Its outcome is read below: an unfinished run is reported, never published.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # A key from the dedicated Console workspace, whose monthly limit is the
          # hard spend cap. Workload identity can replace it once the pinned action
          # version exposes those inputs.
          anthropic_api_key: ${{ secrets.CI_AI_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are resolving merge conflicts in an OpenMetadata pull request. Work only
            in the `pr` directory. Do not commit, push, stage, or use `gh` — later steps
            do that and check your work.

            `git merge upstream/main` into PR #${{ steps.pr.outputs.number }} stopped with
            conflicts. Generated files, lockfiles and locale JSON are already resolved.
            These files are still conflicted and are the ONLY files you may edit:

            ${{ steps.merge.outputs.files }}

            1. Run `git -C pr log --oneline -n 20 upstream/main -- <file>` and
               `git -C pr log --oneline HEAD -- <file>` to see what each side changed
               and why. Read `trusted/CLAUDE.md` for the repository's conventions.
            2. Resolve each file so BOTH sides' intent survives: the PR's change applied
               to main's current code.
            3. Rules:
               - Never take one whole side of a file. Dropping either side's change is
                 the failure this workflow exists to prevent, and a check compares the
                 lines each side added against your result.
               - For bootstrap/sql migrations keep main's statements as the prefix and
                 append the PR's; keep any statement main requires to stay last, last.
               - Do not reference APIs, helpers or keys that do not exist after the merge.
               - Never leave a conflict marker. Do not edit any other file.
            4. Write `CONFLICT_NOTES.md` in `pr/`: what conflicted, how you resolved it,
               and what a reviewer should check by hand.

            If you cannot resolve a file without guessing the authors' intent, write
            `CONFLICT_ABORT.md` in `pr/` with the reason instead, and stop.
          claude_args: |
            --model ${{ vars.CI_AI_CONFLICT_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --allowedTools "Read,Edit,Write,Grep,Glob,TodoWrite,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(rg:*)"
      - name: Put the repository metadata back
        id: restore
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        run: |
          rm -rf pr/.git
          cp -R "$RUNNER_TEMP/pr.git" pr/.git
      - name: Check, stage and bundle the resolution
        id: result
        if: ${{ always() && steps.merge.outcome == 'success' && (steps.snapshot.outcome == 'skipped' || steps.restore.outcome == 'success') }}
        env:
          CLEAN: ${{ steps.merge.outputs.clean }}
          HUMAN: ${{ steps.merge.outputs.human }}
          NEEDS_MODEL: ${{ steps.merge.outputs.needs_model }}
          AI_MODE: ${{ vars.CI_AI_MODE }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          out="$RUNNER_TEMP/resolution"
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$out"
          state() { echo "state=$1" >> "$GITHUB_OUTPUT"; }
          # Only the agent's own notes: a symlink the PR planted could point anywhere.
          regular() { [ -f "$1" ] && [ ! -L "$1" ]; }
          if [ "$CLEAN" = "true" ]; then state clean; exit 0; fi
          if [ "$HUMAN" = "true" ]; then state human; exit 0; fi
          if [ "$NEEDS_MODEL" = "true" ] && [ "$AI_MODE" != "on" ]; then state needs-model; exit 0; fi
          if regular pr/CONFLICT_ABORT.md; then cp pr/CONFLICT_ABORT.md "$out/abort.md"; rm -f pr/CONFLICT_ABORT.md; state declined; exit 0; fi
          # Edits from an agent that did not finish are never published.
          if [ "$NEEDS_MODEL" = "true" ] && [ "$AGENT_OUTCOME" != "success" ]; then state agent-failed; exit 0; fi
          if regular pr/CONFLICT_NOTES.md; then cp pr/CONFLICT_NOTES.md "$out/notes.md"; fi
          rm -f pr/CONFLICT_NOTES.md pr/CONFLICT_ABORT.md
          python3 "$tools/conflict_resolvers.py" --repo pr check --plan "$RUNNER_TEMP/plan.json" --out "$out/check.json" || { state failed-check; exit 0; }
          python3 "$tools/conflict_resolvers.py" --repo pr finalize --plan "$RUNNER_TEMP/plan.json" --out "$out/finalize.json" || { state failed-check; exit 0; }
          git -C pr -c core.hooksPath=/dev/null commit --quiet --no-edit --no-verify
          git -C pr bundle create "$out/resolution.bundle" "$HEAD_SHA..HEAD"
          git -C pr rev-parse HEAD > "$out/merge-commit.txt"
          cp "$RUNNER_TEMP/plan.json" "$out/plan.json"
          state resolved
      - name: Upload the resolution
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: conflict-resolution-${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/resolution
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish
    needs: resolve
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.state != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish App token
        id: app
        if: ${{ vars.CI_PUBLISH_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_PUBLISH_APP_ID }}
          private-key: ${{ secrets.CI_PUBLISH_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A pattern, not a name: states that end before the bundle upload nothing.
      - uses: actions/download-artifact@v7
        with:
          pattern: conflict-resolution-${{ needs.resolve.outputs.pr }}
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Publish and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.app.outputs.token }}
          STATE: ${{ needs.resolve.outputs.state }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ needs.resolve.outputs.head_repo }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_conflict_resolution.py --artifacts "$RUNNER_TEMP/artifacts"
