# Daily merge-queue flaky-test report: one PDF in #pw-health instead of one Slack
# post per queue run.
#
# Every merge-group run of playwright-postgresql-e2e.yml uploads a
# `playwright-mq-flaky` artifact with its retry passes and their first-attempt
# errors. This rolls up every run in the window, ranks tests by distinct PRs (a
# re-queued PR counts once), splits hits in passing runs from hits in ejected
# runs, and marks tests that are new against the previous 24h and main's flake
# baseline. A dispatched window is at most 48h (GITHUB_TOKEN API budget) and must
# fall within the 14-day artifact retention.
name: Playwright Flaky Daily Report

on:
  schedule:
    # 09:00 IST.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Window start, UTC ISO (2026-09-30 or 2026-09-30T06:00). Empty means 24h before `until`. Max window 48h.
        type: string
        default: ""
      until:
        description: Window end, UTC ISO. Empty means now.
        type: string
        default: ""
      post_to_slack:
        description: Post the report to #pw-health. Off = scan only (job summary + PDF artifact).
        type: boolean
        default: true

permissions:
  # Naming any permission sets every other one to none:
  #   actions  — list merge-group runs and download their flaky artifacts
  #   contents — checkout, and flake-baseline.json on ci/playwright-timing
  actions: read
  contents: read

concurrency:
  group: playwright-flaky-daily-report
  cancel-in-progress: false

jobs:
  report:
    name: Summarise merge-queue flaky tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: ${{ github.workspace }}/flaky-report
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the report
        id: report
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          python3 .github/scripts/playwright_flaky_report.py \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --since "$SINCE" \
            --until "$UNTIL" \
            --channel C0C008ZAK0V \
            --out-dir "$REPORT_DIR"

      # Chrome is preinstalled on ubuntu-latest, so printing needs no new dependency.
      - name: Print the report to PDF
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$REPORT_DIR/report.pdf" "file://$REPORT_DIR/report.html"
          test -s "$REPORT_DIR/report.pdf"

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flaky-report
          path: |
            ${{ env.REPORT_DIR }}/report.pdf
            ${{ env.REPORT_DIR }}/report.md
          retention-days: 14

      - name: Post to Slack (pw-health)
        # Scheduled runs have no inputs, so `inputs.post_to_slack` is empty and they post.
        if: ${{ inputs.post_to_slack != false }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: files.uploadV2
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          # Keep on — the action discards Slack API errors by default.
          errors: true
          payload-file-path: ${{ env.REPORT_DIR }}/slack.json
