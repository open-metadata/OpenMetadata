name: reusable-build-ingestion
on:
  workflow_call:
    inputs:
      ref:
        description: Git commit SHA to build; must match the consuming connector tests
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Build ingestion image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build and pack ingestion image
        run: bash .github/scripts/python_ci_ingestion_image.sh build "$RUNNER_TEMP/python-ci-ingestion.tar.zst"
        shell: bash
      - name: Upload ingestion image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-ci-ingestion-image
          path: ${{ runner.temp }}/python-ci-ingestion.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
