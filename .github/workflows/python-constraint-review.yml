name: Python constraint review
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-constraint-review
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-environment
        with:
          python-version: '3.10'
          profile: dev
      - name: Inspect all setup.py requirements
        run: >-
          python scripts/review_python_constraints.py scan
          --output-dir "$RUNNER_TEMP/python-constraint-review"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-constraint-review
          path: ${{ runner.temp }}/python-constraint-review/
          if-no-files-found: error
          retention-days: 14
  report:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-constraint-review
          path: ${{ runner.temp }}/python-constraint-review
      - name: Update the outstanding upgrade issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/review_python_constraints.py publish
          --repository "$GH_REPOSITORY"
          --report "$RUNNER_TEMP/python-constraint-review/report.json"
