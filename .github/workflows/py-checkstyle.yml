name: Python Checkstyle

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "openmetadata-ui/src/main/resources/ui/playwright/docs/**"

permissions:
  contents: read

concurrency:
  group: py-checkstyle-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  py-checkstyle:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: write
    env:
      FAILURE_HELP: |
        **The Python checkstyle failed.**

        Please run `make py_format` and `py_format_check` in the root of your repository and commit the changes to this PR.
        You can also use [pre-commit](https://pre-commit.com/) to automate the Python code formatting.

        You can install the pre-commit hooks with `make install_test precommit_install`.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ubuntu related dependencies
        run: |
          sudo apt-get update  && sudo apt-get install -y libsasl2-dev unixodbc-dev python3-venv

      - name: Install Python & Openmetadata related dependencies
        run: |
          python3 -m venv env
          source env/bin/activate
          sudo make install_antlr_cli
          make install install_test install_dev

      # Add back linting once we have 10/10 on main
      - name: Code style check
        id: style
        continue-on-error: true
        run: |
          source env/bin/activate
          make generate
          make py_format_check

      # Fork and Dependabot PRs get a read-only token, so they get no comment; everyone gets the
      # job summary and the error annotation from the next step.
      - name: Create a comment in the PR with the instructions
        if: ${{ steps.style.outcome != 'success' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: peter-evans/create-or-update-comment@v1
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.FAILURE_HELP }}

      - name: Python checkstyle failed
        if: steps.style.outcome != 'success'
        run: |
          echo "$FAILURE_HELP" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Python checkstyle failed::Run 'make py_format' in the repository root and commit the changes. The Code style check step shows what failed."
          exit 1
