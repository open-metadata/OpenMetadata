name: Merge queue evidence tests

on:
  pull_request:
    paths:
      - .github/scripts/merge_queue_evidence.py
      - .github/scripts/test_merge_queue_evidence.py
      - .github/scripts/merge_queue_metrics.py
      - .github/actions/ci-test-evidence/**
      - .github/workflows/merge-queue-evidence-tests.yml
      - .github/workflows/merge-queue-dequeue-report.yml
      - .github/workflows/openmetadata-service-unit-tests.yml
      - .github/workflows/integration-tests-mysql-elasticsearch.yml
      - .github/workflows/integration-tests-postgres-opensearch.yml
      - .github/workflows/integration-tests-postgres-elasticsearch-redis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p test_merge_queue_evidence.py -v
