---
name: Merge green backport PRs
# yamllint disable-line rule:comments
run-name: "Auto-merge check for ${{ inputs.pr && format('PR #{0}', inputs.pr) || github.event.check_suite.head_sha }}"

# Second half of the backport pipeline (see backport-labeled-prs.yaml). A
# backport PR that goes green merges itself; a backport PR that goes red stays
# open and pings the author of the PR it was backported from. Nobody has to
# touch a backport that works.
#
# Why this is a separate, event-driven workflow rather than `gh pr merge --auto`:
# auto-merge waits for *required* status checks, and the release branches have
# none configured (`required_status_checks: null` on `1.13` and `2.0`). With no
# required checks, `--auto` merges the PR immediately — before CI has even
# started — which would be worse than the direct push this replaced. So wait for
# real check completions and decide from the actual results.
#
# `check_suite: completed` alone is enough: every check on a PR in this
# repository is a GitHub Actions check run, so there are no third-party commit
# statuses to catch. Adding a `status:` trigger would start a run on every
# status of every commit in the repo to cover a case that does not exist.
#
# Failure mode by design: "all required checks pass" means "every check that
# ran passed". If no check ever reports, this does nothing and the PR stays
# open — a backport is never merged blind. Use the manual dispatch below if a
# PR ever stalls that way.

# yamllint disable-line rule:truthy
on:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Backport PR number to re-evaluate"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the backport PR
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.check_suite.head_sha }}
          INPUT_PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Only ever touch what this pipeline owns. `backport/<target>/pr-<n>`
          # is written by nothing else, and a backport never targets main.
          FILTER='select(.headRefName | startswith("backport/")) | select(.baseRefName != "main")'
          if [ -n "${INPUT_PR:-}" ]; then
            PR=$(gh pr view "$INPUT_PR" --repo "$REPO" \
                   --json number,headRefName,baseRefName,state \
                   --jq "select(.state == \"OPEN\") | $FILTER | .number // empty")
          else
            PR=$(gh pr list --repo "$REPO" --state open --limit 100 \
                   --json number,headRefName,headRefOid,baseRefName \
                   --jq "[.[] | select(.headRefOid == \"$SHA\") | $FILTER][0].number // empty")
          fi
          if [ -z "$PR" ]; then
            echo "No open backport PR to act on; nothing to do."
          else
            echo "Backport PR: #$PR"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Evaluate checks
        id: checks
        if: steps.find.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.find.outputs.pr }}
        run: |
          set -uo pipefail
          # Buckets are gh's own normalisation: pass / fail / pending /
          # skipping / cancel. `gh pr checks` exits non-zero whenever anything
          # is failing or pending, so the exit code is not the signal — the
          # JSON is. Hence the `|| true`.
          BUCKETS=$(gh pr checks "$PR" --repo "$REPO" --json bucket \
                      --jq '[.[].bucket] | unique | join(" ")' 2>/dev/null || true)
          echo "buckets: [${BUCKETS:-none}]"

          if [ -z "$BUCKETS" ]; then
            VERDICT=waiting  # nothing has reported yet
          elif printf '%s' "$BUCKETS" | grep -qw pending; then
            VERDICT=waiting  # still running; a later check_suite event decides
          elif printf '%s' "$BUCKETS" | grep -qwE 'fail|cancel'; then
            VERDICT=failed
          else
            VERDICT=green
          fi
          echo "verdict=$VERDICT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.checks.outputs.verdict == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.find.outputs.pr }}
        run: |
          set -uo pipefail
          # Squash is the only method enabled on these repos, and a backport
          # branch carries exactly one commit, so it is also the faithful one.
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          gh pr comment "$PR" --repo "$REPO" \
            --body "🤖 All checks passed — merged automatically by the backport pipeline."

      # A red backport is the one case that needs a person, so say so where the
      # author will see it. Marker-gated: check events keep arriving after the
      # first failure and this must not become a comment storm.
      - name: Report a red backport
        if: steps.checks.outputs.verdict == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.find.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          MARKER='<!-- backport-automerge-failed -->'
          if gh pr view "$PR" --repo "$REPO" --json comments \
               --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "Already reported on #$PR."
            exit 0
          fi

          # backport-labeled-prs.yaml records the original author in the body.
          # Mentioning them is what actually notifies; the assignee set at
          # creation time is best-effort and may not have stuck.
          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body' \
                     | sed -n 's/^| Author | @\([A-Za-z0-9_-]*\) |.*/\1/p' | head -1)
          BASE=$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName)
          FAILED=$(gh pr checks "$PR" --repo "$REPO" --json bucket,name \
                     --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name]
                           | unique | join(", ")' 2>/dev/null || true)

          gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n🤖 **This backport is red, so it will not merge itself.**%s\n\nFailing: `%s`\n\nThe change is **not** on `%s` yet. You raised the PR this was backported from, so please take a look. Push a fix to this branch and it merges automatically once the checks go green.\n\n<sub>[run log](%s)</sub>' \
            "$MARKER" "${AUTHOR:+ @$AUTHOR}" "${FAILED:-unknown}" "$BASE" "$RUN_URL")"
