name: Write classification model caches

on:
  workflow_call:
    inputs:
      revision:
        description: Exact revision whose model metadata is requested
        type: string
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    cache-mode: read
    outputs:
      models: ${{ steps.discover.outputs.models }}
      python: ${{ steps.matrix.outputs.python }}
      uv: ${{ steps.discover.outputs.uv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          path: requested
          sparse-checkout: |
            ingestion/pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: matrix
        run: |
          matrix=$(python3 scripts/prepare_classification_models.py matrix --project ingestion)
          echo "python=$(jq -r '."discovery-python"' <<< "$matrix")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.matrix.outputs.python }}
      - id: discover
        run: |
          models=$(python scripts/prepare_classification_models.py discover --project requested/ingestion)
          echo "models=$(jq -c '{include}' <<< "$models")" >> "$GITHUB_OUTPUT"
          echo "uv=$(jq -r '.include[0]."uv-version"' <<< "$models")" >> "$GITHUB_OUTPUT"

  write:
    needs: discover
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.workflow == 'Warm classification models' }}
    runs-on: ubuntu-24.04
    cache-mode: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.models) }}
    concurrency:
      group: ${{ matrix.key }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.discover.outputs.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ needs.discover.outputs.uv }}
          enable-cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: restore
        with:
          path: model-cache/model.tar
          key: ${{ matrix.key }}
      - name: Prepare cache miss after acquiring writer slot
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          REQUIREMENT: ${{ matrix.requirement }}
          UV_VERSION: ${{ matrix.uv-version }}
        run: python scripts/prepare_classification_models.py prepare --requirement "$REQUIREMENT" --uv-version "$UV_VERSION" --output model-cache/model.tar
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          path: model-cache/model.tar
          key: ${{ matrix.key }}
