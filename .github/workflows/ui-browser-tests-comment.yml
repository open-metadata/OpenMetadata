# Posts the UI browser-test report on the pull request. The test workflow runs
# read-only, so it leaves the report as an artifact; this runs from the default
# branch with write access and never executes code from the pull request.
name: Publish UI Browser Tests PR Comment

on:
  workflow_run:
    workflows:
      - UI Browser Tests
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ui-browser-tests-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download the report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: browser-tests-comment
          path: ${{ runner.temp }}/browser-tests-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The artifact comes from pull-request code: accept only a PR number that
      # belongs to this run's head branch, and post the markdown as data.
      - name: Comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DIR: ${{ runner.temp }}/browser-tests-comment
        run: |
          pr=$(tr -dc '0-9' < "$DIR/pr-number")
          [ -n "$pr" ] || { echo "No PR number"; exit 0; }
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$pr is at $head, not this run's $HEAD_SHA; skipping"
            exit 0
          fi
          body="$DIR/comment.md"
          head -c 60000 "$body" > "$DIR/body.md"
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- ui-browser-tests -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$DIR/body.md" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@"$DIR/body.md" > /dev/null
          fi
