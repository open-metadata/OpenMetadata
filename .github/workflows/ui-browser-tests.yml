# UI integration tests (Vitest Browser Mode + MSW). No backend; every
# /api call is mocked, so the only network use is installing deps and Chromium.
#
# A pull request runs only the test files that execute the code it changes
# (scripts/select-browser-tests.mjs), using the map of what each test file
# executes from the latest passing full run (the map is an artifact, never
# committed). A merge-queue entry selects the same way. Only the run on main
# every 6 hours, or one started by hand, runs every test file: it writes the
# map and catches a selection miss within hours of the merge. A missing
# map, or a change to test setup, configs or dependencies, runs everything on
# the pull request too.
#
# Core components are treated like a library: a change there runs core's own
# tests (the `core components` job) and selects no browser tests.
name: UI Browser Tests

on:
  # Pull requests and merge-queue entries: called by ci-pr.yml and ci-merge-queue.yml.
  workflow_call: null
  # A full run on main every 6 hours (or run by hand) keeps the map fresh and
  # catches what a selection missed.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# github.workflow is the caller's name when called, so this never shares a group
# with the scheduled run.
concurrency:
  group: ${{ github.workflow }}-ui-browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UI_DIR: openmetadata-ui/src/main/resources/ui
  CORE_DIR: openmetadata-ui-core-components/src/main/resources/ui
  # At most this many runners; with ~1,070 tests three ran past 10 min each.
  SHARDS: 5
  # Test files per runner when only some run (130 files over 5 runners).
  FILES_PER_SHARD: 26
  # What the scheduled run must see changed since the last full run to run at
  # all. Pull requests and merge-queue entries are selected by the caller's
  # plan job (.github/ui-ci/paths.yml).
  UI_PATHS: >-
    openmetadata-ui/src/main/resources/ui/
    openmetadata-ui-core-components/src/main/resources/ui/
    .github/workflows/ui-browser-tests.yml
    .github/actions/ui-browser-setup/

jobs:
  select:
    name: select browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Downloads the impact map from the latest passing full run.
      actions: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      summary: ${{ steps.select.outputs.summary }}
      shards: ${{ steps.select.outputs.shards }}
      shard-count: ${{ steps.select.outputs.shard-count }}
      core: ${{ steps.select.outputs.core }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit: HEAD^1 is the base.
          fetch-depth: 2
      - uses: ./.github/actions/ui-browser-select
        id: select
  core-components:
    name: core components
    needs: select
    if: needs.select.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
      - uses: ./.github/actions/ui-core-components
  browser-tests:
    name: browser tests + coverage (shard ${{ matrix.shard }})
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ui-browser-setup
      - uses: actions/download-artifact@v8
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}
      - uses: ./.github/actions/ui-browser-run
        with:
          mode: ${{ needs.select.outputs.mode }}
          shard: ${{ matrix.shard }}
          shard-count: ${{ needs.select.outputs.shard-count }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-blob-${{ matrix.shard }}
          path: ${{ env.UI_DIR }}/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-impact-${{ matrix.shard }}
          path: ${{ env.UI_DIR }}/.impact/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
  browser-tests-report:
    name: browser tests + coverage
    needs: [select, browser-tests]
    # Runs (and fails) when select fails: a skipped required check would pass
    # with no tests run.
    if: always() && (needs.select.result != 'success' || needs.select.outputs.mode != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail if test selection failed
        if: needs.select.result != 'success'
        run: |
          echo "::error::Browser-test selection failed, so no tests ran."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The changed-code coverage diffs against the base (HEAD^1).
          fetch-depth: 2
      - uses: ./.github/actions/ui-browser-setup
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-blob-*
          merge-multiple: true
          path: ${{ env.UI_DIR }}/.vitest-reports
      - uses: actions/download-artifact@v8
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}
      - uses: ./.github/actions/ui-browser-report
      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          # One folder per shard: each names its file after its process id,
          # which can repeat across runners.
          pattern: browser-impact-*
          path: impact
      # Only a passing run on code that reaches main is trusted: a failed test
      # may have stopped before reaching the code it covers. A full run writes
      # the map afresh; a selected merge-queue entry replaces the entries of the
      # tests it ran, so the map stays current between full runs.
      - name: Build the impact map
        id: map
        if: needs.browser-tests.result == 'success' && github.event_name != 'pull_request'
        # A map that cannot be built leaves the previous one; it never fails the check.
        continue-on-error: true
        env:
          MODE: ${{ needs.select.outputs.mode }}
        run: |
          cat impact/*/*.jsonl | jq -s 'map({(.test): .used}) | add // {}' > "$RUNNER_TEMP/fresh.json"
          if [ "$MODE" = "selected" ] && [ -f "$UI_DIR/impact-map.json" ]; then
            jq -s '.[0] * .[1]' "$UI_DIR/impact-map.json" "$RUNNER_TEMP/fresh.json" > "$RUNNER_TEMP/map.json"
          else
            cp "$RUNNER_TEMP/fresh.json" "$RUNNER_TEMP/map.json"
          fi
          mv "$RUNNER_TEMP/map.json" "$UI_DIR/impact-map.json"
          echo "Impact map: $(jq length "$UI_DIR/impact-map.json") test files, $(jq length "$RUNNER_TEMP/fresh.json") from this run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.map.outcome == 'success'
        with:
          name: browser-impact-map
          path: ${{ env.UI_DIR }}/impact-map.json
          retention-days: 30
      - name: Fail if any shard failed
        if: always() && needs.browser-tests.result != 'success'
        run: exit 1

  # GitHub emails only the last person to edit the schedule when a scheduled
  # run fails. A failed full run on main is how a selection miss surfaces, so
  # it goes to #pw-health, with the daily Playwright report.
  notify:
    needs: [select, browser-tests, browser-tests-report]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Slack on failure
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C0C008ZAK0V",
              "text": "🔥 *UI Browser Tests* full run failed on `main`: a pull request may have merged a regression its browser-test selection missed.\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
