# UI integration tests (Vitest Browser Mode + MSW). No backend; every
# /api call is mocked, so the only network use is installing deps and Chromium.
name: UI Browser Tests

on:
  pull_request:
    paths:
      - "openmetadata-ui/src/main/resources/ui/**"
      - "openmetadata-ui-core-components/src/main/resources/ui/**"
      - ".github/workflows/ui-browser-tests.yml"
      - ".github/actions/ui-browser-setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  UI_DIR: openmetadata-ui/src/main/resources/ui

jobs:
  browser-tests:
    name: browser tests + coverage
    # Playwright 1.57 supports Ubuntu up to 24.04; ubuntu-latest moved past it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ui-browser-setup
      - name: Run browser tests with coverage
        id: tests
        working-directory: ${{ env.UI_DIR }}
        continue-on-error: true
        run: |
          yarn test:ui:coverage
      # Pull-request jobs are read-only, so results go to the job summary.
      - name: Summary
        if: always()
        working-directory: ${{ env.UI_DIR }}
        run: |
          {
            echo "### UI browser tests"
            jq -r '.total | "Lines \(.lines.pct)% · Statements \(.statements.pct)% · Branches \(.branches.pct)% · Functions \(.functions.pct)%"' \
              src/test/browser/coverage/coverage-summary.json 2>/dev/null || echo "No coverage summary."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure screenshots
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-failures
          path: |
            ${{ env.UI_DIR }}/src/**/__screenshots__/**
            ${{ env.UI_DIR }}/.vitest-attachments/**
          if-no-files-found: ignore
      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
