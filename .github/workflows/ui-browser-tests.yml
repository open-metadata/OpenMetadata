# UI integration tests (Vitest Browser Mode + MSW). No backend; every
# /api call is mocked, so the only network use is installing deps and Chromium.
#
# A pull request runs only the test files that execute the code it changes
# (scripts/select-browser-tests.mjs), using the map of what each test file
# executes from the latest passing full run (the map is an artifact, never
# committed). A merge-queue entry selects the same way. Only the run on main
# every 6 hours, or one started by hand, runs every test file: it writes the
# map and catches a selection miss within hours of the merge. A missing
# map, or a change to test setup, configs or dependencies, runs everything on
# the pull request too.
#
# Core components are treated like a library: a change there runs core's own
# tests (the `core components` job) and selects no browser tests.
name: UI Browser Tests

on:
  pull_request:
    paths:
      - "openmetadata-ui/src/main/resources/ui/**"
      - "openmetadata-ui-core-components/src/main/resources/ui/**"
      - ".github/workflows/ui-browser-tests.yml"
      - ".github/actions/ui-browser-setup/**"
  # Without the merge queue, a full run on main every 6 hours (or run by hand)
  # keeps the map fresh and catches what a selection missed.
  schedule:
    - cron: "0 */6 * * *"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UI_DIR: openmetadata-ui/src/main/resources/ui
  CORE_DIR: openmetadata-ui-core-components/src/main/resources/ui
  # At most this many runners; with ~1,070 tests three ran past 10 min each.
  SHARDS: 5
  # Test files per runner when only some run (130 files over 5 runners).
  FILES_PER_SHARD: 26
  # What a merge-queue entry must touch to select browser tests at all
  # (merge_group has no `paths` filter). A core change that breaks the app
  # is caught by the scheduled full run.
  UI_PATHS: >-
    openmetadata-ui/src/main/resources/ui/
    openmetadata-ui-core-components/src/main/resources/ui/
    .github/workflows/ui-browser-tests.yml
    .github/actions/ui-browser-setup/

jobs:
  select:
    name: select browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Downloads the impact map from the latest passing full run.
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      summary: ${{ steps.plan.outputs.summary }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      core: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit: HEAD^1 is the base.
          fetch-depth: 2
      - name: Changed areas
        id: changes
        env:
          BASE: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # A scheduled run compares against the last passing scheduled or
            # manual run, and is skipped when no UI file changed since.
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ui-browser-tests.yml/runs?branch=main&status=success&per_page=30" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty')
            # Comparing the two trees needs only the two commits, not the history between.
            if [ -n "$last" ] && git fetch --no-tags --depth=1 origin "$last"; then
              changed=$(git diff --name-only "$last" HEAD)
            else
              changed="$UI_DIR/"
            fi
          else
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          ui=false
          for prefix in $UI_PATHS; do
            if grep -q "^$prefix" <<< "$changed"; then ui=true; fi
          done
          core=false
          if grep -q "^$CORE_DIR/" <<< "$changed"; then core=true; fi
          { echo "ui=$ui"; echo "core=$core"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
      # Only esbuild is needed to read the import graph; the full UI install
      # builds core components first.
      - name: Install esbuild
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          version=$(awk '/^"?esbuild@/ {found=1} found && /^  version / {gsub(/"/, "", $2); print $2; exit}' "$UI_DIR/yarn.lock")
          mkdir -p "$RUNNER_TEMP/esbuild"
          cd "$RUNNER_TEMP/esbuild"
          echo '{"private": true}' > package.json
          yarn add --silent "esbuild@$version"
          echo "ESBUILD_PATH=$RUNNER_TEMP/esbuild/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
      # The map travels as an artifact of the latest passing run on code that
      # reached main: a scheduled or manual run on main, or a merge-queue entry.
      # A pull request's map reflects code that may never merge (or a fork's
      # unreviewed code) and could hide tests from every later pull request.
      - name: Download the impact map from the latest full run
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Queried per event, so pull-request runs cannot push a good map off
          # the list while main's full run stays red; newest first across them.
          runs=$(for query in "event=schedule&branch=main" "event=workflow_dispatch&branch=main" "event=merge_group"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ui-browser-tests.yml/runs?status=success&per_page=50&$query" \
              --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\") | \"\\(.created_at) \\(.id)\""
          done | sort -r | cut -d' ' -f2)
          for run in $runs; do
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n browser-impact-map -D "$UI_DIR" 2>/dev/null; then
              echo "Impact map from run $run" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
      - name: Test the selection script
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: ${{ env.UI_DIR }}
        run: |
          node --test scripts/select-browser-tests.test.mjs scripts/browser-tests-report.test.mjs
      - name: Select tests
        id: plan
        working-directory: ${{ env.UI_DIR }}
        env:
          BASE: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ] && [ "${{ steps.changes.outputs.ui }}" = "false" ]; then
            echo '{"mode": "none", "reason": "no UI change in this merge-queue entry", "tests": [], "uncovered": []}' > selection.json
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.changes.outputs.ui }}" = "false" ]; then
            echo '{"mode": "none", "reason": "no UI change since the last full run", "tests": [], "uncovered": []}' > selection.json
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            # A pull request's merge commit has its base at HEAD^1; a merge-queue
            # group may batch several pull requests, so it diffs from the group's base.
            node scripts/select-browser-tests.mjs --map impact-map.json --base "$BASE" --out selection.json \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '{"mode": "all", "reason": "full run on ${{ github.event_name }}", "tests": [], "uncovered": []}' > selection.json
          fi
          mode=$(jq -r .mode selection.json)
          count=$(jq '.tests | length' selection.json)
          shard_count=0
          if [ "$mode" = "all" ]; then
            shard_count=$SHARDS
          elif [ "$mode" = "selected" ]; then
            shard_count=$(( (count + FILES_PER_SHARD - 1) / FILES_PER_SHARD ))
            shard_count=$(( shard_count > SHARDS ? SHARDS : shard_count ))
          fi
          {
            echo "mode=$mode"
            echo "summary=$(jq -r .reason selection.json)"
            echo "shard-count=$shard_count"
            echo "shards=$(jq -cn --argjson n "$shard_count" '[range(1; $n + 1)]')"
          } >> "$GITHUB_OUTPUT"
      # A merge-queue entry carries its map along, to update it for the tests it ran.
      - uses: actions/upload-artifact@v7
        with:
          name: browser-selection
          path: |
            ${{ env.UI_DIR }}/selection.json
            ${{ github.event_name == 'merge_group' && format('{0}/impact-map.json', env.UI_DIR) || '' }}
          retention-days: 1
      # When nothing runs, the report job is skipped; say why in the summary.
      - name: Report that no browser test ran
        if: github.event_name == 'pull_request' && steps.plan.outputs.mode == 'none'
        working-directory: ${{ env.UI_DIR }}
        run: |
          {
            echo '### UI browser tests'
            echo
            echo "**Ran:** none ($(jq -r .reason selection.json))"
            uncovered=$(jq -r '.uncovered[] | "- `\(.)`"' selection.json)
            if [ -n "$uncovered" ]; then
              echo
              echo '<details><summary>Changed files no browser test loads</summary>'
              echo
              echo "$uncovered"
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Core components' own tests, run whenever core changes. A core change
  # selects no browser tests, so this is its gate.
  core-components:
    name: core components
    needs: select
    if: needs.select.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
      - name: Install
        working-directory: ${{ env.CORE_DIR }}
        run: |
          for attempt in 1 2 3; do
            YARN_HTTP_TIMEOUT=120000 yarn install --immutable && exit 0
            echo "yarn install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - name: Test
        working-directory: ${{ env.CORE_DIR }}
        run: yarn test
      - name: Build
        working-directory: ${{ env.CORE_DIR }}
        run: yarn build

  browser-tests:
    name: browser tests + coverage (shard ${{ matrix.shard }})
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ui-browser-setup
      - uses: actions/download-artifact@v8
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}
      - name: Run browser tests with coverage
        id: tests
        working-directory: ${{ env.UI_DIR }}
        continue-on-error: true
        env:
          # Runs on code that reaches main record what each test file executes;
          # a passing one writes (full run) or updates (queue entry) the map.
          # Pull requests skip it: their map is never used.
          BROWSER_IMPACT_DIR: ${{ github.event_name != 'pull_request' && format('{0}/{1}/.impact', github.workspace, env.UI_DIR) || '' }}
        # The blob report carries this shard's results and coverage for the
        # merge in browser-tests-report.
        run: |
          files=()
          if [ "${{ needs.select.outputs.mode }}" = "selected" ]; then
            mapfile -t files < <(jq -r '.tests[]' selection.json)
          fi
          yarn test:ui:coverage --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard-count }} \
            --passWithNoTests --reporter=default --reporter=blob "${files[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-blob-${{ matrix.shard }}
          path: ${{ env.UI_DIR }}/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-impact-${{ matrix.shard }}
          path: ${{ env.UI_DIR }}/.impact/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload failure screenshots
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-failures-${{ matrix.shard }}
          path: |
            ${{ env.UI_DIR }}/src/**/__screenshots__/**
            ${{ env.UI_DIR }}/.vitest-attachments/**
          if-no-files-found: ignore
      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1

  # Merges the shards into one result. A pull request gets one report in the
  # job summary (PR jobs post no comments, ADR:2026-11-10-pr-jobs-never-receive-credentials):
  # what ran and why, the result, and the changed code the tests executed. A passing run publishes
  # the impact map.
  browser-tests-report:
    name: browser tests + coverage
    needs: [select, browser-tests]
    # Runs (and fails) when select fails: a skipped required check would pass
    # with no tests run.
    if: always() && (needs.select.result != 'success' || needs.select.outputs.mode != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail if test selection failed
        if: needs.select.result != 'success'
        run: |
          echo "::error::Browser-test selection failed, so no tests ran."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The changed-code coverage diffs against the base (HEAD^1).
          fetch-depth: 2
      - uses: ./.github/actions/ui-browser-setup
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-blob-*
          merge-multiple: true
          path: ${{ env.UI_DIR }}/.vitest-reports
      - uses: actions/download-artifact@v8
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}
      - name: Merge shard reports
        working-directory: ${{ env.UI_DIR }}
        run: |
          npx vitest --config vitest.browser.config.ts --merge-reports --coverage \
            --reporter=default --reporter=junit \
            --outputFile.junit=src/test/browser/junit.xml
      - name: Write the report
        if: always() && needs.select.result == 'success' && github.event_name == 'pull_request'
        working-directory: ${{ env.UI_DIR }}
        run: |
          node scripts/browser-tests-report.mjs --base HEAD^1 --selection selection.json \
            --junit src/test/browser/junit.xml \
            --coverage src/test/browser/coverage/coverage-final.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          # One folder per shard: each names its file after its process id,
          # which can repeat across runners.
          pattern: browser-impact-*
          path: impact
      # Only a passing run on code that reaches main is trusted: a failed test
      # may have stopped before reaching the code it covers. A full run writes
      # the map afresh; a selected merge-queue entry replaces the entries of the
      # tests it ran, so the map stays current between full runs.
      - name: Build the impact map
        id: map
        if: needs.browser-tests.result == 'success' && github.event_name != 'pull_request'
        # A map that cannot be built leaves the previous one; it never fails the check.
        continue-on-error: true
        env:
          MODE: ${{ needs.select.outputs.mode }}
        run: |
          cat impact/*/*.jsonl | jq -s 'map({(.test): .used}) | add // {}' > "$RUNNER_TEMP/fresh.json"
          if [ "$MODE" = "selected" ] && [ -f "$UI_DIR/impact-map.json" ]; then
            jq -s '.[0] * .[1]' "$UI_DIR/impact-map.json" "$RUNNER_TEMP/fresh.json" > "$RUNNER_TEMP/map.json"
          else
            cp "$RUNNER_TEMP/fresh.json" "$RUNNER_TEMP/map.json"
          fi
          mv "$RUNNER_TEMP/map.json" "$UI_DIR/impact-map.json"
          echo "Impact map: $(jq length "$UI_DIR/impact-map.json") test files, $(jq length "$RUNNER_TEMP/fresh.json") from this run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.map.outcome == 'success'
        with:
          name: browser-impact-map
          path: ${{ env.UI_DIR }}/impact-map.json
          retention-days: 30
      - name: Fail if any shard failed
        if: always() && needs.browser-tests.result != 'success'
        run: exit 1

  # GitHub emails only the last person to edit the schedule when a scheduled
  # run fails. A failed full run on main is how a selection miss surfaces, so
  # it goes to #pw-health, with the daily Playwright report.
  notify:
    needs: [select, browser-tests, browser-tests-report]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Slack on failure
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C0C008ZAK0V",
              "text": "🔥 *UI Browser Tests* full run failed on `main`: a pull request may have merged a regression its browser-test selection missed.\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
