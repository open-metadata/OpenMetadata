# UI integration tests (Vitest Browser Mode + MSW). No backend; every
# /api call is mocked, so the only network use is installing deps and Chromium.
#
# A pull request runs only the test files that execute the code it changes
# (scripts/select-browser-tests.mjs), using the map of what each test file
# executes from the latest full merge-queue run. The merge queue runs every
# test file, so nothing a selection misses reaches main. A missing map, or a
# change to test setup, configs, dependencies or core components, runs
# everything on the pull request too.
name: UI Browser Tests

on:
  pull_request:
    paths:
      - "openmetadata-ui/src/main/resources/ui/**"
      - "openmetadata-ui-core-components/src/main/resources/ui/**"
      - ".github/workflows/ui-browser-tests.yml"
      - ".github/actions/ui-browser-setup/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UI_DIR: openmetadata-ui/src/main/resources/ui
  # At most this many runners; with ~1,070 tests three ran past 10 min each.
  SHARDS: 5
  # Test files per runner when only some run (130 files over 5 runners).
  FILES_PER_SHARD: 26
  # What a change must touch for the merge queue to run the suite
  # (merge_group has no `paths` filter).
  UI_PATHS: >-
    openmetadata-ui/src/main/resources/ui/
    openmetadata-ui-core-components/src/main/resources/ui/
    .github/workflows/ui-browser-tests.yml
    .github/actions/ui-browser-setup/

jobs:
  select:
    name: select browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Downloads the impact map from the latest merge-queue run.
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      summary: ${{ steps.plan.outputs.summary }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit: HEAD^1 is the base.
          fetch-depth: 2
      - name: Changed files in the merge-queue entry
        id: queue
        if: github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          ui=false
          for prefix in $UI_PATHS; do
            if grep -q "^$prefix" <<< "$changed"; then ui=true; fi
          done
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
      # Only esbuild is needed to read the import graph; the full UI install
      # builds core components first.
      - name: Install esbuild
        if: github.event_name == 'pull_request'
        run: |
          version=$(awk '/^"?esbuild@/ {found=1} found && /^  version / {gsub(/"/, "", $2); print $2; exit}' "$UI_DIR/yarn.lock")
          mkdir -p "$RUNNER_TEMP/esbuild"
          cd "$RUNNER_TEMP/esbuild"
          echo '{"private": true}' > package.json
          yarn add --silent "esbuild@$version"
          echo "ESBUILD_PATH=$RUNNER_TEMP/esbuild/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
      # Merge-queue runs are on temporary branches whose caches a pull request
      # cannot read, so the map travels as an artifact of the latest full run.
      - name: Download the impact map from the merge queue
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ui-browser-tests.yml \
              --event merge_group --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n browser-impact-map -D "$UI_DIR" 2>/dev/null; then
              echo "Impact map from merge-queue run $run" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
      - name: Test the selection script
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.UI_DIR }}
        run: |
          node --test scripts/select-browser-tests.test.mjs scripts/browser-tests-report.test.mjs
      - name: Select tests
        id: plan
        working-directory: ${{ env.UI_DIR }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/select-browser-tests.mjs --map impact-map.json --base HEAD^1 --out selection.json \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.queue.outputs.ui }}" = "false" ]; then
            echo '{"mode": "none", "reason": "no UI change in this merge-queue entry", "tests": [], "uncovered": []}' > selection.json
          else
            echo '{"mode": "all", "reason": "full run on ${{ github.event_name }}", "tests": [], "uncovered": []}' > selection.json
          fi
          mode=$(jq -r .mode selection.json)
          count=$(jq '.tests | length' selection.json)
          shard_count=0
          if [ "$mode" = "all" ]; then
            shard_count=$SHARDS
          elif [ "$mode" = "selected" ]; then
            shard_count=$(( (count + FILES_PER_SHARD - 1) / FILES_PER_SHARD ))
            shard_count=$(( shard_count > SHARDS ? SHARDS : shard_count ))
          fi
          {
            echo "mode=$mode"
            echo "summary=$(jq -r .reason selection.json)"
            echo "shard-count=$shard_count"
            echo "shards=$(jq -cn --argjson n "$shard_count" '[range(1; $n + 1)]')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}/selection.json
          retention-days: 1

  browser-tests:
    name: browser tests + coverage (shard ${{ matrix.shard }})
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ui-browser-setup
      - uses: actions/download-artifact@v7
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}
      - name: Run browser tests with coverage
        id: tests
        working-directory: ${{ env.UI_DIR }}
        continue-on-error: true
        env:
          # Every full run records what each test file executes; the merge
          # queue's becomes the impact map pull requests select from.
          BROWSER_IMPACT_DIR: ${{ needs.select.outputs.mode == 'all' && format('{0}/{1}/.impact', github.workspace, env.UI_DIR) || '' }}
        # The blob report carries this shard's results and coverage for the
        # merge in browser-tests-report.
        run: |
          files=()
          if [ "${{ needs.select.outputs.mode }}" = "selected" ]; then
            mapfile -t files < <(jq -r '.tests[]' selection.json)
          fi
          yarn test:ui:coverage --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard-count }} \
            --passWithNoTests --reporter=default --reporter=blob "${files[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-blob-${{ matrix.shard }}
          path: ${{ env.UI_DIR }}/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always() && needs.select.outputs.mode == 'all'
        with:
          name: browser-impact-${{ matrix.shard }}
          path: ${{ env.UI_DIR }}/.impact/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload failure screenshots
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-failures-${{ matrix.shard }}
          path: |
            ${{ env.UI_DIR }}/src/**/__screenshots__/**
            ${{ env.UI_DIR }}/.vitest-attachments/**
          if-no-files-found: ignore
      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1

  # Merges the shards into one result. A pull request gets one comment: what
  # ran and why, the result, and the changed code the tests executed. A full
  # run publishes the impact map.
  browser-tests-report:
    name: browser tests + coverage
    needs: [select, browser-tests]
    if: always() && needs.select.outputs.mode != 'none' && needs.select.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The changed-code coverage diffs against the base (HEAD^1).
          fetch-depth: 2
      - uses: ./.github/actions/ui-browser-setup
      - uses: actions/download-artifact@v7
        with:
          pattern: browser-blob-*
          merge-multiple: true
          path: ${{ env.UI_DIR }}/.vitest-reports
      - uses: actions/download-artifact@v7
        with:
          name: browser-selection
          path: ${{ env.UI_DIR }}
      - name: Merge shard reports
        working-directory: ${{ env.UI_DIR }}
        run: |
          npx vitest --config vitest.browser.config.ts --merge-reports --coverage \
            --reporter=default --reporter=junit \
            --outputFile.junit=src/test/browser/junit.xml
      - name: Write the report
        if: always() && github.event_name == 'pull_request'
        working-directory: ${{ env.UI_DIR }}
        run: |
          node scripts/browser-tests-report.mjs --base HEAD^1 --selection selection.json \
            --junit src/test/browser/junit.xml \
            --coverage src/test/browser/coverage/coverage-final.json > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      # A fork PR's token cannot comment; its report stays in the job summary.
      - name: Comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Edit our own marked comment so each push updates it in place.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- ui-browser-tests -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
      - uses: actions/download-artifact@v7
        if: needs.select.outputs.mode == 'all'
        with:
          # One folder per shard: each names its file after its process id,
          # which can repeat across runners.
          pattern: browser-impact-*
          path: impact
      # Only a fully passing run is trusted as the map: a failed test may have
      # stopped before reaching the code it covers.
      - name: Build the impact map
        if: needs.select.outputs.mode == 'all' && needs.browser-tests.result == 'success'
        run: |
          cat impact/*/*.jsonl | jq -s 'map({(.test): .used}) | add' > "$UI_DIR/impact-map.json"
          echo "Impact map: $(jq length "$UI_DIR/impact-map.json") test files" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: needs.select.outputs.mode == 'all' && needs.browser-tests.result == 'success'
        with:
          name: browser-impact-map
          path: ${{ env.UI_DIR }}/impact-map.json
          retention-days: 30
      - name: Fail if any shard failed
        if: always() && needs.browser-tests.result != 'success'
        run: exit 1
