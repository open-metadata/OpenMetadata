name: airflow-apis-tests
on:
  pull_request_target:
    types: [labeled, opened, synchronize, reopened, ready_for_review]
    paths:
      - 'openmetadata-airflow-apis/**'
      - 'ingestion/uv.lock'
      - 'ingestion/pyproject.toml'
      - 'ingestion/setup.py'
      - 'scripts/python_environment.py'
      - '.github/scripts/python_ci.py'
      - '.github/actions/setup-python-environment/**'
      - '.github/actions/setup-openmetadata-test-environment/**'
      - '.github/workflows/airflow-apis-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airflow-apis-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name != github.repository) }}

env:
  SONAR_OPTS: >-
    -Dproject.settings=openmetadata-airflow-apis/sonar-project.properties
    -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
    -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
    -Dsonar.pullrequest.github.repository=OpenMetadata
    -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
    -Dsonar.pullrequest.provider=github

jobs:
  airflow-apis-tests:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test') }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
    - name: Wait for the labeler
      uses: lewagon/wait-on-check-action@v1.9.1
      if: ${{ github.event_name == 'pull_request_target' }}
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        check-name: Team Label
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 90

    - name: Verify PR labels
      uses: jesusvasquez333/verify-pr-label-action@v1.4.0
      if: ${{ github.event_name == 'pull_request_target' }}
      with:
        github-token: '${{ secrets.GITHUB_TOKEN }}'
        valid-labels: 'safe to test'
        pull-request-number: '${{ github.event.pull_request.number }}'
        disable-reviews: true  # To not auto approve changes

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        allow-unsafe-pr-checkout: true
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - name: Setup Openmetadata Test Environment
      uses: ./.github/actions/setup-openmetadata-test-environment
      with:
        python-version: '3.10'
        python-profile: api
        args: '-m no-ui'

    - name: Run Python Tests & Record Coverage
      run: |
        source env/bin/activate
        make coverage_apis
        rm pom.xml
        # The scanner runs in the module directory; coverage runs from the repository root.
        sed -i 's|filename="openmetadata-airflow-apis/|filename="|g' openmetadata-airflow-apis/ci-coverage.xml

    - name: Push Results in PR to Sonar
      id: push-to-sonar
      if: ${{ github.event_name == 'pull_request_target' }}
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@v7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.AIRFLOW_APIS_SONAR_TOKEN }}
      with:
        projectBaseDir: openmetadata-airflow-apis/
        args: ${{ env.SONAR_OPTS }}

    # next two steps are for retrying "Push Results in PR to Sonar" step in case it fails
    - name: Wait to retry 'Push Results in PR to Sonar'
      if: ${{ github.event_name == 'pull_request_target' && steps.push-to-sonar.outcome != 'success' }}
      run: sleep 20s
      shell: bash

    - name: Retry 'Push Results in PR to Sonar'

      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@v7
      if: ${{ github.event_name == 'pull_request_target' && steps.push-to-sonar.outcome != 'success' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.AIRFLOW_APIS_SONAR_TOKEN }}
      with:
        projectBaseDir: openmetadata-airflow-apis/
        args: ${{ env.SONAR_OPTS }}

    - name: Push Results to Sonar
      uses: SonarSource/sonarqube-scan-action@v7
      if: ${{ github.event_name == 'push' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.AIRFLOW_APIS_SONAR_TOKEN }}
      with:
        projectBaseDir: openmetadata-airflow-apis/
        args: -Dproject.settings=openmetadata-airflow-apis/sonar-project.properties
