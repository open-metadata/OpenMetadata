name: airflow-apis-tests
on:
  push:
    branches: ["1.13"]
    paths:
      - 'openmetadata-airflow-apis/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'openmetadata-airflow-apis/**'

permissions:
  contents: read

concurrency:
  group: airflow-apis-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  airflow-apis-tests:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        filter: blob:none

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Ubuntu dependencies
      run: |
        # stop relying on apt cache of GitHub runners
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev python3-venv librdkafka-dev gcc libsasl2-dev build-essential libssl-dev libffi-dev \
        librdkafka-dev unixodbc-dev libevent-dev libkrb5-dev

    - name: Generate models
      run: |
        python3 -m venv env
        source env/bin/activate
        sudo make install_antlr_cli
        make install_dev generate

    - name: Install open-metadata dependencies
      run: |
        source env/bin/activate
        make install_all install_test

    - name: Start Server and Ingest Sample Data
      uses: nick-fields/retry@v3.0.2
      env:
        INGESTION_DEPENDENCY: "mysql,elasticsearch,sample-data"
      with:
        timeout_minutes: 60
        max_attempts: 2
        retry_on: error
        command: ./docker/run_local_docker.sh -m no-ui

    - name: Run Python Tests & Record Coverage
      run: |
        source env/bin/activate
        make install_apis
        make coverage_apis
        rm pom.xml
        # fix coverage xml report for github
        sed -i 's/openmetadata_managed_apis/\/github\/workspace\/openmetadata-airflow-apis\/openmetadata_managed_apis/g' openmetadata-airflow-apis/ci-coverage.xml

    - name: Upload coverage for trusted Sonar analysis
      uses: actions/upload-artifact@v4
      with:
        name: airflow-apis-coverage
        path: openmetadata-airflow-apis/ci-coverage.xml
        retention-days: 1

  airflow-apis-sonar:
    needs: airflow-apis-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/1.13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: airflow-apis-coverage
          path: openmetadata-airflow-apis/
      - name: Publish Sonar analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.AIRFLOW_APIS_SONAR_TOKEN }}
        with:
          projectBaseDir: openmetadata-airflow-apis/
          args: -Dproject.settings=openmetadata-airflow-apis/sonar-project.properties
