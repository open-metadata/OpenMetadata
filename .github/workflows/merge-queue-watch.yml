name: Merge Queue Watch

# `workflow_run` always executes the copy of this file on the default branch, so
# changes here only take effect once merged.
on:
  workflow_run:
    workflows:
      - "Integration Tests - MySQL + Elasticsearch"
      - "Integration Tests - PostgreSQL + Elasticsearch + Redis"
      - "Integration Tests - PostgreSQL + OpenSearch"
      - "Java Checkstyle"
      - "OpenMetadata Service Unit Tests"
      - "PostgreSQL PR RDF E2E Tests"
      - "Postgresql PR Playwright E2E Tests"
      - "Python Checkstyle"
      - "SonarCloud + Jest Coverage"
      - "TypeScript Type Generation"
      - "UI Checkstyle"
      - "Validate JSON/YAML"
      - "py-tests"
      - "py-tests-postgres"
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-watch-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify Slack
    if: >-
      github.event.workflow_run.event == 'merge_group' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            .github/merge-queue-owners.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve queued pull request
        id: pr
        env:
          # gh-readonly-queue/main/pr-31646-<base-sha>
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(printf '%s' "$HEAD_BRANCH" | sed -n 's#^gh-readonly-queue/[^/]*/pr-\([0-9]\{1,\}\)-.*$#\1#p')
          if [ -z "$number" ]; then
            echo "Could not parse a PR number out of '$HEAD_BRANCH'; skipping." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Title and author are decoration, so a lookup failure degrades the
          # message rather than suppressing the alert. 4xx other than 429 fails
          # again identically; only 429, 5xx and network errors are retried.
          pr_json=""
          body=$(mktemp)
          for attempt in 1 2 3; do
            if err=$(gh api "repos/$REPO/pulls/$number" 2>&1 >"$body"); then
              pr_json=$(cat "$body")
              break
            fi
            status=$(printf '%s' "$err" | sed -n 's/.*(HTTP \([0-9]\{3\}\)).*/\1/p')
            echo "Attempt ${attempt} failed for PR #${number}: ${err}" >&2
            case "$status" in
              4[0-9][0-9])
                if [ "$status" != "429" ]; then
                  echo "HTTP ${status} will not change on retry; giving up early." >&2
                  break
                fi
                ;;
            esac
            [ "$attempt" -lt 3 ] && sleep $((attempt * 3))
          done
          rm -f "$body"
          if [ -z "$pr_json" ]; then
            echo "::warning::Could not fetch metadata for PR #${number}; notifying with links only."
            pr_json='{}'
          fi
          {
            echo "found=true"
            echo "number=$number"
            echo "title=$(printf '%s' "$pr_json" | jq -r '.title // ""')"
            echo "author=$(printf '%s' "$pr_json" | jq -r '.user.login // ""')"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the owning on-duty team
        id: owner
        if: steps.pr.outputs.found == 'true'
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/resolve-merge-queue-owner.sh > /tmp/owner
          {
            echo "handle=$(sed -n 1p /tmp/owner)"
            echo "group_id=$(sed -n 2p /tmp/owner)"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: steps.pr.outputs.found == 'true'
        env:
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.E2E_SLACK_BOT_OAUTH_TOKEN }}
          # ID rather than #name so a channel rename cannot break this.
          SLACK_CHANNEL: ${{ vars.MERGE_QUEUE_SLACK_CHANNEL || 'C0B6Q6KDMJN' }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          OWNER_HANDLE: ${{ steps.owner.outputs.handle }}
          OWNER_GROUP_ID: ${{ steps.owner.outputs.group_id }}
        run: .github/scripts/notify-merge-queue-slack.sh
