name: Workflows and Data Access Request E2E tests

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: data-access-request-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name != github.repository) }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      dar: ${{ steps.filter.outputs.dar }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dar:
              - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/tasks/TaskResource.java'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/jdbi3/TaskRepository.java'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/feeds/FeedResource.java'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/governance/workflows/**'
              - 'openmetadata-ui/src/main/resources/ui/src/components/WorkflowDefinitions/**'
              - 'openmetadata-ui/src/main/resources/ui/src/pages/WorkflowDefinitions/**'
              - 'openmetadata-ui/src/main/resources/ui/src/constants/WorkflowBuilder.constants.ts'
              - 'openmetadata-ui/src/main/resources/ui/src/interface/WorkflowBuilder.interface.ts'
              - 'openmetadata-ui/src/main/resources/ui/src/utils/WorkflowBuilderUtils.ts'
              - 'openmetadata-ui/src/main/resources/ui/src/generated/governance/workflows/**'

  data-access-request-e2e:
    needs: check-changes
    runs-on: ubuntu-latest
    if: |
      !github.event.pull_request.draft &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.dar == 'true') &&
      (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test')
    steps:
      - name: Wait for the labeler
        uses: lewagon/wait-on-check-action@v1.9.1
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Team Label
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 90

      - name: Verify PR labels
        uses: jesusvasquez333/verify-pr-label-action@v1.4.0
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          valid-labels: "safe to test"
          pull-request-number: "${{ github.event.pull_request.number }}"
          disable-reviews: true # To not auto approve changes

      # Dispatched by file name straight to the REST endpoint, not through
      # benc-uk/workflow-dispatch: that action finds the workflow by paging through the list of
      # every Collate workflow, GitHub serves those pages in two different orders at random, and
      # the lookup missed the workflow with "Unable to find workflow" on about one run in four.
      - name: Trigger Collate Playwright run & wait
        # Must stay above WAIT_SECONDS below. The step timeout kills the script outright, so when
        # it is the smaller of the two the wait can never run out on its own and the step
        # reports a bare "has timed out" with no downstream conclusion.
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ secrets.COLLATE_PAT }}
          COLLATE_REPO: open-metadata/openmetadata-collate
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          # The Collate job caps itself at timeout-minutes: 90, so waiting past that point is
          # what guarantees we report its real conclusion instead of giving up first. Successful
          # runs are 48-60 min today, already at the edge of the previous 61-min budget.
          WAIT_SECONDS: 5700
        run: |
          run_id=$(gh api -X POST "repos/$COLLATE_REPO/actions/workflows/data-access-request-e2e.yml/dispatches" \
            -f ref=main -f "inputs[sha]=$SHA" -f "inputs[event]=$EVENT" \
            -F return_run_details=true --jq .workflow_run_id)
          if [ -z "$run_id" ]; then
            echo "::error::The dispatch returned no run id; find the run at https://github.com/$COLLATE_REPO/actions/workflows/data-access-request-e2e.yml"
            exit 1
          fi
          run_url="https://github.com/$COLLATE_REPO/actions/runs/$run_id"
          echo "Collate run: $run_url"
          status=0
          timeout "$WAIT_SECONDS" gh run watch "$run_id" --repo "$COLLATE_REPO" \
            --interval 60 --compact --exit-status || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Collate run still in progress after ${WAIT_SECONDS}s: $run_url"
          elif [ "$status" -ne 0 ]; then
            echo "::error::Collate run did not succeed: $run_url"
          fi
          exit "$status"
