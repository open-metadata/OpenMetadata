name: py-tests-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    uses: ./.github/workflows/py-tests-shared.yml
    with:
      compose-args: "-m no-ui -s true -i false"
      artifact-prefix: py
      test-profile: python-integration
      run-unit-tests: true
      run-coverage: true
      full-suite: true

  postgres:
    uses: ./.github/workflows/py-tests-shared.yml
    with:
      compose-args: "-m no-ui -d postgresql -s true -i false"
      artifact-prefix: py-postgres
      test-profile: python-postgresql-integration
      full-suite: true
