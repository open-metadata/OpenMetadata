name: CI — Pull Request
'on':
  workflow_dispatch: null
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name
    != github.repository) }}
env:
  SPACY_MODEL_VERSION: 3.8.0
  SPACY_MODEL_SHA256: 5e6329fe3fecedb1d1a02c3ea2172ee0fede6cea6e4aefb6a02d832dba78a310
jobs:
  changes:
    name: Authorize & Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python: ${{ github.event_name == 'workflow_dispatch' && 'true' || (steps.filter.outputs.ci == 'true' || steps.filter.outputs.python == 'true') && 'true' ||
        'false' }}
      style: ${{ github.event_name == 'workflow_dispatch' && 'true' || (steps.filter.outputs.ci == 'true' || steps.filter.outputs.style == 'true') && 'true' || 'false'
        }}
      minimum: ${{ steps.versions.outputs.minimum }}
      image: ${{ steps.versions.outputs.image }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Detect changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.sha }}
          filters: |
            ci:
            - .github/workflows/ci-*.yml
            - .github/workflows/backend-build-reusable.yml
            - .github/workflows/python-unit-tests-reusable.yml
            - .github/workflows/python-integration-tests-reusable.yml
            - .github/workflows/py-tests*.yml
            - .github/workflows/py-checkstyle.yml
            - .github/workflows/py-sonarcloud-nightly.yml
            - .github/workflows/populate-playwright-caches.yml
            - .github/actions/setup-openmetadata-test-environment/**
            - .github/actions/python-checkstyle/**
            - .github/scripts/tests/test_nox_cli.py
            - Makefile
            python:
            - ingestion/**
            - openmetadata-spec/**
            - .github/workflows/py-cli-e2e-tests.yml
            - .github/workflows/py-cli-e2e-tests-v2.yml
            - openmetadata-service/src/main/java/org/openmetadata/service/resources/**
            - openmetadata-service/src/main/java/org/openmetadata/service/JsonPatchMessageBodyReader.java
            - openmetadata-service/src/main/java/org/openmetadata/service/JsonPatchProvider.java
            - openmetadata-service/src/main/java/org/openmetadata/service/ResourceRegistry.java
            style:
            - ingestion/**
            - openmetadata-airflow-apis/**
            - openmetadata-spec/**
      - name: Validate change detection
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
          PYTHON_CHANGED: ${{ steps.filter.outputs.python }}
          STYLE_CHANGED: ${{ steps.filter.outputs.style }}
        run: |
          for changed in "$CI_CHANGED" "$PYTHON_CHANGED" "$STYLE_CHANGED"; do
            case "$changed" in
              true|false) ;;
              *) echo "Missing or invalid change-filter output: $changed"; exit 1 ;;
            esac
          done
        shell: bash
      - name: Read Python versions
        id: versions
        run: |
          jq -er '
            .image as $image | select(.tested | index($image)) |
            "minimum=\(.tested[0])", "image=\(.image)",
            "versions=\([.image] | tojson)"
          ' ingestion/python-versions.json >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Wait for the labeler
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994
        if: ${{ github.event_name == 'pull_request_target' && (steps.filter.outputs.ci == 'true' || steps.filter.outputs.python == 'true' || steps.filter.outputs.style
          == 'true') }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Team Label
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
      - name: Verify PR labels
        uses: jesusvasquez333/verify-pr-label-action@657d111bbbe13e22bbd55870f1813c699bde1401
        if: ${{ github.event_name == 'pull_request_target' && (steps.filter.outputs.ci == 'true' || steps.filter.outputs.python == 'true' || steps.filter.outputs.style
          == 'true') }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          valid-labels: safe to test
          pull-request-number: ${{ github.event.pull_request.number }}
          disable-reviews: true
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe
      to test') }}
  py-checkstyle:
    name: py-checkstyle
    needs: changes
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name
      == 'safe to test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate selection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STYLE_CHANGED: ${{ needs.changes.outputs.style }}
        run: |
          case "$CHANGES_RESULT:$STYLE_CHANGED" in
            success:true|success:false) ;;
            *) echo "Python checkstyle selection did not succeed"; exit 1 ;;
          esac
        shell: bash
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
        if: ${{ needs.changes.outputs.style == 'true' }}
      - name: Python checkstyle
        id: style
        if: ${{ needs.changes.outputs.style == 'true' }}
        uses: ./.github/actions/python-checkstyle
        with:
          python-version: ${{ needs.changes.outputs.minimum }}
      - name: Create a comment in the PR with the instructions
        if: ${{ failure() && steps.style.outcome == 'failure' && github.event_name == 'pull_request_target' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **The Python checkstyle failed.**

            Please run `make py_format` and `py_format_check` in the root of your repository and commit the changes to this PR.
            You can also use [pre-commit](https://pre-commit.com/) to automate the Python code formatting.

            You can install the pre-commit hooks with `make install_test precommit_install`.
  static:
    name: Python static checks
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: ${{ needs.changes.outputs.minimum }}
          install-server: 'false'
      - name: Run Static Checks
        run: |
          set -o pipefail
          source env/bin/activate
          cd ingestion
          python -m nox --non-interactive --no-venv -s static-checks 2>&1 | tee static-checks-run.log
        shell: bash
  prepare-spacy-model:
    name: Prepare spaCy model
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Restore spaCy model wheel
        id: spacy-model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/spacy-model
          key: spacy-model-${{ env.SPACY_MODEL_VERSION }}-${{ env.SPACY_MODEL_SHA256 }}
      - name: Download spaCy model wheel
        if: steps.spacy-model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/spacy-model
          wheel_path=".cache/spacy-model/en_core_web_md-${SPACY_MODEL_VERSION}-py3-none-any.whl"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 20 --max-time 600 \
            --output "${wheel_path}" \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-${SPACY_MODEL_VERSION}/en_core_web_md-${SPACY_MODEL_VERSION}-py3-none-any.whl"
          echo "${SPACY_MODEL_SHA256}  ${wheel_path}" | sha256sum --check --strict
        shell: bash
      - name: Verify spaCy model wheel
        run: echo "${SPACY_MODEL_SHA256}  .cache/spacy-model/en_core_web_md-${SPACY_MODEL_VERSION}-py3-none-any.whl" | sha256sum --check --strict
        shell: bash
      - name: Upload spaCy model wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: spacy-en-model
          path: .cache/spacy-model/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Save spaCy model wheel
        if: ${{ steps.spacy-model-cache.outputs.cache-hit != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref
          == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/spacy-model
          key: spacy-model-${{ env.SPACY_MODEL_VERSION }}-${{ env.SPACY_MODEL_SHA256 }}
        continue-on-error: true
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/backend-build-reusable.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
  unit:
    needs:
      - changes
      - prepare-spacy-model
    if: ${{ needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/python-unit-tests-reusable.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      python-versions: ${{ needs.changes.outputs.versions }}
      coverage-python: ${{ needs.changes.outputs.image }}
  integration:
    needs:
      - changes
      - prepare-spacy-model
      - backend
    if: ${{ needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/python-integration-tests-reusable.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      python-versions: ${{ needs.changes.outputs.versions }}
      coverage-python: ${{ needs.changes.outputs.image }}
  py-tests-status:
    name: py-tests-status
    needs:
      - changes
      - static
      - unit
      - integration
      - backend
      - prepare-spacy-model
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name
      == 'safe to test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify expected Python jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MODEL_RESULT: ${{ needs.prepare-spacy-model.result }}
        run: |
          test "$CHANGES_RESULT" = success
          for result in "$STATIC_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$BACKEND_RESULT" "$MODEL_RESULT"; do
            case "$PYTHON_CHANGED:$result" in
              true:success|false:skipped) ;;
              *) echo "Unexpected Python job result: selected=$PYTHON_CHANGED result=$result"; exit 1 ;;
            esac
          done
        shell: bash
  coverage:
    needs:
      - changes
      - unit
      - integration
    if: ${{ always() && needs.changes.result == 'success' && needs.unit.result == 'success' && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ needs.changes.outputs.image }}
      - name: Install uv
        run: pip install uv
        shell: bash
      - name: Install coverage
        run: |
          python3 -m venv env
          source env/bin/activate
          uv pip install "coverage[toml]" nox
        shell: bash
      - name: Download coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: py-coverage-*
          path: ingestion/coverage-data/
      - name: Prepare coverage files
        run: |
          cd ingestion
          shopt -s globstar nullglob
          files=(coverage-data/**/.coverage)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python coverage data downloaded"
            exit 1
          fi
          for index in "${!files[@]}"; do
            mv "${files[$index]}" ".coverage.ci-$index"
          done
        shell: bash
      - name: Combine coverage
        run: |
          source env/bin/activate
          cd ingestion
          python -m nox --non-interactive --no-venv -s combine-coverage
        shell: bash
      - name: Remove pom.xml
        run: rm pom.xml
        shell: bash
      - name: Push Results in PR to Sonar
        id: push-to-sonar
        if: ${{ github.event_name == 'pull_request_target'}}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.INGESTION_SONAR_SECRET }}
        with:
          projectBaseDir: ingestion/
          args: -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }} -Dsonar.pullrequest.github.repository=OpenMetadata
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }} -Dsonar.pullrequest.provider=github
