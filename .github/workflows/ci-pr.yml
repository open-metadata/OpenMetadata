name: ci-pr
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      workload:
        description: PR checks to run manually
        type: choice
        options: [python, ui, quickstart-compose]
        default: python
permissions:
  contents: read
  packages: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.workload }}
  cancel-in-progress: true
jobs:
  plan:
    uses: ./.github/workflows/reusable-ci-plan.yml
    with:
      entrypoint: pr

  backend:
    name: Build backend image
    needs: plan
    if: ${{ needs.plan.outputs.docker-smoke == 'true' }}
    uses: ./.github/workflows/reusable-build-backend.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  # The native check reports on fork PRs and catches planner failures and unexpected suite skips.
  py-tests-status:
    name: py-tests-status
    needs: plan
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || inputs.workload == 'python') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Every selected suite needs the whole repository; with none selected, or
      # after a planner failure, the status gate below still needs its action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: ${{ needs.plan.outputs.static != 'true' && '.github/actions/ci-status-gate' || '' }}
      - name: Run Python static checks
        id: static
        if: ${{ needs.plan.result == 'success' && needs.plan.outputs.static == 'true' }}
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
          check-types: ${{ needs.plan.outputs.python }}
      - name: Run Python unit tests
        id: unit
        if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.python == 'true' }}
        uses: ./.github/actions/python-unit
        with:
          python-version: ${{ needs.plan.outputs.python-highest }}
          prepare-models: 'true'
      - name: Run Airflow API tests
        id: airflow
        if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.airflow-apis == 'true' }}
        uses: ./.github/actions/python-airflow-apis
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
      # The suites run as steps here, so the gate gets their outcomes in the
      # shape of `needs`.
      - name: Verify selected Python workloads
        if: ${{ always() }}
        uses: ./.github/actions/ci-status-gate
        with:
          needs: |
            {
              "plan": {"result": "${{ needs.plan.result }}"},
              "python-static-checks": {"result": "${{ steps.static.outcome }}"},
              "python-unit": {"result": "${{ steps.unit.outcome }}"},
              "airflow-apis": {"result": "${{ steps.airflow.outcome }}"}
            }
          expected: |
            {
              "plan": "success",
              "python-static-checks": "${{ needs.plan.outputs.static == 'true' && 'success' || 'skipped' }}",
              "python-unit": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "airflow-apis": "${{ needs.plan.outputs.airflow-apis == 'true' && 'success' || 'skipped' }}"
            }

  # UI runs as one job, like python: ui-ci.yml runs checkstyle and then fans
  # Jest and the browser tests out to parallel shards.
  ui:
    name: ui
    needs: plan
    if: ${{ needs.plan.outputs.ui == 'true' }}
    permissions:
      contents: read
      # The browser tests download the impact map from earlier runs.
      actions: read
    uses: ./.github/workflows/ui-ci.yml
    with:
      unit: ${{ needs.plan.outputs.ui-unit == 'true' }}

  # Required check for the UI. Like py-tests-status it must run on every
  # non-draft PR: a job skipped by `if` reports success.
  ui-tests-status:
    name: ui-tests-status
    needs: [plan, ui]
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name == 'pull_request' || inputs.workload == 'ui') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-status-gate
      - uses: ./.github/actions/ci-status-gate
        with:
          needs: ${{ toJSON(needs) }}
          expected: |
            {
              "plan": "success",
              "ui": "${{ needs.plan.outputs.ui == 'true' && 'success' || 'skipped' }}"
            }

  # TEMPORARY: the merge-rules ruleset still requires these two names. Remove
  # both once it requires ui-tests-status instead.
  ui-checkstyle:
    name: ui-checkstyle
    needs: ui-tests-status
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name == 'pull_request' || inputs.workload == 'ui') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.ui-tests-status.result }}" = success

  ui-coverage:
    name: ui-coverage
    needs: ui-tests-status
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name == 'pull_request' || inputs.workload == 'ui') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.ui-tests-status.result }}" = success

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: plan
    if: ${{ needs.plan.outputs.checkstyle == 'true' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Hydrate Maven dependencies
        uses: ./.github/actions/hydrate-maven-cache

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: "21"
          distribution: "temurin"

      # Fail-fast checkstyle: if formatting fails, skip unit tests and report
      # the exact files in the summary below.
      - name: "1/2: Java checkstyle"
        id: checkstyle
        uses: ./.github/actions/java-checkstyle

      - name: "2/2: Service unit tests"
        id: unit-tests
        if: ${{ steps.checkstyle.outcome == 'success' && needs.plan.outputs.java-unit == 'true' }}
        uses: ./.github/actions/java-service-unit-tests

      - name: Summarize backend checks
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/java-backend-report
        with:
          checkstyle-outcome: ${{ steps.checkstyle.outcome }}
          unit-tests-outcome: ${{ steps.unit-tests.outcome }}

  k8s_operator-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: ${{ needs.plan.outputs.java-operator == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Run Kubernetes operator unit tests
        uses: ./.github/actions/java-k8s-operator-tests

  docker-image-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, backend]
    if: ${{ needs.plan.outputs.docker-smoke == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Smoke test the server image
        uses: ./.github/actions/java-docker-smoke

  validate-json-yaml:
    needs: plan
    if: ${{ needs.plan.outputs.json-yaml == 'true' || needs.plan.outputs.ci-rules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/validate-json-yaml
        if: ${{ needs.plan.outputs.json-yaml == 'true' }}
      - uses: ./.github/actions/validate-ci-rules
        if: ${{ needs.plan.outputs.ci-rules == 'true' }}

  validate-docker-compose:
    needs: plan
    if: ${{ needs.plan.outputs.quickstart-compose == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENMETADATA_DB_IMAGE: docker.getcollate.io/openmetadata/db:latest
      OPENMETADATA_SERVER_IMAGE: docker.getcollate.io/openmetadata/server:latest
      OPENMETADATA_INGESTION_IMAGE: docker.getcollate.io/openmetadata/ingestion:latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false
      - name: Validate OpenMetadata Docker Compose
        uses: ./.github/actions/validate-omd-docker-compose
        with:
          compose_file: ./docker/docker-compose-quickstart/docker-compose.yml
          health_check_timeout: 300

  # Required check for the backend. Like the Python and UI gates it runs on
  # every non-draft PR: a job skipped by `if` reports success.
  backend-checks-status:
    name: backend-checks-status
    needs: [plan, backend-checks, k8s_operator-unit-tests, docker-image-smoke-test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-status-gate
      - uses: ./.github/actions/ci-status-gate
        with:
          needs: ${{ toJSON(needs) }}
          expected: |
            {
              "plan": "success",
              "backend-checks": "${{ needs.plan.outputs.checkstyle == 'true' && 'success' || 'skipped' }}",
              "k8s_operator-unit-tests": "${{ needs.plan.outputs.java-operator == 'true' && 'success' || 'skipped' }}",
              "docker-image-smoke-test": "${{ needs.plan.outputs.docker-smoke == 'true' && 'success' || 'skipped' }}"
            }
