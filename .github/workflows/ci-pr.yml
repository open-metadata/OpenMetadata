name: CI — Pull Request
'on':
  workflow_dispatch: null
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name
    != github.repository) }}
jobs:
  changes:
    uses: ./.github/workflows/ci-selection-reusable.yml
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name ==
      'safe to test') }}
  prepare-spacy-model:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/python-assets-reusable.yml
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/backend-build-reusable.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
  python-checks:
    needs:
      - changes
      - prepare-spacy-model
    if: ${{ always() && needs.changes.result == 'success' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.style == 'true') }}
    uses: ./.github/workflows/python-checks-reusable.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-tests: ${{ needs.changes.outputs.python == 'true' }}
      run-style: ${{ needs.changes.outputs.style == 'true' }}
      minimum-python: ${{ needs.changes.outputs.minimum }}
      python-versions: ${{ needs.changes.outputs.versions }}
      coverage-python: ${{ needs.changes.outputs.image }}
      spacy-artifact-id: ${{ needs.prepare-spacy-model.outputs.spacy-artifact-id }}
  integration:
    needs:
      - changes
      - prepare-spacy-model
      - backend
    if: ${{ needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/python-integration-tests-reusable.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      python-versions: ${{ needs.changes.outputs.versions }}
      coverage-python: ${{ needs.changes.outputs.image }}
      spacy-artifact-id: ${{ needs.prepare-spacy-model.outputs.spacy-artifact-id }}
      backend-artifact-id: ${{ needs.backend.outputs.artifact-id }}
  py-checkstyle:
    name: py-checkstyle
    needs:
      - changes
      - python-checks
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name
      == 'safe to test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify Python checkstyle outcome
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STYLE_CHANGED: ${{ needs.changes.outputs.style }}
          STYLE_RESULT: ${{ needs.python-checks.result == 'skipped' && 'skipped' || needs.python-checks.outputs.style-result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$STYLE_CHANGED:$STYLE_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected Python checkstyle result: selected=$STYLE_CHANGED result=$STYLE_RESULT"; exit 1 ;;
          esac
      - name: Create a comment in the PR with the instructions
        if: ${{ failure() && needs.python-checks.outputs.style-result == 'failure' && github.event_name == 'pull_request_target' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **The Python checkstyle failed.**

            Please run `make py_format` and `py_format_check` in the root of your repository and commit the changes to this PR.
            You can also use [pre-commit](https://pre-commit.com/) to automate the Python code formatting.

            You can install the pre-commit hooks with `make install_test precommit_install`.
  py-tests-status:
    name: py-tests-status
    needs:
      - changes
      - python-checks
      - integration
      - backend
      - prepare-spacy-model
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name
      == 'safe to test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify expected Python jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MODEL_RESULT: ${{ needs.prepare-spacy-model.result }}
          CHECKS_RESULT: ${{ needs.python-checks.result == 'skipped' && 'skipped' || needs.python-checks.outputs.tests-result }}
        run: |
          test "$CHANGES_RESULT" = success
          for result in "$CHECKS_RESULT" "$INTEGRATION_RESULT" "$BACKEND_RESULT" "$MODEL_RESULT"; do
            case "$PYTHON_CHANGED:$result" in
              true:success|false:skipped) ;;
              *) echo "Unexpected Python job result: selected=$PYTHON_CHANGED result=$result"; exit 1 ;;
            esac
          done
        shell: bash
  coverage:
    needs:
      - changes
      - python-checks
      - integration
    if: ${{ always() && needs.changes.result == 'success' && needs.python-checks.outputs.tests-result == 'success' && needs.integration.result == 'success' }}
    uses: ./.github/workflows/python-coverage-reusable.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      python-version: ${{ needs.changes.outputs.image }}
    secrets:
      sonar-token: ${{ secrets.INGESTION_SONAR_SECRET }}
