name: ci-pr
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select Python workloads
    runs-on: ubuntu-latest
    outputs:
      lowest: ${{ steps.versions.outputs.lowest }}
      highest: ${{ steps.versions.outputs.highest }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      static: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' || steps.filter.outputs.static == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: .github/python-ci/paths.yml
      - name: Read Python versions
        id: versions
        run: python3 scripts/python_ci.py versions --output "$GITHUB_OUTPUT"
    if: ${{ !github.event.pull_request.draft }}
  py-checkstyle:
    name: py-checkstyle
    needs: plan
    if: ${{ needs.plan.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run formatting and lint
        uses: ./.github/actions/python-lint
        with:
          python-version: ${{ needs.plan.outputs.highest }}
  type-checks:
    name: Python type checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run type checks
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.lowest }}
    if: ${{ needs.plan.outputs.python == 'true' }}
  models:
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/prepare-classification-models
  unit:
    needs:
      - plan
      - models
    if: ${{ needs.plan.outputs.python == 'true' }}
    uses: ./.github/workflows/py-unit.yml
    with:
      python-version: ${{ needs.plan.outputs.highest }}
      ref: ${{ needs.plan.outputs.ref }}
      collect-coverage: false
  py-tests-status:
    name: py-tests-status
    needs:
      - plan
      - py-checkstyle
      - type-checks
      - models
      - unit
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify selected Python workloads
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_RESULTS: |
            {
              "plan": "success",
              "py-checkstyle": "${{ needs.plan.outputs.static == 'true' && 'success' || 'skipped' }}",
              "type-checks": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "models": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "unit": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}"
            }
        run: python3 scripts/python_ci.py verify
