name: ci-pr
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      workload:
        description: PR checks to run manually
        type: choice
        options: [python, quickstart-compose]
        default: python
permissions:
  contents: read
  packages: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    uses: ./.github/workflows/reusable-ci-plan.yml
    with:
      entrypoint: pr

  # Static checks, unit tests and Airflow API tests share one runner. Later suites still run
  # after an earlier one fails so a single push reports every selected failure. The job runs
  # even when nothing is selected or planning fails, so the required checks are always reported.
  python:
    name: python
    needs: plan
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || inputs.workload == 'python') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    outputs:
      gate: ${{ steps.gate.outcome }}
    env:
      # Fork PRs get a read-only token and cannot create check runs; py-tests-status covers them.
      CAN_REPORT_CHECKS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.plan.outputs.static == 'true' }}
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Python static checks
        id: static
        if: ${{ needs.plan.outputs.static == 'true' }}
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
          check-types: ${{ needs.plan.outputs.python }}
      - name: Run Python unit tests
        id: unit
        if: ${{ !cancelled() && needs.plan.outputs.python == 'true' }}
        uses: ./.github/actions/python-unit
        with:
          python-version: ${{ needs.plan.outputs.python-highest }}
          prepare-models: 'true'
      - name: Run Airflow API tests
        id: airflow
        if: ${{ !cancelled() && needs.plan.outputs.airflow-apis == 'true' }}
        uses: ./.github/actions/python-airflow-apis
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
      # The step result feeds py-tests-status; failing suites already fail the job.
      - name: Verify selected Python workloads
        id: gate
        if: ${{ always() }}
        continue-on-error: true
        env:
          NEEDS_JSON: |
            {
              "plan": {"result": "${{ needs.plan.result }}"},
              "py-checkstyle": {"result": "${{ steps.static.outcome }}"},
              "python-unit": {"result": "${{ steps.unit.outcome }}"},
              "airflow-apis": {"result": "${{ steps.airflow.outcome }}"}
            }
          EXPECTED_RESULTS: |
            {
              "plan": "success",
              "py-checkstyle": "${{ needs.plan.outputs.static == 'true' && 'success' || 'skipped' }}",
              "python-unit": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "airflow-apis": "${{ needs.plan.outputs.airflow-apis == 'true' && 'success' || 'skipped' }}"
            }
        run: |
          jq -e -n --argjson needs "$NEEDS_JSON" --argjson expected "$EXPECTED_RESULTS" '
            $expected | length > 0 and
            (keys == ($needs | keys)) and
            all(to_entries[]; . as $job |
              ($job.value == "success" or $job.value == "skipped") and
              $needs[$job.key].result == $job.value)
          '
        shell: bash
      - name: Report py-checkstyle
        if: ${{ always() && env.CAN_REPORT_CHECKS == 'true' }}
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ github.token }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          name: py-checkstyle
          conclusion: ${{ job.status == 'cancelled' && 'cancelled' || steps.static.outcome || 'skipped' }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Report airflow-apis
        if: ${{ always() && env.CAN_REPORT_CHECKS == 'true' && steps.airflow.outcome != 'skipped' && steps.airflow.outcome != '' }}
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ github.token }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          name: airflow-apis
          conclusion: ${{ job.status == 'cancelled' && 'cancelled' || steps.airflow.outcome }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Required check, published as a job so fork PRs report it too. It must verify on every PR:
  # a job skipped by `if` reports success and would override a failing check of the same name.
  py-tests-status:
    name: py-tests-status
    needs:
      - plan
      - python
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || inputs.workload == 'python') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Verify selected Python workloads
        env:
          NEEDS_JSON: |
            {
              "plan": {"result": "${{ needs.plan.result }}"},
              "python": {"result": "${{ needs.python.result }}"},
              "python-gate": {"result": "${{ needs.python.outputs.gate }}"}
            }
          EXPECTED_RESULTS: |
            {
              "plan": "success",
              "python": "success",
              "python-gate": "success"
            }
        run: |
          jq -e -n --argjson needs "$NEEDS_JSON" --argjson expected "$EXPECTED_RESULTS" '
            $expected | length > 0 and
            (keys == ($needs | keys)) and
            all(to_entries[]; . as $job |
              ($job.value == "success" or $job.value == "skipped") and
              $needs[$job.key].result == $job.value)
          '
        shell: bash

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.checkstyle == 'true') }}
    steps:
      - name: Require successful CI planning
        if: ${{ needs.plan.result != 'success' }}
        run: exit 1
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      # Restore-only (exact Actions cache -> GHCR pre-baked image -> prefix fallback);
      # the save after the build runs on push to main only.
      - name: Hydrate Maven dependencies
        id: maven-cache
        uses: ./.github/actions/hydrate-maven-cache

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: "21"
          distribution: "temurin"

      # Fail-fast checkstyle: if formatting fails, skip unit tests and report
      # the exact files in the summary below.
      - name: "1/2: Java checkstyle"
        id: checkstyle
        shell: bash
        run: |
          mvn -B -T 1C spotless:apply
          git diff --name-only > "$RUNNER_TEMP/checkstyle-failed-files.txt"
          if [[ -s "$RUNNER_TEMP/checkstyle-failed-files.txt" ]]; then
            echo "Java checkstyle found unformatted files:"
            cat "$RUNNER_TEMP/checkstyle-failed-files.txt"
            exit 1
          fi

      # No -Pstatic-code-analysis: its JaCoCo agent slowed every test, yet `package`
      # never builds the report and nothing uploads it. No apt/ANTLR install either:
      # nothing here uses them (openmetadata-spec's prepare_model_schemas.py needs
      # only stdlib python3).
      - name: "2/2: Service unit tests"
        id: unit-tests
        if: ${{ steps.checkstyle.outcome == 'success' && needs.plan.outputs.java-unit == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mvn -B -T 1C clean package -pl openmetadata-service -am \
            -DfailIfNoTests=false

      - name: Summarize backend checks
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/java-backend-report
        with:
          checkstyle-outcome: ${{ steps.checkstyle.outcome }}
          unit-tests-outcome: ${{ steps.unit-tests.outcome }}

      - name: Save Maven dependencies
        if: github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true' && steps.checkstyle.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

  k8s_operator-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: ${{ needs.plan.outputs.java-operator == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Run Kubernetes operator unit tests
        uses: ./.github/actions/java-k8s-operator-tests

  docker-image-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.docker-smoke == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Smoke test the server image
        uses: ./.github/actions/java-docker-smoke

  backend-checks-status:
    name: backend-checks-status
    needs: [plan, backend-checks, k8s_operator-unit-tests, docker-image-smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Verify backend checks, operator tests, and Docker smoke test
        env:
          CHANGES_RESULT: ${{ needs.plan.result }}
          CHECKSTYLE_CHANGED: ${{ needs.plan.outputs.checkstyle }}
          JAVA_CHANGED: ${{ needs.plan.outputs.java-unit }}
          K8S_CHANGED: ${{ needs.plan.outputs.java-operator }}
          DOCKER_CHANGED: ${{ needs.plan.outputs.docker-smoke }}
          SERVICE_RESULT: ${{ needs.backend-checks.result }}
          K8S_RESULT: ${{ needs.k8s_operator-unit-tests.result }}
          DOCKER_RESULT: ${{ needs.docker-image-smoke-test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::CI planning did not succeed: ${CHANGES_RESULT}"
            exit 1
          fi

          fail=0
          check() {
            local name="$1" changed="$2" result="$3"
            if [[ "$changed" != "true" ]]; then
              echo "${name}: no relevant paths changed, skipped."
              return
            fi
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} did not succeed (result=${result})"
              fail=1
            else
              echo "${name}: success"
            fi
          }
          backend_changed="false"
          if [[ "$JAVA_CHANGED" == "true" || "$CHECKSTYLE_CHANGED" == "true" ]]; then
            backend_changed="true"
          fi
          check "backend-checks" "$backend_changed" "$SERVICE_RESULT"
          check "k8s_operator-unit-tests"         "$K8S_CHANGED"     "$K8S_RESULT"
          check "docker-image-smoke-test"         "$DOCKER_CHANGED"  "$DOCKER_RESULT"
          exit $fail

  validate-json-yaml:
    needs: plan
    if: ${{ needs.plan.outputs.json-yaml == 'true' || needs.plan.outputs.ci-rules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/validate-json-yaml
        if: ${{ needs.plan.outputs.json-yaml == 'true' }}
      - uses: ./.github/actions/validate-ci-rules
        if: ${{ needs.plan.outputs.ci-rules == 'true' }}

  validate-docker-compose:
    needs: plan
    if: ${{ needs.plan.outputs.quickstart-compose == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENMETADATA_DB_IMAGE: docker.getcollate.io/openmetadata/db:latest
      OPENMETADATA_SERVER_IMAGE: docker.getcollate.io/openmetadata/server:latest
      OPENMETADATA_INGESTION_IMAGE: docker.getcollate.io/openmetadata/ingestion:latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false
      - name: Validate OpenMetadata Docker Compose
        uses: ./.github/actions/validate-omd-docker-compose
        with:
          compose_file: ./docker/docker-compose-quickstart/docker-compose.yml
          health_check_timeout: 300

  # Required contexts still report skipped on PRs. The jobs run in ci-merge-queue.
  integration-tests-mysql-elasticsearch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' }}
    steps:
      - run: exit 1

  integration-tests-postgres-opensearch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' }}
    steps:
      - run: exit 1

  integration-tests-postgres-elasticsearch-redis:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' }}
    steps:
      - run: exit 1
