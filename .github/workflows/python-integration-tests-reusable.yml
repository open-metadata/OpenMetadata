name: Python integration tests
'on':
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact revision to test
        type: string
        required: true
      python-versions:
        description: JSON array of Python versions
        type: string
        required: true
      coverage-python:
        description: Python version supplying coverage and control tests
        type: string
        required: true
permissions:
  contents: read
jobs:
  tests:
    name: Python integration (${{ matrix.backend.name }}, ${{ matrix.shard.name }}, ${{ matrix.py-version }})
    timeout-minutes: 180
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py-version: ${{ fromJSON(inputs.python-versions) }}
        shard:
          - name: shard-1
            nox-args: tests/integration/automations tests/integration/data_quality tests/integration/mysql tests/integration/postgres tests/integration/powerbi tests/integration/sas
              tests/integration/superset
          - name: shard-2
            needs-disk: true
            nox-args: tests/integration/alationsink tests/integration/auto_classification tests/integration/datalake tests/integration/profiler tests/integration/sources
              tests/integration/sql_server tests/integration/ssrs
          - name: shard-3
            nox-args: --ignore=tests/integration/automations --ignore=tests/integration/data_quality --ignore=tests/integration/mysql --ignore=tests/integration/postgres
              --ignore=tests/integration/powerbi --ignore=tests/integration/sas --ignore=tests/integration/superset --ignore=tests/integration/alationsink --ignore=tests/integration/auto_classification
              --ignore=tests/integration/datalake --ignore=tests/integration/profiler --ignore=tests/integration/sources --ignore=tests/integration/sql_server --ignore=tests/integration/ssrs
        backend:
          - name: mysql
            args: -m no-ui -s true -i false
            profile: python-integration
          - name: postgres
            args: -m no-ui -d postgresql -s true -i false
            profile: python-postgresql-integration
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Use runner data disk for Docker
        if: matrix.shard.needs-disk
        run: bash .github/scripts/configure_docker_storage.sh
      - name: Download backend distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: openmetadata-backend-distribution
          path: openmetadata-dist/target
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: ${{ matrix.py-version}}
          args: ${{ matrix.backend.args }}
      - name: Download spaCy model
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: spacy-en-model
          path: /tmp/spacy-model
      - name: Install and verify spaCy model
        run: |
          source env/bin/activate
          uv pip install --no-deps /tmp/spacy-model/*.whl
          python -c 'import spacy; spacy.load("en_core_web_md")'
        shell: bash
      - name: Reclaim unused disk for the Exasol shard
        if: matrix.shard.needs-disk
        continue-on-error: true
        run: |
          {
            echo "Before Exasol shard disk reclaim"
            df -h
            docker system df
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            docker image prune --all --force || true
            docker builder prune --all --force || true
            echo "After Exasol shard disk reclaim"
            df -h
            docker system df
          } 2>&1 | tee "${RUNNER_TEMP}/exasol-disk-reclaim.log"
        shell: bash
      - name: Run Integration Tests
        id: integration-tests
        run: |
          set -o pipefail
          source env/bin/activate
          cd ingestion
          read -r -a shard_args <<< "$NOX_ARGS"
          python -m nox --non-interactive --no-venv -s integration-tests -- --standalone --durations=5 "${shard_args[@]}" 2>&1 | tee integration-test-run.log
        env:
          NOX_ARGS: ${{ matrix.shard.nox-args }}
          TESTCONTAINERS_RYUK_DISABLED: true
        shell: bash
      - name: Classify Python integration test outcome
        if: ${{ always() }}
        env:
          TEST_LANE: ${{ matrix.shard.name }}-python-${{ matrix.py-version }}
          TEST_PROFILE: ${{ matrix.backend.profile }}
          TEST_STEP_OUTCOME: ${{ steps.integration-tests.outcome }}
        run: |
          python3 .github/scripts/classify_test_outcome.py \
            --step-outcome "$TEST_STEP_OUTCOME" \
            --report-glob 'ingestion/junit/test-results-*.xml' \
            --diagnostic-glob 'ingestion/integration-test-run.log' \
            --output ingestion/ci-diagnostics/outcome.json
      - name: Upload coverage artifact
        if: ${{ matrix.backend.name == 'mysql' && matrix.py-version == inputs.coverage-python && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-coverage-integration-${{ matrix.backend.name }}-${{ matrix.py-version }}-${{ matrix.shard.name }}
          path: ingestion/.coverage
          include-hidden-files: true
      - name: Upload test results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-${{ matrix.backend.name }}-integration-test-results-${{ matrix.shard.name }}-${{ matrix.py-version }}
          path: |
            ingestion/junit/
            ingestion/ci-diagnostics/outcome.json
            ingestion/integration-test-run.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
      - name: Collect runner and service diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        run: |
          diagnostics="${RUNNER_TEMP}/python-ci-diagnostics"
          rm -rf "$diagnostics"
          mkdir -p "$diagnostics"
          df -h > "$diagnostics/disk-usage.txt" 2>&1 || true
          free -h > "$diagnostics/memory-usage.txt" 2>&1 || true
          docker info > "$diagnostics/docker-info.txt" 2>&1 || true
          docker system df > "$diagnostics/docker-disk-usage.txt" 2>&1 || true
          docker ps --all --no-trunc > "$diagnostics/docker-containers.txt" 2>&1 || true
          if [ -d docker/development ]; then
            (cd docker/development && docker compose ps --all) > "$diagnostics/docker-compose-ps.txt" 2>&1 || true
            (cd docker/development && docker compose logs --no-color --tail 2000) > "$diagnostics/docker-compose.log" 2>&1 || true
          fi
          coredumpctl --no-pager list > "$diagnostics/coredumps.txt" 2>&1 || true
          coredumpctl --no-pager info >> "$diagnostics/coredumps.txt" 2>&1 || true
          find "$GITHUB_WORKSPACE" /tmp /var/crash -maxdepth 3 -type f \
            \( -name 'core' -o -name 'core.*' -o -name '*.core' -o -name '*.dmp' -o -name '*.crash' \) \
            -printf '%p %s bytes\n' >> "$diagnostics/core-files.txt" 2>/dev/null || true
          if [ -f "${RUNNER_TEMP}/exasol-disk-reclaim.log" ]; then
            cp "${RUNNER_TEMP}/exasol-disk-reclaim.log" "$diagnostics/"
          fi
        shell: bash
      - name: Upload runner and service diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-${{ matrix.backend.name }}-integration-diagnostics-${{ matrix.shard.name }}-${{ matrix.py-version }}
          path: ${{ runner.temp }}/python-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
      - name: Clean Up
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd ./docker/development
          docker compose down --remove-orphans || true
          sudo rm -rf "${PWD}/docker-volume"
