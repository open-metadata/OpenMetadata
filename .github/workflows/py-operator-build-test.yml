name: py-operator-build-test
on:
  workflow_dispatch:
  pull_request_target:
    types: [labeled, opened, synchronize, reopened, ready_for_review]
    paths:
      - "ingestion/**"
      - "openmetadata-service/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "pom.xml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test' }}

jobs:
  authorize-pr:
    name: Authorize PR
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted workflow source
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authorize PR
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: ./.github/actions/authorize-pr
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          pull-request-number: ${{ github.event.pull_request.number }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  py-run-build-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: authorize-pr
    if: ${{ needs.authorize-pr.result == 'success' }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: "3.10"
          args: "-m no-ui"
          ingestion_dependency: "mysql,elasticsearch,sample-data"

      - name: Build Ingestion Operator & Ingest Sample Data
        run: |
          docker build -f ingestion/operators/docker/Dockerfile.ci . -t openmetadata/ingestion-base:test
          docker run --net=host --rm openmetadata/ingestion-base:test metadata ingest -c ./pipelines/sample_data.yaml

      - name: Validate ingestion
        run: |
          source env/bin/activate
          python scripts/validate_sample_data.py --id-snapshot /tmp/ai-governance-sample-ids.json

      - name: Verify sample data is idempotent
        run: |
          docker run --net=host --rm openmetadata/ingestion-base:test metadata ingest -c ./pipelines/sample_data.yaml
          source env/bin/activate
          python scripts/validate_sample_data.py --id-snapshot /tmp/ai-governance-sample-ids.json

      - name: Clean Up
        run: |
          cd ./docker/development
          docker compose down --remove-orphans
          sudo rm -rf ${PWD}/docker-volume
