name: SSO Login Nightly

on:
  workflow_call:
    outputs:
      execution_result:
        description: Auth execution and per-spec verification must both succeed.
        value: ${{ jobs.verify-changed-specs.outputs.execution_result }}
    inputs:
      changed_specs:
        description: JSON list of new or modified specs to validate on a PR.
        required: true
        type: string

  schedule:
    - cron: '0 3 * * *'
  # PRs exercise local providers with disposable fixture accounts. Changed-spec
  # calls also require evidence that every selected file actually executed.
  pull_request:
    paths:
      # UI-side auth surface — components, utils, and the state store that
      # drive the login/refresh flow this matrix exercises.
      - 'openmetadata-ui/src/main/resources/ui/src/components/Auth/**'
      - 'openmetadata-ui/src/main/resources/ui/src/utils/Auth/**'
      - 'openmetadata-ui/src/main/resources/ui/src/hooks/useApplicationStore.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/AppRoot.tsx'
      - 'openmetadata-ui/src/main/resources/ui/src/index.tsx'
      - 'openmetadata-ui/src/main/resources/ui/playwright/e2e/Auth/**'
      - 'openmetadata-ui/src/main/resources/ui/playwright/utils/sso-providers/**'
      - 'openmetadata-ui/src/main/resources/ui/playwright/utils/ssoLogin.ts'
      # Page-level auth screens. A ui-migration PR touching these can silently
      # invalidate the SSO fixtures' locators (see #33646 for the antd →
      # ui-core-components migration that dropped `.signin-button` and moved
      # the `full-name-input` testid onto a wrapper `<div>` — the PR-lane
      # only ran non-SSO Playwright specs, so the drift merged green and
      # only surfaced in the nightly). Bringing these into the SSO gate
      # forces the matrix to run when these pages change, catching the
      # class of regression that #33646 fixed.
      - 'openmetadata-ui/src/main/resources/ui/src/pages/LoginPage/**'
      - 'openmetadata-ui/src/main/resources/ui/src/pages/SignUp/**'
      - 'openmetadata-ui/src/main/resources/ui/src/pages/ForgotPassword/**'
      - 'openmetadata-ui/src/main/resources/ui/src/pages/ResetPassword/**'
      - 'openmetadata-ui/src/main/resources/ui/src/components/common/LoginButton/**'
      # ui-core-components primitives (buttons/input/form/form-field) are
      # intentionally NOT in this PR gate; drift is caught by the nightly run.
      # ADR:2026-10-13-sso-pr-gate-covers-auth-owned-paths-only
      # Backend auth surface — narrow to the packages the SSO matrix
      # actually exercises (login/refresh, JWT filter, SAML handler,
      # OIDC/SAML code flow, LDAP/basic authenticators, the servlet
      # handler factory, and the public /system/config/auth endpoint).
      # Sibling `security/` packages (mask, policyevaluator, jwt-key
      # rotation utilities) don't drive this matrix and stay off the
      # trigger to keep unrelated PRs from re-running a 40m docker leg.
      - 'openmetadata-service/src/main/java/org/openmetadata/service/security/JwtFilter.java'
      - 'openmetadata-service/src/main/java/org/openmetadata/service/security/AuthenticationCodeFlowHandler.java'
      - 'openmetadata-service/src/main/java/org/openmetadata/service/security/AuthServeletHandlerFactory.java'
      - 'openmetadata-service/src/main/java/org/openmetadata/service/security/SecurityUtil.java'
      - 'openmetadata-service/src/main/java/org/openmetadata/service/security/auth/**'
      - 'openmetadata-service/src/main/java/org/openmetadata/service/security/saml/**'
      - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/system/ConfigResource.java'
      # Schema-first source of truth for auth types (authentication,
      # authorizer, SAML/OIDC client configs). A schema change regenerates
      # POJOs the BE serves and TS types the SPA consumes.
      - 'openmetadata-spec/src/main/resources/json/schema/configuration/authenticationConfiguration.json'
      - 'openmetadata-spec/src/main/resources/json/schema/configuration/authorizerConfiguration.json'
      - 'openmetadata-spec/src/main/resources/json/schema/auth/**'
      - 'openmetadata-spec/src/main/resources/json/schema/security/**'
      # Test-env plumbing: `docker/development/docker-compose.yml` wires the
      # OM stack + mock-oidc; `docker/local-sso/**` hosts the per-provider
      # IdP fixtures (Keycloak SAML, OpenLDAP); the workflow's own edits
      # should re-run itself.
      - 'docker/development/docker-compose.yml'
      - 'docker/local-sso/**'
      - '.github/workflows/playwright-sso-login-nightly.yml'
  workflow_dispatch:
    inputs:
      sso_provider:
        description: 'SSO provider (or "all")'
        required: true
        default: okta
        type: choice
        options:
          - basic
          - ldap
          - keycloak-oidc-confidential
          - keycloak-oidc-public
          - msal-mock
          - auth0-mock
          - okta
          - keycloak-azure-saml
          - keycloak-azure-saml-crosssite
          - all
      send_slack_notification:
        description: "Send Slack notification with test results"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_REQUIRES_SECRETS: ${{ github.event_name == 'pull_request' }}

concurrency:
  # PR runs key on the PR number so re-pushes on the same PR cancel the
  # in-flight run; scheduled + dispatch runs key on ref+provider so branch
  # and per-provider dispatches don't cancel each other.
  group: sso-login-nightly-${{ inputs.changed_specs != '' && 'changed-specs' || 'all' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('{0}-{1}', github.ref, github.event.inputs.sso_provider || 'scheduled') }}
  cancel-in-progress: true

jobs:
  # Detects whether the PR touches Okta-specific files so the Okta leg (a
  # ~40-min live-tenant run) can be selectively enabled on PRs that touch
  # its own code without paying the cost on every unrelated auth PR.
  # Mirrors the `check-changes` pattern used by playwright-visual.yml et al.
  # Empty output on schedule / dispatch is fine — the SKIP_LEG expression
  # only consults it inside the pull_request/push clause.
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter calls the PR-files API on pull_request events; the
    # workflow-level `contents: read` block implicitly zeroes every other
    # scope, so grant read here explicitly (public-repo default happens to
    # allow it today, private forks would silently see zero changed files).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth_specs: ${{ steps.filter.outputs.auth_specs }}
      okta: ${{ inputs.changed_specs != '' && 'true' || steps.filter.outputs.okta }}
    steps:
      # Pinned by SHA — same policy the other paths-filter callers in this
      # repo use, since this action decides which PR-critical legs run.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            auth_specs:
              - 'openmetadata-ui/src/main/resources/ui/playwright/e2e/Auth/**/*.spec.ts'
            okta:
              # Playwright fixture + Okta-only spec
              - 'openmetadata-ui/src/main/resources/ui/playwright/utils/sso-providers/okta.ts'
              - 'openmetadata-ui/src/main/resources/ui/playwright/e2e/Auth/Okta*'
              # UI authenticator + provider that drive the Okta login flow
              - 'openmetadata-ui/src/main/resources/ui/src/components/Auth/AppAuthenticators/OktaAuthenticator.*'
              - 'openmetadata-ui/src/main/resources/ui/src/components/Auth/AuthProviders/OktaAuthProvider.*'
              - 'openmetadata-ui/src/main/resources/ui/src/utils/OktaCustomStorage.*'
              # Backend Okta config validator + schema
              - 'openmetadata-service/src/main/java/org/openmetadata/service/security/auth/validator/OktaAuthValidator.java'
              - 'openmetadata-spec/src/main/resources/json/schema/security/client/oktaSSOClientConfig.json'
              # This workflow's own edits (a SKIP_LEG or matrix change should
              # exercise the leg it's editing).
              - '.github/workflows/playwright-sso-login-nightly.yml'

  # To onboard a new provider:
  #   1. Add a matrix entry below. `name` is the fixture's `slug` from
  #      SsoProviderFixture (used as the @<slug> tag in SsoScenarios.spec.ts
  #      describe blocks). `env_prefix` is the uppercase/underscore form
  #      used to look up credentials. `filter` is the Playwright CLI arg
  #      (usually `--grep @<slug>`); legacy legs may use `--grep-invert ...`
  #      when their specs aren't in the SsoScenarios file. Also add `name`
  #      to the dispatch `options:` list above.
  #   2. Add <ENV_PREFIX>_SSO_USERNAME (variable) and <ENV_PREFIX>_SSO_PASSWORD
  #      (variable) to the `test` environment. Use a secret instead of a
  #      variable for the password if the provider uses a real (non-fixture)
  #      credential. Basic/LDAP/msal-mock/auth0-mock don't need CI-side
  #      credentials — their fixtures either use seeded admin creds or
  #      inject the SDK entirely in the browser context.
  #   3. If the fixture requires an external service (Keycloak, OpenLDAP),
  #      wire the compose-up step below.
  #   4. Every SsoScenarios describe block is tagged `[@<slug>, @sso-matrix]`
  #      — the filter picks a leg's own describes automatically.
  sso-login:
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    needs: check-changes
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    # Local providers use committed fixture accounts. Only trusted runs add live Okta.
    strategy:
      fail-fast: false
      matrix:
        provider: &local_sso_providers
          - name: 'basic'
            env_prefix: 'BASIC'
            filter: '--grep @basic'
            needs_docker: ''
          - name: 'ldap'
            env_prefix: 'LDAP'
            filter: '--grep @ldap'
            needs_docker: 'ldap'
          - name: 'keycloak-oidc-confidential'
            env_prefix: 'KEYCLOAK_OIDC'
            filter: '--grep @keycloak-oidc-confidential'
            needs_docker: 'keycloak'
          - name: 'keycloak-oidc-public'
            env_prefix: 'KEYCLOAK_OIDC'
            filter: '--grep @keycloak-oidc-public'
            needs_docker: 'keycloak'
          - name: 'msal-mock'
            env_prefix: 'MSAL_MOCK'
            filter: '--grep @msal-mock'
            needs_docker: ''
          - name: 'auth0-mock'
            env_prefix: 'AUTH0_MOCK'
            filter: '--grep @auth0-mock'
            # Real @auth0/auth0-react SDK now drives the mock IdP via the
            # Auth0-shape URL aliases (`/authorize`, `/oauth/token`, ...
            # see docker/development/mock-oidc-provider/server.js). The
            # in-page __omTestAuth0 shim is gone, so the leg genuinely
            # requires the mock service to be running.
            needs_docker: 'mock-oidc'
          - name: 'keycloak-azure-saml'
            env_prefix: 'KEYCLOAK_AZURE_SAML'
            filter: "--grep-invert '@okta|@sso-matrix|@self-signup-mock-oidc'"
            needs_docker: 'keycloak'
          - name: 'keycloak-azure-saml-crosssite'
            env_prefix: 'KEYCLOAK_AZURE_SAML'
            filter: "--grep-invert '@okta|@tokenRenewal|@sso-matrix|@self-signup-mock-oidc'"
            needs_docker: 'keycloak'
        include:
          - provider:
              name: 'okta'
              env_prefix: 'OKTA'
              # Regex quoted so the `|` isn't a shell pipe when the string
              # expands into the `Run SSO Scenarios` step's command line.
              # `@self-signup-mock-oidc` is excluded because that spec needs
              # the `mock-oidc-provider` docker service which no leg starts.
              filter: "--grep-invert '@tokenRenewal|@sso-matrix|@self-signup-mock-oidc'"
              needs_docker: ''
    env:
      SKIP_LEG: >-
        ${{
          (github.event_name == 'workflow_dispatch'
            && github.event.inputs.sso_provider != 'all'
            && github.event.inputs.sso_provider != matrix.provider.name)
          || ((github.event_name == 'pull_request' || github.event_name == 'push')
              && matrix.provider.name == 'keycloak-azure-saml-crosssite' && inputs.changed_specs == '')
          || ((github.event_name == 'pull_request' || github.event_name == 'push')
              && matrix.provider.name == 'okta'
              && needs.check-changes.outputs.okta != 'true')
        }}
    steps: &sso_login_steps
      - name: Skip leg early
        if: env.SKIP_LEG == 'true'
        run: |
          echo "::notice::Leg '${{ matrix.provider.name }}' skipped for event '${{ github.event_name }}' (dispatch=${{ github.event.inputs.sso_provider }})."

      - name: Free Disk Space (Ubuntu)
        if: env.SKIP_LEG != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false

      - name: Checkout
        if: env.SKIP_LEG != 'true'
        uses: actions/checkout@v7

      - name: Cache Maven Dependencies
        if: env.SKIP_LEG != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Reuses the pulled openldap / keycloak images across runs on the same
      # runner so we don't re-pull ~50MB (openldap) or ~500MB (keycloak) every
      # nightly. Cache is keyed on the docker-compose file hash so a bump of
      # any pinned image invalidates it deterministically.
      - name: Cache SSO Docker images
        if: ${{ env.SKIP_LEG != 'true' && matrix.provider.needs_docker != '' }}
        uses: actions/cache@v5
        with:
          path: /tmp/sso-docker-cache
          key: sso-docker-images-${{ hashFiles('docker/development/docker-compose.yml', 'docker/local-sso/keycloak-saml/docker-compose.yml', 'docker/local-sso/openldap/docker-compose.yml') }}-v1

      - name: Load cached Docker images
        if: ${{ env.SKIP_LEG != 'true' && matrix.provider.needs_docker != '' && hashFiles('/tmp/sso-docker-cache/*.tar') != '' }}
        run: |
          for image in /tmp/sso-docker-cache/*.tar; do
            [ -f "$image" ] && docker load -i "$image" || true
          done

      - name: Setup OpenMetadata Test Environment
        if: env.SKIP_LEG != 'true'
        # `PW_E2E_BUILD=true` propagates through this composite step into
        # `run_local_docker.sh` → `mvn` → `frontend-maven-plugin` → `vite
        # build`, and vite.config.ts's `loadEnv(mode, cwd, '')` picks it up
        # (empty prefix loads any env var, not just VITE_*). It flips the
        # `define: 'import.meta.env.PW_E2E_BUILD'` inline to `true` for
        # this build, arming the mocked-SDK shims in `MsalAuthenticator`
        # and `Auth0Authenticator` that `page.addInitScript` reaches
        # through `window.__omTestMsal` / `__omTestAuth0`. Without this
        # flag the shims tree-shake out and the msal-mock / auth0-mock
        # matrix legs fail cold-load-with-expired-token (scenario 4)
        # because the fixture's mock instance is never installed.
        env:
          PW_E2E_BUILD: 'true'
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: '3.10'
          args: '-d postgresql -i false'
          ingestion_dependency: 'all'
          install-test-dependencies: 'false'

      - name: Setup Node.js
        if: env.SKIP_LEG != 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: 'openmetadata-ui/src/main/resources/ui/.nvmrc'

      - name: Install dependencies
        if: env.SKIP_LEG != 'true'
        working-directory: openmetadata-ui/src/main/resources/ui/
        run: yarn --ignore-scripts --frozen-lockfile

      - name: Install Playwright Browsers
        if: env.SKIP_LEG != 'true'
        run: npx playwright@1.57.0 install chromium --with-deps

      - name: Start OpenLDAP
        if: ${{ env.SKIP_LEG != 'true' && matrix.provider.needs_docker == 'ldap' }}
        run: |
          # Dedicated compose file, same pattern Keycloak-SAML uses — keeps
          # the LDAP fixture (image, LDIF seed, healthcheck) off of the main
          # OM stack's docker-compose.yml. See docker/local-sso/openldap/README.md.
          docker compose -f docker/local-sso/openldap/docker-compose.yml up -d
          # Wait for the healthcheck to pass — LDIF seeding happens on first
          # boot and can take 10-20s on cold cache.
          timeout 120 bash -c 'until docker inspect --format="{{.State.Health.Status}}" openmetadata_openldap 2>/dev/null | grep -q healthy; do sleep 2; done'
          # OM backend needs to reach OpenLDAP by the short name `openldap`
          # (see ldap.ts fixture — `ldapConfiguration.host = 'openldap'`).
          # Attach to ometa_network with an explicit alias — the container
          # lives in its own compose project (openmetadata-openldap) so
          # its local service alias isn't advertised on the OM stack's
          # network by default.
          docker network connect --alias openldap ometa_network openmetadata_openldap || true

      - name: Start Mock OIDC provider
        if: ${{ env.SKIP_LEG != 'true' && matrix.provider.needs_docker == 'mock-oidc' }}
        run: |
          docker compose -f docker/development/docker-compose.yml --profile sso-test up -d mock-oidc-provider
          # OM backend needs to reach the mock over the compose network by
          # its container name (JWKS fetch during JWT validation); the
          # SPA also needs it reachable from the browser under
          # http://localhost:9090. `docker network connect` attaches the
          # ad-hoc mock container to the shared network the OM stack is on.
          docker network connect ometa_network mock_oidc_provider || true
          # Wait for the mock's own /health rather than the compose
          # healthcheck (the tag doesn't ship with one). 60s is generous
          # for the tiny node service.
          timeout 60 bash -c 'until curl -fsS http://localhost:9090/health >/dev/null; do sleep 2; done'

      - name: Start Keycloak SAML IdP
        if: ${{ env.SKIP_LEG != 'true' && matrix.provider.needs_docker == 'keycloak' }}
        env:
          # Must name the host this leg's browser uses, or Keycloak answers
          # "Invalid Request". The '-crosssite' leg fronts the IdP on 127.0.0.1.
          KEYCLOAK_HOSTNAME: ${{ matrix.provider.name == 'keycloak-azure-saml-crosssite' && 'http://127.0.0.1:8080' || 'http://localhost:8080' }}
        run: |
          docker compose -f docker/local-sso/keycloak-saml/docker-compose.yml up -d
          # The OM container needs to reach Keycloak by name; localhost:8080 is
          # its own loopback. Tolerates a missing network and a repeat attach.
          docker network connect ometa_network openmetadata-keycloak-saml || true
          timeout 180 bash -c 'until curl -fsS http://localhost:8080/realms/om-azure-saml >/dev/null; do sleep 2; done'

      - name: Save Docker images for cache
        if: ${{ env.SKIP_LEG != 'true' && matrix.provider.needs_docker != '' }}
        run: |
          mkdir -p /tmp/sso-docker-cache
          # Save whichever images this leg actually pulled — smallest set.
          if [ "${{ matrix.provider.needs_docker }}" = "ldap" ]; then
            docker save bitnamilegacy/openldap:2.6.7 -o /tmp/sso-docker-cache/openldap.tar || true
          fi
          if [ "${{ matrix.provider.needs_docker }}" = "keycloak" ]; then
            # keycloak image tag is decided by docker/local-sso/keycloak-saml/docker-compose.yml
            docker save $(docker inspect openmetadata-keycloak-saml --format='{{.Image}}') -o /tmp/sso-docker-cache/keycloak.tar || true
          fi

      - name: Configure the queued Okta provider
        if: ${{ github.event_name == 'merge_group' && matrix.provider.name == 'okta' }}
        env:
          OKTA_CLIENT_ID: ${{ github.event_name != 'pull_request' && vars.OKTA_CLIENT_ID || '' }}
          OKTA_AUTHORITY_URL: ${{ github.event_name != 'pull_request' && vars.OKTA_AUTHORITY_URL || '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!process.env.OKTA_CLIENT_ID || !process.env.OKTA_AUTHORITY_URL) throw new Error('Queue Okta configuration is missing');
          const domain = new URL(process.env.OKTA_AUTHORITY_URL).host;
          fs.appendFileSync(process.env.GITHUB_ENV, `OKTA_CLIENT_ID=${process.env.OKTA_CLIENT_ID}\nOKTA_DOMAIN=${domain}\n`);
          NODE

      - name: Run SSO Scenarios
        if: env.SKIP_LEG != 'true'
        working-directory: openmetadata-ui/src/main/resources/ui
        env:
          CHANGED_SPECS: ${{ inputs.changed_specs }}
          SSO_PROVIDER_TYPE: ${{ matrix.provider.name }}
          SSO_USERNAME: ${{ github.event_name != 'pull_request' && (vars[format('{0}_SSO_USERNAME', matrix.provider.env_prefix)]) || env.SSO_USERNAME }}
          SSO_PASSWORD: ${{ github.event_name != 'pull_request' && (vars[format('{0}_SSO_PASSWORD', matrix.provider.env_prefix)] || secrets[format('{0}_SSO_PASSWORD', matrix.provider.env_prefix)]) || env.SSO_PASSWORD }}
          # The '-crosssite' variant fronts the IdP on 127.0.0.1 while OM stays on localhost. The two
          # are a same registrable-domain pair but a *different site* (SameSite ignores port; 127.0.0.1
          # and localhost are distinct sites), so the SAML callback POST is cross-site and the browser
          # drops the SameSite=Lax OM_SESSION cookie. This reproduces the production "No pending session"
          # failure that the localhost-only job cannot, guarding the SAML RelayState fix.
          KEYCLOAK_SAML_BASE_URL: ${{ matrix.provider.name == 'keycloak-azure-saml-crosssite' && 'http://127.0.0.1:8080' || 'http://localhost:8080' }}
          # Browser-facing URL for the auth0-mock leg's fixture — Auth0
          # SPA SDK talks here. `MOCK_OIDC_INTERNAL_URL` is what OM
          # backend uses for JWKS fetch inside the compose network; two
          # separate URLs because `localhost:9090` from inside a container
          # is the container itself, not the host.
          MOCK_OIDC_URL: ${{ matrix.provider.needs_docker == 'mock-oidc' && 'http://localhost:9090' || '' }}
          MOCK_OIDC_INTERNAL_URL: ${{ matrix.provider.needs_docker == 'mock-oidc' && 'http://mock-oidc-provider:9090' || '' }}
          PLAYWRIGHT_IS_OSS: true
        run: |
          files=() empty_args=()
          if [[ -n "$CHANGED_SPECS" ]]; then
            mapfile -t files < <(jq -r '.[]' <<< "$CHANGED_SPECS")
            empty_args=(--pass-with-no-tests)
          fi
          npx playwright test --project=sso-auth --workers=1 ${{ matrix.provider.filter }} "${files[@]}" "${empty_args[@]}"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sso-login-html-report-${{ matrix.provider.name }}
          overwrite: true
          path: openmetadata-ui/src/main/resources/ui/playwright/output/playwright-report
          retention-days: 5

      # Per-leg outcome file consumed by the notify-slack aggregator job. We
      # write a tiny status.txt (skipped / setup-failed / completed) alongside
      # the results.json (when the test step actually ran) so the aggregator
      # can distinguish "leg didn't run for this event" from "leg failed
      # before tests started" from "tests ran, look at counts".
      - name: Record leg outcome
        if: always()
        run: |
          mkdir -p /tmp/sso-leg
          if [ "${SKIP_LEG:-false}" = "true" ]; then
            echo "skipped" > /tmp/sso-leg/status.txt
          elif [ -f openmetadata-ui/src/main/resources/ui/playwright/output/results.json ]; then
            cp openmetadata-ui/src/main/resources/ui/playwright/output/results.json /tmp/sso-leg/results.json
            echo "completed" > /tmp/sso-leg/status.txt
          else
            echo "setup-failed" > /tmp/sso-leg/status.txt
          fi

      - name: Upload leg outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sso-login-outcome-${{ matrix.provider.name }}
          overwrite: true
          path: /tmp/sso-leg/
          retention-days: 5

      - name: Clean Up
        # Runs even on step failure, but not on skipped legs — the leg never
        # checked out the repo or booted docker, so `cd ./docker/development`
        # would fail with "no such file or directory".
        if: ${{ always() && env.SKIP_LEG != 'true' }}
        run: |
          docker compose -f docker/local-sso/keycloak-saml/docker-compose.yml down --remove-orphans || true
          docker compose -f docker/local-sso/openldap/docker-compose.yml down --remove-orphans || true
          docker compose -f docker/development/docker-compose.yml --profile sso-test down --remove-orphans || true
          cd ./docker/development
          docker compose down --remove-orphans
          sudo rm -rf ${PWD}/docker-volume

  # Slack Block Kit's `type: table` block (see saas-provisioner's
  # slack_release_test.py for the reference shape) gives real rows/columns
  # with per-cell emoji and right-alignment — no monospace hack needed.
  # The summary Python script builds the full payload; this step just POSTs.
  sso-login-pr:
    if: ${{ github.event_name == 'pull_request' && (inputs.changed_specs != '' || needs.check-changes.outputs.auth_specs != 'true') }}
    needs: check-changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: *local_sso_providers
    env:
      # These disposable accounts are seeded by the committed Keycloak realm.
      SSO_USERNAME: ${{ startsWith(matrix.provider.name, 'keycloak-') && 'azure.saml@openmetadata.local' || '' }}
      SSO_PASSWORD: ${{ startsWith(matrix.provider.name, 'keycloak-') && 'OpenMetadata@123' || '' }}
      SKIP_LEG: >-
        ${{
          (github.event_name == 'workflow_dispatch'
            && github.event.inputs.sso_provider != 'all'
            && github.event.inputs.sso_provider != matrix.provider.name)
          || ((github.event_name == 'pull_request' || github.event_name == 'push')
              && matrix.provider.name == 'keycloak-azure-saml-crosssite' && inputs.changed_specs == '')
          || ((github.event_name == 'pull_request' || github.event_name == 'push')
              && matrix.provider.name == 'okta'
              && needs.check-changes.outputs.okta != 'true')
        }}
    steps: *sso_login_steps

  sso-login-queue:
    if: ${{ github.event_name == 'merge_group' && inputs.changed_specs != '' }}
    needs: check-changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider:
          - name: okta
            env_prefix: OKTA
            filter: '--grep @requires-secrets'
            needs_docker: ''
    env:
      SKIP_LEG: false
    steps: *sso_login_steps

  notify-slack:
    if: ${{ always() && github.event_name != 'pull_request' && (github.event_name == 'schedule' || inputs.send_slack_notification == true) }}
    needs: sso-login
    runs-on: ubuntu-latest
    steps:
      # actions/* pinned by SHA — same policy dorny/paths-filter uses above,
      # since these run before every notify + fetch the tree/artifacts the
      # notifier trusts.
      - name: Checkout (for shared summary script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts/build_sso_login_summary.py
          sparse-checkout-cone-mode: false

      - name: Download leg outcomes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: sso-login-outcome-*
          path: outcomes

      - name: Build consolidated summary
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/build_sso_login_summary.py /tmp/sso-summary

      - name: Post to Slack
        env:
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.E2E_SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: C04HGB0NY04
        run: |
          set -euo pipefail
          # The Python script wrote a text+blocks payload — layer the
          # channel on top with jq so we don't hard-code it in Python.
          jq --arg channel "$SLACK_CHANNEL" '. + {channel: $channel}' \
            /tmp/sso-summary/slack_blocks.json > /tmp/sso-payload.json

          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_USER_OAUTH_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @/tmp/sso-payload.json)
          echo "Slack API response: $response"
          if [ "$(echo "$response" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack post failed: $response"
            exit 1
          fi

  verify-changed-specs:
    outputs:
      execution_result: ${{ steps.verify.outputs.execution_result }}
    needs: [sso-login-pr, sso-login-queue]
    if: ${{ always() && inputs.changed_specs != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: sso-login-outcome-*
          path: sso-results
      - name: Verify every changed auth spec executed
        id: verify
        env:
          CHANGED_SPECS: ${{ inputs.changed_specs }}
          AUTH_RESULT: ${{ github.event_name == 'merge_group' && needs.sso-login-queue.result || needs.sso-login-pr.result }}
        run: |
          tag_args=()
          if [[ "$GITHUB_EVENT_NAME" == 'merge_group' ]]; then tag_args=(--require-tag @requires-secrets); fi
          python3 .github/scripts/verify_playwright_changed_specs.py \
            "${tag_args[@]}" \
            --specs-json "$CHANGED_SPECS" \
            --report-glob 'sso-results/**/results.json'
          [[ "$AUTH_RESULT" == 'success' ]]
          echo "execution_result=success" >> "$GITHUB_OUTPUT"
