name: Python checks
'on':
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact revision to check
        type: string
        required: true
      run-tests:
        description: Run static checks and unit tests
        type: boolean
        required: true
      run-style:
        description: Run Python checkstyle
        type: boolean
        required: true
      minimum-python:
        description: Minimum supported Python for static and style checks
        type: string
        required: true
      python-versions:
        description: JSON unit-test version matrix
        type: string
        required: true
      coverage-python:
        description: Python supplying coverage and control tests
        type: string
        required: true
      spacy-artifact-id:
        description: spaCy wheel artifact from the preparation stage (artifact ID)
        type: string
        required: true
    outputs:
      style-result:
        description: Checkstyle job result
        value: ${{ jobs.style.result }}
      tests-result:
        description: Combined static-check and unit-test result
        value: ${{ jobs.static.result == jobs.unit.result && jobs.unit.result || 'failure' }}
permissions:
  contents: read
jobs:
  style:
    name: Python checkstyle
    if: ${{ inputs.run-style }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.minimum-python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Install Ruff and check style
        shell: bash
        run: |
          uv venv env --python "${{ inputs.minimum-python }}"
          uv pip install --python env/bin/python "ruff~=0.15.12"
          source env/bin/activate
          make py_format_check
  static:
    name: Python static checks
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: ${{ inputs.minimum-python }}
          install-server: 'false'
      - name: Run Static Checks
        run: |
          set -o pipefail
          source env/bin/activate
          cd ingestion
          python -m nox --non-interactive --no-venv -s static-checks 2>&1 | tee static-checks-run.log
        shell: bash
  unit:
    name: Python unit tests (${{ matrix.py-version }})
    if: ${{ inputs.run-tests && inputs.spacy-artifact-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        py-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: ${{ matrix.py-version }}
          install-server: 'false'
      - name: Download spaCy model
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: /tmp/spacy-model
          artifact-ids: ${{ inputs.spacy-artifact-id }}
      - name: Run Nox argument regressions
        if: ${{ matrix.py-version == inputs.coverage-python }}
        run: |
          source env/bin/activate
          python -m pytest .github/scripts/tests/test_nox_cli.py -q
        shell: bash
      - name: Run offline E2E framework tests
        if: ${{ matrix.py-version == inputs.coverage-python }}
        run: |
          source env/bin/activate
          cd ingestion
          env -u OM_JWT_TOKEN OM_SERVER_URL=http://127.0.0.1:1/api \
            python -m pytest tests/cli_e2e_v2/meta -q
        shell: bash
      - name: Install and verify spaCy model
        run: |
          source env/bin/activate
          uv pip install --no-deps /tmp/spacy-model/*.whl
          python -c 'import spacy; spacy.load("en_core_web_md")'
        shell: bash
      - name: Run Unit Tests
        id: unit-tests
        run: |
          set -o pipefail
          source env/bin/activate
          cd ingestion
          set +e
          python -m nox --non-interactive --no-venv -s unit-tests 2>&1 | tee unit-test-run.log
          test_exit_code=${PIPESTATUS[0]}
          echo "$test_exit_code" > unit-test-exit-code.txt
          exit "$test_exit_code"
        shell: bash
      - name: Classify Python unit test outcome
        if: ${{ always() }}
        env:
          TEST_LANE: python-${{ matrix.py-version }}
          TEST_PROFILE: python-unit
          TEST_STEP_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: |
          test_exit_code=""
          if [[ -s ingestion/unit-test-exit-code.txt ]]; then
            read -r test_exit_code < ingestion/unit-test-exit-code.txt
          fi
          python3 .github/scripts/classify_test_outcome.py \
            --step-outcome "$TEST_STEP_OUTCOME" \
            --exit-code "$test_exit_code" \
            --report-glob 'ingestion/junit/test-results-*.xml' \
            --diagnostic-glob 'ingestion/*-test-run.log' \
            --diagnostic-glob 'ingestion/static-checks-run.log' \
            --output ingestion/ci-diagnostics/outcome.json
      - name: Upload test results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-unit-test-results-${{ matrix.py-version }}
          path: |
            ingestion/junit/
            ingestion/ci-diagnostics/outcome.json
            ingestion/*-test-run.log
            ingestion/static-checks-run.log
            ingestion/unit-test-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
      - name: Upload coverage artifact
        if: ${{ matrix.py-version == inputs.coverage-python && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-coverage-unit-${{ matrix.py-version }}
          path: ingestion/.coverage
          include-hidden-files: true
