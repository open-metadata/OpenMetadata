name: ci-merge-queue
on:
  merge_group: null
  workflow_dispatch:
    inputs:
      workload:
        description: Queue checks to run manually
        type: choice
        options: [all, python, java, data-access-request]
        default: all
      store-database-version:
        description: Metadata store MySQL version, shipped or oldest
        type: choice
        options: [shipped, oldest]
        default: shipped
permissions:
  contents: read
  packages: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.workload }}-${{ inputs.store-database-version }}
  cancel-in-progress: true
jobs:
  plan:
    uses: ./.github/workflows/reusable-ci-plan.yml
    with:
      entrypoint: merge-queue

  backend:
    name: Build backend image
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' || needs.plan.outputs.airflow-apis == 'true' || needs.plan.outputs.docker-smoke == 'true' }}
    uses: ./.github/workflows/reusable-build-backend.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  py-static-checks:
    name: py-static-checks
    needs: plan
    if: ${{ needs.plan.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Python static checks
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
          check-types: ${{ needs.plan.outputs.python }}

  prepare-classification-models:
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/prepare_classification_models.py
            ingestion/pyproject.toml
            .github/actions/prepare-classification-models
            .github/actions/prepare-classification-model
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/prepare-classification-models

  python-unit:
    needs:
      - plan
      - prepare-classification-models
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Python unit tests
        uses: ./.github/actions/python-unit
        with:
          python-version: ${{ needs.plan.outputs.python-highest }}

  python-integration:
    needs:
      - plan
      - prepare-classification-models
      - backend
    if: ${{ needs.plan.outputs.python == 'true' }}
    uses: ./.github/workflows/reusable-py-integration.yml
    with:
      python-version: ${{ needs.plan.outputs.python-highest }}
      ref: ${{ needs.plan.outputs.ref }}
      source-database-version: newest
      collect-coverage: false

  airflow-apis:
    needs: [plan, backend]
    if: ${{ needs.plan.outputs.airflow-apis == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Airflow API tests
        uses: ./.github/actions/python-airflow-apis
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
          use-backend-image: 'true'

  py-tests-status:
    name: py-tests-status
    needs:
      - plan
      - airflow-apis
      - py-static-checks
      - prepare-classification-models
      - python-unit
      - python-integration
    if: ${{ always() && (github.event_name == 'merge_group' || inputs.workload == 'all' || inputs.workload == 'python') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Verify selected Python workloads
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_RESULTS: |
            {
              "plan": "success",
              "airflow-apis": "${{ needs.plan.outputs.airflow-apis == 'true' && 'success' || 'skipped' }}",
              "py-static-checks": "${{ needs.plan.outputs.static == 'true' && 'success' || 'skipped' }}",
              "prepare-classification-models": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "python-unit": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "python-integration": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}"
            }
        run: |
          jq -e -n --argjson needs "$NEEDS_JSON" --argjson expected "$EXPECTED_RESULTS" '
            $expected | length > 0 and
            (keys == ($needs | keys)) and
            all(to_entries[]; . as $job |
              ($job.value == "success" or $job.value == "skipped") and
              $needs[$job.key].result == $job.value)
          '
        shell: bash

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.checkstyle == 'true') }}
    steps:
      - name: Require successful CI planning
        if: ${{ needs.plan.result != 'success' }}
        run: exit 1
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Hydrate Maven dependencies
        uses: ./.github/actions/hydrate-maven-cache

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: "21"
          distribution: "temurin"

      # Fail-fast checkstyle: if formatting fails, skip unit tests and report
      # the exact files in the summary below.
      - name: "1/2: Java checkstyle"
        id: checkstyle
        shell: bash
        run: |
          mvn -B -T 1C spotless:apply
          git diff --name-only > "$RUNNER_TEMP/checkstyle-failed-files.txt"
          if [[ -s "$RUNNER_TEMP/checkstyle-failed-files.txt" ]]; then
            echo "Java checkstyle found unformatted files:"
            cat "$RUNNER_TEMP/checkstyle-failed-files.txt"
            exit 1
          fi

      # No -Pstatic-code-analysis: its JaCoCo agent slowed every test, yet `package`
      # never builds the report and nothing uploads it. No apt/ANTLR install either:
      # nothing here uses them (openmetadata-spec's prepare_model_schemas.py needs
      # only stdlib python3).
      - name: "2/2: Service unit tests"
        id: unit-tests
        if: ${{ steps.checkstyle.outcome == 'success' && needs.plan.outputs.java-unit == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mvn -B -T 1C clean package -pl openmetadata-service -am \
            -DfailIfNoTests=false

      - name: Summarize backend checks
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/java-backend-report
        with:
          checkstyle-outcome: ${{ steps.checkstyle.outcome }}
          unit-tests-outcome: ${{ steps.unit-tests.outcome }}

  k8s_operator-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: ${{ needs.plan.outputs.java-operator == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Run Kubernetes operator unit tests
        uses: ./.github/actions/java-k8s-operator-tests

  docker-image-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, backend]
    if: ${{ needs.plan.outputs.docker-smoke == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Smoke test the server image
        uses: ./.github/actions/java-docker-smoke

  backend-checks-status:
    name: backend-checks-status
    needs:
      - plan
      - backend-checks
      - k8s_operator-unit-tests
      - docker-image-smoke-test
      - integration-test-build
      - it-mysql-elasticsearch
      - it-postgres-opensearch
      - it-postgres-elasticsearch-redis
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: ${{ always() && (github.event_name == 'merge_group' || inputs.workload == 'all' || inputs.workload == 'java') }}
    steps:
      - name: Verify selected Java backend workloads
        env:
          CHANGES_RESULT: ${{ needs.plan.result }}
          CHECKSTYLE_CHANGED: ${{ needs.plan.outputs.checkstyle }}
          JAVA_CHANGED: ${{ needs.plan.outputs.java-unit }}
          K8S_CHANGED: ${{ needs.plan.outputs.java-operator }}
          DOCKER_CHANGED: ${{ needs.plan.outputs.docker-smoke }}
          JAVA_IT_CHANGED: ${{ needs.plan.outputs.java-it }}
          REDIS_IT_CHANGED: ${{ needs.plan.outputs.java-it-redis }}
          SERVICE_RESULT: ${{ needs.backend-checks.result }}
          K8S_RESULT: ${{ needs.k8s_operator-unit-tests.result }}
          DOCKER_RESULT: ${{ needs.docker-image-smoke-test.result }}
          IT_BUILD_RESULT: ${{ needs.integration-test-build.result }}
          MYSQL_ES_RESULT: ${{ needs.it-mysql-elasticsearch.result }}
          POSTGRES_OS_RESULT: ${{ needs.it-postgres-opensearch.result }}
          POSTGRES_REDIS_RESULT: ${{ needs.it-postgres-elasticsearch-redis.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::CI planning did not succeed: ${CHANGES_RESULT}"
            exit 1
          fi

          fail=0
          check() {
            local name="$1" changed="$2" result="$3"
            if [[ "$changed" != "true" ]]; then
              echo "${name}: no relevant paths changed, skipped."
              return
            fi
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} did not succeed (result=${result})"
              fail=1
            else
              echo "${name}: success"
            fi
          }
          backend_changed="false"
          if [[ "$JAVA_CHANGED" == "true" || "$CHECKSTYLE_CHANGED" == "true" ]]; then
            backend_changed="true"
          fi
          check "backend-checks" "$backend_changed" "$SERVICE_RESULT"
          check "k8s_operator-unit-tests"         "$K8S_CHANGED"     "$K8S_RESULT"
          check "docker-image-smoke-test"         "$DOCKER_CHANGED"  "$DOCKER_RESULT"
          check "integration-test-build" "$JAVA_IT_CHANGED" "$IT_BUILD_RESULT"
          check "it-mysql-elasticsearch" "$JAVA_IT_CHANGED" "$MYSQL_ES_RESULT"
          check "it-postgres-opensearch" "$JAVA_IT_CHANGED" "$POSTGRES_OS_RESULT"
          check "it-postgres-elasticsearch-redis" "$REDIS_IT_CHANGED" "$POSTGRES_REDIS_RESULT"
          exit $fail

  integration-test-build:
    name: Build Integration Test Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.java-it == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Build the Java integration test runtime
        uses: ./.github/actions/java-integration-build

  it-mysql-elasticsearch:
    needs: [plan, backend-checks, integration-test-build]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.java-it == 'true' &&
      (needs.backend-checks.result == 'success' || needs.backend-checks.result == 'skipped') &&
      needs.integration-test-build.result == 'success'
    permissions:
      contents: read
      checks: write
      packages: read
    uses: ./.github/workflows/reusable-java-integration-lanes.yml
    with:
      profile_label: mysql-elasticsearch
      maven_profile: mysql-elasticsearch
      artifact_name: java-it-build-${{ github.run_id }}
      lanes_json: '["parallel","global-state","multi-node","retry-queue","rdf"]'
      store_database_version: ${{ inputs.store-database-version || 'shipped' }}

  it-postgres-opensearch:
    needs: [plan, backend-checks, integration-test-build]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.java-it == 'true' &&
      (needs.backend-checks.result == 'success' || needs.backend-checks.result == 'skipped') &&
      needs.integration-test-build.result == 'success'
    permissions:
      contents: read
      checks: write
      packages: read
    uses: ./.github/workflows/reusable-java-integration-lanes.yml
    with:
      profile_label: postgres-opensearch
      maven_profile: postgres-opensearch
      artifact_name: java-it-build-${{ github.run_id }}
      lanes_json: '["parallel","global-state","multi-node","retry-queue","rdf"]'

  it-postgres-elasticsearch-redis:
    needs: [plan, backend-checks, integration-test-build]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.java-it-redis == 'true' &&
      (needs.backend-checks.result == 'success' || needs.backend-checks.result == 'skipped') &&
      needs.integration-test-build.result == 'success'
    permissions:
      contents: read
      checks: write
      packages: read
    uses: ./.github/workflows/reusable-java-integration-lanes.yml
    with:
      profile_label: postgres-elasticsearch-redis
      maven_profile: cache-tests
      artifact_name: java-it-build-${{ github.run_id }}
      lanes_json: '["parallel","global-state","multi-node","retry-queue"]'

  # Keep these required check names reporting until merge-rules requires backend-checks-status.
  integration-tests-mysql-elasticsearch:
    name: integration-tests-mysql-elasticsearch
    needs: [plan, backend-checks, integration-test-build, it-mysql-elasticsearch]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: &report-legacy-integration-status ${{ always() && github.event_name == 'merge_group' }}
    steps:
      - name: Verify MySQL + Elasticsearch Integration Test Lanes
        env:
          CHANGES_RESULT: ${{ needs.plan.result }}
          BACKEND_CHANGED: ${{ needs.plan.outputs.java-it == 'true' }}
          UNIT_RESULT: ${{ needs.backend-checks.result }}
          BUILD_RESULT: ${{ needs.integration-test-build.result }}
          LANES_RESULT: ${{ needs.it-mysql-elasticsearch.result }}
        run: &verify-java-integration |
          if [[ "$CHANGES_RESULT" == "success" && "$BACKEND_CHANGED" != "true" ]]; then
            echo "No backend integration-test paths changed."
            exit 0
          fi
          if [[ "$CHANGES_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$LANES_RESULT" != "success" ]] || \
             [[ "$UNIT_RESULT" != "success" && "$UNIT_RESULT" != "skipped" ]]; then
            echo "Java integration jobs did not complete successfully: changes=${CHANGES_RESULT}, unit=${UNIT_RESULT}, build=${BUILD_RESULT}, lanes=${LANES_RESULT}"
            exit 1
          fi

  integration-tests-postgres-opensearch:
    name: integration-tests-postgres-opensearch
    needs: [plan, backend-checks, integration-test-build, it-postgres-opensearch]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: *report-legacy-integration-status
    steps:
      - name: Verify PostgreSQL + OpenSearch Integration Test Lanes
        env:
          CHANGES_RESULT: ${{ needs.plan.result }}
          BACKEND_CHANGED: ${{ needs.plan.outputs.java-it == 'true' }}
          UNIT_RESULT: ${{ needs.backend-checks.result }}
          BUILD_RESULT: ${{ needs.integration-test-build.result }}
          LANES_RESULT: ${{ needs.it-postgres-opensearch.result }}
        run: *verify-java-integration

  integration-tests-postgres-elasticsearch-redis:
    name: integration-tests-postgres-elasticsearch-redis
    needs: [plan, backend-checks, integration-test-build, it-postgres-elasticsearch-redis]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: *report-legacy-integration-status
    steps:
      - name: Verify PostgreSQL + Elasticsearch + Redis Integration Test Lanes
        env:
          CHANGES_RESULT: ${{ needs.plan.result }}
          BACKEND_CHANGED: ${{ needs.plan.outputs.java-it-redis }}
          UNIT_RESULT: ${{ needs.backend-checks.result }}
          BUILD_RESULT: ${{ needs.integration-test-build.result }}
          LANES_RESULT: ${{ needs.it-postgres-elasticsearch-redis.result }}
        run: *verify-java-integration

  validate-json-yaml:
    needs: plan
    if: ${{ needs.plan.outputs.json-yaml == 'true' || needs.plan.outputs.ci-rules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/validate-json-yaml
        if: ${{ needs.plan.outputs.json-yaml == 'true' }}
      - uses: ./.github/actions/validate-ci-rules
        if: ${{ needs.plan.outputs.ci-rules == 'true' }}

  data-access-request-e2e:
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      needs.plan.outputs.dar == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        (inputs.workload == 'all' || inputs.workload == 'data-access-request'))
    steps:
      # Dispatched by file name straight to the REST endpoint, not through
      # benc-uk/workflow-dispatch: that action finds the workflow by paging through the list of
      # every Collate workflow, GitHub serves those pages in two different orders at random, and
      # the lookup missed the workflow with "Unable to find workflow" on about one run in four.
      - name: Trigger Collate Playwright run & wait
        # Must stay above WAIT_SECONDS below. The step timeout kills the script outright, so when
        # it is the smaller of the two the wait can never run out on its own and the step
        # reports a bare "has timed out" with no downstream conclusion.
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ secrets.COLLATE_PAT }}
          COLLATE_REPO: open-metadata/openmetadata-collate
          SHA: ${{ needs.plan.outputs.ref }}
          EVENT: ${{ github.event_name }}
          # The Collate job caps itself at timeout-minutes: 90, so waiting past that point is
          # what guarantees we report its real conclusion instead of giving up first. Successful
          # runs are 48-60 min today, already at the edge of the previous 61-min budget.
          WAIT_SECONDS: 5700
        run: |
          run_id=$(gh api -X POST "repos/$COLLATE_REPO/actions/workflows/data-access-request-e2e.yml/dispatches" \
            -f ref=main -f "inputs[sha]=$SHA" -f "inputs[event]=$EVENT" \
            -F return_run_details=true --jq .workflow_run_id)
          if [ -z "$run_id" ]; then
            echo "::error::The dispatch returned no run id; find the run at https://github.com/$COLLATE_REPO/actions/workflows/data-access-request-e2e.yml"
            exit 1
          fi
          run_url="https://github.com/$COLLATE_REPO/actions/runs/$run_id"
          echo "Collate run: $run_url"
          status=0
          timeout "$WAIT_SECONDS" gh run watch "$run_id" --repo "$COLLATE_REPO" \
            --interval 60 --compact --exit-status || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Collate run still in progress after ${WAIT_SECONDS}s: $run_url"
          elif [ "$status" -ne 0 ]; then
            echo "::error::Collate run did not succeed: $run_url"
          fi
          exit "$status"
