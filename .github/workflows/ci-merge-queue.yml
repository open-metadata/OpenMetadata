name: ci-merge-queue
on:
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select Python workloads
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      lowest: ${{ steps.versions.outputs.lowest }}
      highest: ${{ steps.versions.outputs.highest }}
      ref: ${{ github.sha }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      static: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' || steps.filter.outputs.static == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: ${{ github.event_name == 'merge_group' }}
        with:
          base: ${{ github.event.merge_group.base_sha }}
          initial-fetch-depth: 2
          filters: .github/python-ci/paths.yml
      - name: Read Python versions
        id: versions
        run: python3 scripts/python_ci.py versions --output "$GITHUB_OUTPUT"
  py-checkstyle:
    name: py-checkstyle
    needs: plan
    if: ${{ needs.plan.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run formatting and lint
        uses: ./.github/actions/python-lint
        with:
          python-version: ${{ needs.plan.outputs.highest }}
  type-checks:
    name: Python type checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run type checks
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.lowest }}
    if: ${{ needs.plan.outputs.python == 'true' }}
  models:
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/prepare-classification-models
  backend:
    name: Build Backend Distribution
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/build-backend
        with:
          maven-args: -DskipTests -DonlyBackend clean package -pl openmetadata-dist -am
      - name: Upload backend distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openmetadata-backend-distribution
          path: openmetadata-dist/target/openmetadata-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  unit:
    needs:
      - plan
      - models
    if: ${{ needs.plan.outputs.python == 'true' }}
    uses: ./.github/workflows/py-unit.yml
    with:
      python-version: ${{ needs.plan.outputs.highest }}
      ref: ${{ needs.plan.outputs.ref }}
      collect-coverage: false
  integration:
    needs:
      - plan
      - models
      - backend
    if: ${{ needs.plan.outputs.python == 'true' }}
    uses: ./.github/workflows/py-integration.yml
    with:
      python-version: ${{ needs.plan.outputs.highest }}
      ref: ${{ needs.plan.outputs.ref }}
      collect-coverage: false
  py-tests-status:
    name: py-tests-status
    needs:
      - plan
      - py-checkstyle
      - type-checks
      - models
      - backend
      - unit
      - integration
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify selected Python workloads
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_RESULTS: |
            {
              "plan": "success",
              "py-checkstyle": "${{ needs.plan.outputs.static == 'true' && 'success' || 'skipped' }}",
              "type-checks": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "models": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "backend": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "unit": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}",
              "integration": "${{ needs.plan.outputs.python == 'true' && 'success' || 'skipped' }}"
            }
        run: python3 scripts/python_ci.py verify
