name: reusable-py-operator-build-test
on:
  workflow_call:
    inputs:
      ref:
        description: Git commit SHA to test; must match the shared images
        required: true
        type: string
      python-version:
        description: Highest supported Python version for sample-data validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  py-run-build-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download ingestion image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-ci-ingestion-image
          path: ${{ runner.temp }}
      - name: Load ingestion image
        run: bash .github/scripts/python_ci_ingestion_image.sh load "$RUNNER_TEMP/python-ci-ingestion.tar.zst"
        shell: bash
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          use-backend-image: 'true'
          args: "-m no-ui -s true"
          ingestion_dependency: "mysql,elasticsearch,sample-data"

      - name: Prepare Python environment
        uses: ./.github/actions/prepare-python-environment
        with:
          python-version: ${{ inputs.python-version }}
          profile: test

      - name: Build Ingestion Operator & Ingest Sample Data
        run: |
          docker build -f ingestion/operators/docker/Dockerfile.ci . -t openmetadata/ingestion-base:test
          docker run --net=host --rm openmetadata/ingestion-base:test metadata ingest -c ./pipelines/sample_data.yaml

      - name: Validate ingestion
        run: |
          source env/bin/activate
          python scripts/validate_sample_data.py --id-snapshot /tmp/ai-governance-sample-ids.json

      - name: Verify sample data is idempotent
        run: |
          docker run --net=host --rm openmetadata/ingestion-base:test metadata ingest -c ./pipelines/sample_data.yaml
          source env/bin/activate
          python scripts/validate_sample_data.py --id-snapshot /tmp/ai-governance-sample-ids.json

      - name: Collect failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/python-diagnostics
        with:
          artifact-name: py-operator-diagnostics-${{ inputs.python-version }}

      - name: Clean Up
        if: ${{ always() }}
        run: |
          cd ./docker/development
          docker compose down --remove-orphans
          sudo rm -rf "${PWD}/docker-volume"
