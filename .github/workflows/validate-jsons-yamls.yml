name: Validate JSON/YAML

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.json"
      - "**.yaml"
      - "**.yml"

permissions:
  contents: read

jobs:
  validate-json-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ubuntu related dependencies
        run: |
          sudo apt-get update  && sudo apt-get install -y libsasl2-dev unixodbc-dev python3-venv

      - name: Install Python & Openmetadata related dependencies
        run: |
          python3 -m venv env
          source env/bin/activate
          pip install pyyaml

      # Add back linting once we have 10/10 on main
      - name: Code style check
        id: style
        continue-on-error: true
        run: |
          source env/bin/activate
          pip install pyyaml
          ./scripts/validate_json_yaml.sh

      - name: JSON/Yaml validation failed
        if: steps.style.outcome != 'success'
        run: |
          echo "::error title=JSON/YAML validation failed::The Code style check step names the invalid file. Reproduce locally with ./scripts/validate_json_yaml.sh."
          exit 1
