name: Claude Security Review

# Claude-driven CODE (SAST) security review — injection, XSS, broken authz, SSRF,
# unsafe deserialization, path traversal, secrets and crypto misuse in first-party
# Java (openmetadata-service / -sdk / -mcp), TypeScript (openmetadata-ui) and Python
# (ingestion) code. It complements what already runs: CodeQL (codeql.yml, pattern
# SAST), Snyk/Retire.js (security-scan.yml, dependency CVEs) and Trivy (images).
# Rubric, sweep method and JSON output contract live in ./SECURITY-REVIEW.md.
#
#   1. Same-repo PR opened / ready → reviews the DIFF (inline + summary comments).
#   2. "@claude security-review"   → same, on demand, write-access only. Use this for
#                                    fork PRs, which get no secrets on `pull_request`.
#   3. Nightly / manual dispatch   → EXHAUSTIVE sweep, fanned out across slices.
#
# Why the nightly fans out: openmetadata-service alone is ~1,800 Java files, the UI
# ~2,700 and ingestion ~1,500. That does not fit one agent's context, and a single
# agent asked to scan it all silently samples — which is how a vulnerability gets
# missed. Each slice is scanned by its own agent that must report a `coverage` block;
# the report job renders any missing or partial slice as a VISIBLE GAP rather than
# letting an unscanned area read as clean. The slices partition every package in
# openmetadata-service exactly once.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      SEND_SLACK_NOTIFICATION:
        description: "Post results to Slack (uncheck for test runs)"
        type: boolean
        required: false
        default: true
      ONLY_SLICE:
        description: "Scan a single slice only (e.g. java-api). Blank = all slices."
        type: string
        required: false
        default: ""

env:
  # Override with a CLAUDE_REVIEW_MODEL repo/org variable without editing this file.
  CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5' }}
  SEND_SLACK_NOTIFICATION: ${{ github.event.inputs.SEND_SLACK_NOTIFICATION == '' && 'true' || github.event.inputs.SEND_SLACK_NOTIFICATION }}

concurrency:
  group: claude-security-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  # ---------------------------------------------------------------------------
  # Single source of truth for the nightly slice list. Both the sweep matrix and
  # the report job's coverage expectation read from here, so adding a slice can
  # never drift out of sync with the gap check — the failure mode that would make
  # an unscanned area invisible.
  # ---------------------------------------------------------------------------
  plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.set.outputs.slices }}
      names: ${{ steps.set.outputs.names }}
    steps:
      - name: Build slice matrix
        id: set
        env:
          ONLY: ${{ github.event.inputs.ONLY_SLICE }}
        run: |
          # These slices claim every package under openmetadata-service exactly once
          # (43 packages + the root classes), plus the sdk/mcp modules, the UI tree and
          # ingestion. If you add a package, add it to a slice — an unclaimed package
          # is an unscanned package.
          cat > slices.json <<'JSON'
          [
            {"slice": "java-api", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/resources openmetadata-service/src/main/java/org/openmetadata/service/socket openmetadata-service/src/main/java/org/openmetadata/service/scim openmetadata-service/src/main/java/org/openmetadata/service/swagger openmetadata-service/src/main/java/org/openmetadata/service/*.java"},
            {"slice": "java-security", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/security openmetadata-service/src/main/java/org/openmetadata/service/secrets openmetadata-service/src/main/java/org/openmetadata/service/auth openmetadata-service/src/main/java/org/openmetadata/service/fernet openmetadata-service/src/main/java/org/openmetadata/service/rules openmetadata-service/src/main/java/org/openmetadata/service/limits openmetadata-service/src/main/java/org/openmetadata/service/audit"},
            {"slice": "java-persistence", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/jdbi3 openmetadata-service/src/main/java/org/openmetadata/service/migration openmetadata-service/src/main/java/org/openmetadata/service/cache"},
            {"slice": "java-search", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/search openmetadata-service/src/main/java/org/openmetadata/service/rdf openmetadata-service/src/main/java/org/openmetadata/service/lineage"},
            {"slice": "java-apps", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/apps openmetadata-service/src/main/java/org/openmetadata/service/governance openmetadata-service/src/main/java/org/openmetadata/service/workflows openmetadata-service/src/main/java/org/openmetadata/service/jobs openmetadata-service/src/main/java/org/openmetadata/service/tasks openmetadata-service/src/main/java/org/openmetadata/service/dataInsight"},
            {"slice": "java-integrations", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/notifications openmetadata-service/src/main/java/org/openmetadata/service/events openmetadata-service/src/main/java/org/openmetadata/service/clients openmetadata-service/src/main/java/org/openmetadata/service/formatter openmetadata-service/src/main/java/org/openmetadata/service/llm openmetadata-service/src/main/java/org/openmetadata/service/aicontext openmetadata-service/src/main/java/org/openmetadata/service/openlineage openmetadata-service/src/main/java/org/openmetadata/service/attachments openmetadata-service/src/main/java/org/openmetadata/service/logstorage openmetadata-service/src/main/java/org/openmetadata/service/drive openmetadata-service/src/main/java/org/openmetadata/service/csv openmetadata-service/src/main/java/org/openmetadata/service/mapper"},
            {"slice": "java-platform", "ecosystem": "java",
             "paths": "openmetadata-service/src/main/java/org/openmetadata/service/util openmetadata-service/src/main/java/org/openmetadata/service/exception openmetadata-service/src/main/java/org/openmetadata/service/config openmetadata-service/src/main/java/org/openmetadata/service/monitoring openmetadata-service/src/main/java/org/openmetadata/service/context openmetadata-service/src/main/java/org/openmetadata/service/logging openmetadata-service/src/main/java/org/openmetadata/service/lock openmetadata-service/src/main/java/org/openmetadata/service/initialization"},
            {"slice": "java-sdk-mcp", "ecosystem": "java",
             "paths": "openmetadata-sdk/src/main/java openmetadata-mcp/src/main/java openmetadata-clients"},
            {"slice": "ui", "ecosystem": "ui",
             "paths": "openmetadata-ui/src/main/resources/ui/src"},
            {"slice": "python", "ecosystem": "python",
             "paths": "ingestion/src"}
          ]
          JSON
          if [ -n "$ONLY" ]; then
            jq -c --arg s "$ONLY" '[.[] | select(.slice == $s)]' slices.json > filtered.json
            if [ "$(jq 'length' filtered.json)" = "0" ]; then
              echo "::error::ONLY_SLICE='$ONLY' matched no slice. Valid: $(jq -r '[.[].slice]|join(", ")' slices.json)"
              exit 1
            fi
            mv filtered.json slices.json
          fi
          echo "slices=$(jq -c . slices.json)" >> "$GITHUB_OUTPUT"
          echo "names=$(jq -r '[.[].slice] | join(",")' slices.json)" >> "$GITHUB_OUTPUT"
          jq -r '"planned slice: " + .slice' slices.json

  # ---------------------------------------------------------------------------
  # PR mode — diff-scoped, single agent, posts inline + summary comments.
  # Fork PRs are excluded: `pull_request` passes no secrets from a fork, so the
  # token would be empty. Maintainers review those with an @claude comment.
  # ---------------------------------------------------------------------------
  pr-review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       startsWith(github.event.comment.body, '@claude security-review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      review_outcome: ${{ steps.review.outcome }}
    steps:
      - name: Resolve PR number
        id: pr
        run: echo "number=${{ github.event.pull_request.number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false
          fetch-depth: 1

      - name: Check out PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ steps.pr.outputs.number }}

      - name: Security review (PR diff)
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            Read ./SECURITY-REVIEW.md first and treat its contents as your
            highest-priority instructions.

            MODE: PULL REQUEST.

            Review this PR's diff (`gh pr diff`) for the vulnerability classes in that
            file, in first-party OpenMetadata code.

            Post each confirmed finding as an inline comment
            (mcp__github_inline_comment__create_inline_comment, confirmed: true), and
            ALWAYS post a `gh pr comment` summary opening with a severity tally — even
            when clean.

            Finally, write ./security-review-report.json using the exact schema in
            SECURITY-REVIEW.md, including a coverage block with scope "pr" and
            complete=true if you reviewed the whole diff. This is required and must be
            your last action.
          claude_args: |
            --model ${{ env.CLAUDE_REVIEW_MODEL }}
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(rg:*),Read,Grep,Glob,Write,Task,TodoWrite"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-security-report-pr
          path: security-review-report.json
          retention-days: 30
          if-no-files-found: warn

      # Deterministic proof the review ran, independent of whether the model decided
      # it had anything to say. Upserted on a marker so repeat runs update one comment.
      - name: Post review status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          OUTCOME: ${{ steps.review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$OUTCOME" in
            success) STATUS="finished the security review. Its own summary comment carries the verdict; if no summary was posted, treat this PR as **not reviewed** and check the run log." ;;
            *)       STATUS="**did not complete the security review** (\`$OUTCOME\`). Nothing here has been checked." ;;
          esac
          MARKER='<!-- claude-security-status -->'
          BODY=$(printf '%s\n🛡️ Claude %s\n\n<sub>[run log](%s) · `%s`</sub>' \
            "$MARKER" "$STATUS" "$RUN_URL" "$CLAUDE_REVIEW_MODEL")
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq "[.[] | select(.body | startswith(\"$MARKER\")) | .id] | first")
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi

      - name: Fail if the review did not complete
        if: always() && steps.review.outcome != 'success'
        run: |
          echo "::error::Claude security review did not complete (${{ steps.review.outcome }}). Nothing has been checked."
          exit 1

  # ---------------------------------------------------------------------------
  # Nightly mode — one agent per slice, exhaustive within its scope.
  # ---------------------------------------------------------------------------
  nightly-sweep:
    needs: [plan]
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false # one slice failing must not hide the others' findings
      # Concurrent agents share one subscription token; keep a few in flight so a
      # burst does not trip API rate limits and fail slices for a non-security reason.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.slices) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false
          fetch-depth: 1

      - name: Sweep ${{ matrix.slice }}
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: false
          prompt: |
            Read ./SECURITY-REVIEW.md first and treat its contents as your
            highest-priority instructions.

            MODE: NIGHTLY SWEEP.

            SCOPE: ${{ matrix.slice }}
            ECOSYSTEM: ${{ matrix.ecosystem }}
            PATHS (your entire assignment — everything here is yours, nothing outside it is):
            ${{ matrix.paths }}

            Follow the four-phase method in SECURITY-REVIEW.md exactly:
            1. rg your ENTIRE scope for every Phase 1 sink pattern for ${{ matrix.ecosystem }}.
               Grep first, before reading anything — that is what makes this exhaustive.
            2. Triage every hit. A hit you did not look at is a vulnerability you did not find.
            3. Read for what grep cannot see — a MISSING authorization check is an absence
               no pattern matches. If your scope has REST resources or auth code, open every
               handler and verify its authz.
            4. Report coverage honestly.

            Skip generated, vendored and test code: **/target/**, **/generated/**,
            **/node_modules/**, **/*.test.ts*, **/*.spec.ts*, **/jsons/**, **/locale/**.

            There is no PR to comment on. Your ONLY output is
            ./security-review-report.json, written to the exact schema in
            SECURITY-REVIEW.md with coverage.scope set to "${{ matrix.slice }}".
            If you could not finish the scope, set coverage.complete=false and name in
            coverage.notes exactly what you did not reach — a partial scope reported as
            complete is worse than no scan at all.
          claude_args: |
            --model ${{ env.CLAUDE_REVIEW_MODEL }}
            --max-turns 200
            --allowedTools "Bash(rg:*),Bash(git log:*),Bash(git diff:*),Read,Grep,Glob,Write,Task,TodoWrite"

      # A slice that produced no JSON is a coverage gap. Leave the file absent — the
      # report job renders it as a hard gap. Never synthesise an empty report here.
      - name: Upload ${{ matrix.slice }} report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-security-report-${{ matrix.slice }}
          path: security-review-report.json
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Consolidated report — merges every slice, renders the Job Summary, notifies
  # Slack. Runs for both modes.
  # ---------------------------------------------------------------------------
  report:
    needs: [plan, pr-review, nightly-sweep]
    if: always() && (needs.pr-review.result != 'skipped' || needs.nightly-sweep.result != 'skipped')
    runs-on: ubuntu-latest
    environment: security-scan
    steps:
      # Pinned to the default branch on purpose. This job holds the security-scan
      # environment's Slack credentials, and it executes scripts/*.py — checking out
      # the PR merge ref instead would let a PR edit that script and exfiltrate the
      # token. The renderer must always be the trusted, merged version.
      - name: Checkout (renderer only)
        uses: actions/checkout@v7
        with:
          show-progress: false
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Download all slice reports
        uses: actions/download-artifact@v7
        with:
          pattern: claude-security-report-*
          path: reports
        continue-on-error: true

      - name: Render consolidated report
        id: summary
        run: |
          python3 scripts/claude_security_summary.py reports \
            --expect "${{ needs.plan.outputs.names }}" \
            --counts-file _sec_counts.json \
            --slack-file _sec_slack.txt \
            >> "$GITHUB_STEP_SUMMARY"
          echo "high_critical=$(jq '.high + .critical' _sec_counts.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(jq '.total' _sec_counts.json)" >> "$GITHUB_OUTPUT"
          echo "incomplete=$(jq '.slices_incomplete' _sec_counts.json)" >> "$GITHUB_OUTPUT"

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-security-consolidated
          path: |
            _sec_counts.json
            _sec_slack.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Build Slack payload
        id: build
        # Nightly always reports (a silent night is indistinguishable from a broken
        # workflow). PR runs only speak up when there is something to say.
        if: >-
          env.SEND_SLACK_NOTIFICATION == 'true' &&
          (needs.nightly-sweep.result != 'skipped' ||
           steps.summary.outputs.total != '0' ||
           steps.summary.outputs.incomplete != '0')
        env:
          MODE: ${{ needs.nightly-sweep.result != 'skipped' && 'nightly' || 'pr' }}
          SWEEP_RESULT: ${{ needs.nightly-sweep.result }}
          PR_RESULT: ${{ needs.pr-review.result }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_IDS }}
        run: |
          python3 - <<'PY' > payload.json
          import json, os, pathlib

          def load(path, default):
              p = pathlib.Path(path)
              if not p.exists():
                  return default
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return default

          counts = load("_sec_counts.json", {})
          body_p = pathlib.Path("_sec_slack.txt")
          body = body_p.read_text().strip() if body_p.exists() else \
              "*🛡️ Claude Security Review (SAST)*\n> ⚠️ No report produced — see run log."

          mode = os.environ.get("MODE", "pr")
          result = os.environ.get("SWEEP_RESULT" if mode == "nightly" else "PR_RESULT", "")
          ref = os.environ.get("REF_NAME", "")
          run_url = os.environ.get("RUN_URL", "")
          channel = os.environ.get("SLACK_CHANNEL_ID", "")

          hi = counts.get("critical", 0) + counts.get("high", 0)
          total = counts.get("total", 0)
          incomplete = counts.get("slices_incomplete", 0)

          if hi > 0:
              icon = "🚨"
          elif incomplete or result not in ("success", ""):
              icon = "⚠️"
          elif total > 0:
              icon = "🟠"
          else:
              icon = "🟢"

          label = "nightly sweep" if mode == "nightly" else "PR review"
          header = (
              f"{icon}  *Claude Security Review (SAST)* — *OpenMetadata Repo* ({label})\n"
              f"_branch_ `{ref}`  ·  <{run_url}|Open run details>"
          )
          payload = {
              "channel": channel,
              "text": f"{icon} Claude Security Review — OpenMetadata {ref}. {run_url}",
              "blocks": [
                  {"type": "section", "text": {"type": "mrkdwn", "text": header}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": body}},
              ],
          }
          print(json.dumps(payload))
          PY

      - name: Send Slack
        if: steps.build.outcome == 'success'
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: payload.json

      # Coverage gaps fail the NIGHTLY: an unscanned slice must not pass as a green
      # sweep. Findings themselves do NOT fail — they need human triage. PR runs are
      # exempt: a single diff review has no slice list, and its failure is already
      # reported by the pr-review job.
      - name: Fail on coverage gaps
        if: >-
          always() && needs.nightly-sweep.result != 'skipped' &&
          steps.summary.outputs.incomplete != '' && steps.summary.outputs.incomplete != '0'
        run: |
          echo "::error::${{ steps.summary.outputs.incomplete }} slice(s) did not fully report — coverage is incomplete, see the Job Summary."
          exit 1

      # Optional hard gate on findings — off by default. LLM SAST findings warrant
      # human triage, so a finding does not block. Flip on for a strict gate.
      # - name: Fail on high/critical findings
      #   if: always() && steps.summary.outputs.high_critical != '0'
      #   run: exit 1
