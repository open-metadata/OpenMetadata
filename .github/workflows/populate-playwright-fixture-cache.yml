# Keep MAIN-scoped copies of the three EXPENSIVE Playwright cache assets: the
# OpenMetadata distribution, the golden fixture (seeded DB + OpenSearch + auth
# state), and the ingestion image.
#
# populate-playwright-apt-cache.yml already does this for apt, yarn and the
# browser bundle, and its header explains the two mechanics. They apply here
# with far more force, because these assets are the ones that cost real time:
#
#   SCOPING   A run restores caches from its own ref or the default branch,
#             nothing else. Merge-queue refs (gh-readonly-queue/main/pr-<n>-<sha>)
#             are unique per entry and deleted on dequeue, so a cache saved
#             there is readable by nobody. Nothing ran this pipeline on
#             refs/heads/main — its triggers are merge_group, pull_request,
#             pull_request_target and workflow_dispatch (the nightlies dispatch
#             against release branches) — so no main-scoped copy of these three
#             ever existed.
#   EVICTION  The repo budget is 10 GB, LRU. The unreachable queue-ref saves
#             were spending it anyway: 4 ingestion images at ~1.28 GB each with
#             the repo sitting at 11.3 GB, evicting the main-scoped apt/yarn/
#             browser copies the other workflow works to keep warm.
#
# Measured before this workflow existed: 13 consecutive merge-queue runs, 13
# golden-fixture misses, ~17 min of prepare-playwright-fixture every time —
# 31% of a 55 min suite, on the critical path of every entry in the queue.
#
# `warm_caches_only: true` runs the pipeline for its cache side effects and
# stops before the shards: the commit has already been tested by the queue
# entry that produced it, so re-running the suite on main proves nothing.
#
# COST: when the fingerprints are unchanged the run is nearly free — the
# distribution and fixture both restore, prepare-playwright-fixture short-
# circuits and nothing is rebuilt. Only a main commit that actually changes a
# fixture or distribution input pays the full build-and-seed.
#
# DATABASE: postgresql only, matching the PR/merge-queue pipeline this warms
# for. Note the three cache keys do NOT encode the database flavour while the
# fixture itself is a postgres dump — safe today because the mysql nightly is
# workflow_dispatch-only against release branches and so never writes main's
# scope, but the keys should grow a flavour segment before that changes.
name: Populate Playwright fixture caches

on:
  push:
    branches:
      - main
  # No `paths:` filter. The fixture fingerprint spans bootstrap/sql,
  # openmetadata-spec, the service resources, the sample-data seeds, the docker
  # compose files and more (see FIXTURE_PREFIXES in
  # .github/scripts/playwright_cache_fingerprint.py); duplicating that list
  # here would rot, and a warm this workflow skips costs every queue entry
  # ~17 min. Unchanged inputs make the run cheap instead.
  schedule:
    # Re-save after an LRU eviction or a runner-image roll.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # One warm at a time across push/schedule/dispatch, newest wins — a burst of
  # merges to main should leave one run warming the newest tree, not a queue of
  # runs each warming a tree that is already stale.
  group: populate-playwright-fixture-cache
  cancel-in-progress: true

jobs:
  warm:
    uses: ./.github/workflows/playwright-e2e-reusable.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    with:
      database: postgresql
      profile: postgresql-warm
      # Reuse the PR pipeline's timing artifacts; the shard planner still runs
      # (prepare-playwright-fixture needs its requires_airflow output) even
      # though no shard is dispatched.
      workflow_filename: playwright-postgresql-e2e.yml
      warm_caches_only: true
      # Must match what the merge queue restores, or the fingerprints differ
      # and the warm populates keys nobody reads.
      full_suite: true
      protocol: http
      coarse_bundle: true
