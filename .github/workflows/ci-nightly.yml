name: ci-nightly
on:
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch:
    inputs:
      connectors:
        description: CLI E2E connectors as a JSON array (subset of the default list)
        type: string
        default: '["bigquery", "dbt_redshift", "metabase", "mssql", "mysql", "redash", "snowflake", "tableau", "redshift", "quicksight", "datalake_s3", "postgres", "oracle", "athena", "bigquery_multiple_project", "exasol", "powerbi"]'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select Python workloads
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      python: ${{ steps.plan.outputs.python }}
      static: ${{ steps.plan.outputs.static }}
      versions: ${{ steps.plan.outputs.versions }}
      static-version: ${{ steps.plan.outputs.static-version }}
      latest-version: ${{ steps.plan.outputs.latest-version }}
      connectors: ${{ steps.plan.outputs.connectors }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          filter: blob:none
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: .github/python-ci/paths.yml
      - name: Select Python workloads
        id: plan
        env:
          PYTHON_CHANGED: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'true' || steps.filter.outputs.python }}
          STATIC_CHANGED: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'true' || steps.filter.outputs.static }}
          CONNECTORS: ${{ inputs.connectors }}
        run: |
          python3 scripts/python_ci.py plan --flow nightly \
            --python-changed "$PYTHON_CHANGED" --static-changed "$STATIC_CHANGED" \
            --connectors "$CONNECTORS" --output "$GITHUB_OUTPUT"
  py-checkstyle:
    name: py-checkstyle
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - if: ${{ needs.plan.outputs.static == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Run static checks
        if: ${{ needs.plan.outputs.static == 'true' }}
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.static-version }}
      - name: Report skipped work
        if: ${{ needs.plan.outputs.static == 'false' }}
        run: echo "No relevant Python changes; static checks skipped." >> "$GITHUB_STEP_SUMMARY"
  models:
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-classification-models
  backend:
    name: Build Backend Distribution
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/python-backend
  unit:
    needs:
      - plan
      - models
    if: ${{ needs.plan.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.versions) }}
    uses: ./.github/workflows/py-unit.yml
    with:
      python-version: ${{ matrix.python }}
      ref: ${{ needs.plan.outputs.ref }}
      collect-coverage: true
      run-e2e-meta: ${{ matrix.python == needs.plan.outputs.latest-version }}
  integration:
    needs:
      - plan
      - models
      - backend
    if: ${{ needs.plan.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.versions) }}
    uses: ./.github/workflows/py-integration.yml
    with:
      python-version: ${{ matrix.python }}
      ref: ${{ needs.plan.outputs.ref }}
      collect-coverage: true
  cli-e2e:
    needs:
      - plan
      - models
      - backend
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/py-cli-e2e-tests.yml
    secrets: inherit
    with:
      python-version: ${{ needs.plan.outputs.latest-version }}
      ref: ${{ needs.plan.outputs.ref }}
      connectors: ${{ needs.plan.outputs.connectors }}
  py-tests-status:
    name: py-tests-status
    needs:
      - plan
      - py-checkstyle
      - models
      - backend
      - unit
      - integration
      - cli-e2e
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify selected Python workloads
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/python_ci.py verify --flow nightly
  sonar-cloud-coverage-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - plan
      - unit
      - integration
      - cli-e2e
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "failure"]'), needs.unit.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Collect Python reports
        uses: ./.github/actions/python-coverage
        with:
          python-version: ${{ needs.plan.outputs.latest-version }}
      - name: Push Results to Sonar
        id: push-to-sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.INGESTION_SONAR_SECRET }}
        with:
          projectBaseDir: ingestion/
      - name: Wait to retry Sonar upload
        if: ${{ !cancelled() && steps.push-to-sonar.outcome == 'failure' }}
        run: sleep 20s
        shell: bash
      - name: Retry Sonar upload
        if: ${{ !cancelled() && steps.push-to-sonar.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.INGESTION_SONAR_SECRET }}
        with:
          projectBaseDir: ingestion/
  notify:
    needs:
      - plan
      - py-checkstyle
      - models
      - backend
      - unit
      - integration
      - cli-e2e
      - py-tests-status
      - sonar-cloud-coverage-upload
    if: ${{ always() && !cancelled() && (needs.py-tests-status.result == 'failure' || needs.sonar-cloud-coverage-upload.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Slack on nightly failure
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C03EYBDDX17",
              "text": "<!subteam^S0AH093PEQL> Python CI nightly failed on `${{ github.ref_name }}`.\nSelection: ${{ needs.plan.result }}; static: ${{ needs.py-checkstyle.result }}; models: ${{ needs.models.result }}; backend: ${{ needs.backend.result }}; units: ${{ needs.unit.result }}; integrations: ${{ needs.integration.result }}; CLI E2E: ${{ needs.cli-e2e.result }}; Sonar: ${{ needs.sonar-cloud-coverage-upload.result }}.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
