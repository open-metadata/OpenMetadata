name: ci-nightly
on:
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch:
    inputs:
      workload:
        description: Nightly workloads to run
        type: choice
        options: [all, java, python, connectors]
        default: all
      connectors:
        description: CLI E2E connectors as a JSON array (subset of the default list)
        type: string
        default: &default-connectors '["bigquery", "dbt_redshift", "metabase", "mssql", "mysql", "redash", "snowflake", "tableau", "redshift", "quicksight", "datalake_s3", "postgres", "oracle", "athena", "bigquery_multiple_project", "exasol", "powerbi"]'
permissions:
  contents: read
  packages: read
env:
  DEFAULT_CONNECTORS: *default-connectors
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.workload }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select Python workloads
    if: ${{ inputs.workload != 'java' }}
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.versions.outputs.versions }}
      python-lowest: ${{ steps.versions.outputs.lowest }}
      python-highest: ${{ steps.versions.outputs.highest }}
      ref: ${{ github.sha }}
      connectors: ${{ steps.connectors.outputs.connectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ingestion/pyproject.toml
            scripts/python_ci.py
            scripts/prepare_classification_models.py
          sparse-checkout-cone-mode: false
      - name: Read Python versions
        id: versions
        run: python3 scripts/python_ci.py versions --output "$GITHUB_OUTPUT"
      - name: Select connectors
        id: connectors
        env:
          SELECTED_CONNECTORS: ${{ inputs.connectors }}
        run: python3 scripts/python_ci.py connectors --output "$GITHUB_OUTPUT"

  backend:
    name: Build backend image
    needs: plan
    uses: ./.github/workflows/reusable-build-backend.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  ingestion-image:
    needs: plan
    uses: ./.github/workflows/reusable-build-ingestion.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  py-static-checks:
    name: py-static-checks
    needs: plan
    if: &run-full-python ${{ inputs.workload != 'java' && inputs.workload != 'connectors' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Python static checks
        uses: ./.github/actions/python-static-checks
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
          check-types: 'true'

  prepare-classification-models:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/prepare_classification_models.py
            ingestion/pyproject.toml
            .github/actions/prepare-classification-models
            .github/actions/prepare-classification-model
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/prepare-classification-models

  python-unit:
    needs:
      - plan
      - prepare-classification-models
    if: *run-full-python
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.python-versions) }}
    name: Unit Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Python unit tests
        uses: ./.github/actions/python-unit
        with:
          python-version: ${{ matrix.python }}
          collect-coverage: ${{ github.ref == 'refs/heads/main' && matrix.python == needs.plan.outputs.python-lowest }}
          run-tooling-tests: ${{ matrix.python == needs.plan.outputs.python-highest }}

  python-integration:
    needs:
      - plan
      - prepare-classification-models
      - backend
    if: *run-full-python
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.python-versions) }}
    uses: ./.github/workflows/reusable-py-integration.yml
    with:
      python-version: ${{ matrix.python }}
      ref: ${{ needs.plan.outputs.ref }}
      source-database-version: oldest
      collect-coverage: ${{ github.ref == 'refs/heads/main' && matrix.python == needs.plan.outputs.python-lowest }}

  python-cli-e2e:
    needs:
      - plan
      - prepare-classification-models
      - backend
      - ingestion-image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-py-cli-e2e-tests.yml
    secrets: inherit
    with:
      python-version: ${{ needs.plan.outputs.python-highest }}
      ref: ${{ needs.plan.outputs.ref }}
      connectors: ${{ needs.plan.outputs.connectors }}
      collect-coverage: ${{ github.ref == 'refs/heads/main' && inputs.workload != 'connectors' }}

  python-operator:
    needs: [plan, backend, ingestion-image]
    if: *run-full-python
    uses: ./.github/workflows/reusable-py-operator-build-test.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      python-version: ${{ needs.plan.outputs.python-highest }}

  airflow-apis:
    needs: [plan, backend]
    if: *run-full-python
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run Airflow API tests
        uses: ./.github/actions/python-airflow-apis
        with:
          python-version: ${{ needs.plan.outputs.python-lowest }}
          use-backend-image: 'true'
          collect-coverage: ${{ github.ref == 'refs/heads/main' }}

  sonar-cloud-coverage-upload:
    needs:
      - plan
      - airflow-apis
      - python-unit
      - python-integration
      - python-cli-e2e
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
          (needs.airflow-apis.result == 'success' || contains(fromJSON('["success", "failure"]'), needs.python-unit.result)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          # Sonar uses history for blame and new-code analysis.
          fetch-depth: 0
      - name: Publish Python Sonar analysis
        uses: ./.github/actions/python-sonar
        with:
          python-version: ${{ needs.plan.outputs.python-highest }}
          python-versions: ${{ needs.plan.outputs.python-versions }}
          ingestion-token: ${{ secrets.INGESTION_SONAR_SECRET }}
          airflow-apis-token: ${{ secrets.AIRFLOW_APIS_SONAR_TOKEN }}
          publish-ingestion: ${{ contains(fromJSON('["success", "failure"]'), needs.python-unit.result) }}
          publish-airflow-apis: ${{ needs.airflow-apis.result == 'success' }}

  integration-test-build:
    name: Build Integration Test Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'schedule' || inputs.workload == 'all' || inputs.workload == 'java' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the Java integration test runtime
        uses: ./.github/actions/java-integration-build

  it-mysql-elasticsearch:
    needs: integration-test-build
    permissions:
      contents: read
      checks: write
      packages: read
    uses: ./.github/workflows/reusable-java-integration-lanes.yml
    with:
      profile_label: mysql-elasticsearch
      maven_profile: mysql-elasticsearch
      artifact_name: java-it-build-${{ github.run_id }}
      lanes_json: '["parallel","global-state","multi-node","retry-queue","rdf"]'
      store_database_version: oldest

  # The merge queue runs these two only when Java paths change, and pushes to
  # main do not run them, so the nightly is their daily run on main.
  it-postgres-opensearch:
    needs: integration-test-build
    permissions:
      contents: read
      checks: write
      packages: read
    uses: ./.github/workflows/reusable-java-integration-lanes.yml
    with:
      profile_label: postgres-opensearch
      maven_profile: postgres-opensearch
      artifact_name: java-it-build-${{ github.run_id }}
      lanes_json: '["parallel","global-state","multi-node","retry-queue","rdf"]'

  it-postgres-elasticsearch-redis:
    needs: integration-test-build
    permissions:
      contents: read
      checks: write
      packages: read
    uses: ./.github/workflows/reusable-java-integration-lanes.yml
    with:
      profile_label: postgres-elasticsearch-redis
      maven_profile: cache-tests
      artifact_name: java-it-build-${{ github.run_id }}
      lanes_json: '["parallel","global-state","multi-node","retry-queue"]'

  maven-sonarcloud-ci:
    name: Maven SonarCloud CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.workload == 'all' || inputs.workload == 'java') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Publish Java Sonar analysis
        uses: ./.github/actions/java-sonar
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  nightly-status:
    name: Nightly status
    needs:
      - plan
      - backend
      - ingestion-image
      - prepare-classification-models
      - py-static-checks
      - python-unit
      - python-integration
      - python-cli-e2e
      - python-operator
      - airflow-apis
      - sonar-cloud-coverage-upload
      - integration-test-build
      - it-mysql-elasticsearch
      - it-postgres-opensearch
      - it-postgres-elasticsearch-redis
      - maven-sonarcloud-ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/nightly_summary.py
          sparse-checkout-cone-mode: false
      - name: Summarize nightly results
        id: summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKLOAD: ${{ inputs.workload || 'all' }}
        run: python3 .github/scripts/nightly_summary.py
      # nightly_summary.py routes each failure to the team that owns the failed job.
      - name: Notify ingestion on-duty of nightly failures
        if: ${{ steps.summary.outputs.slack_ingestion != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          errors: true
          payload-file-path: ${{ steps.summary.outputs.slack_ingestion }}
      - name: Notify Platform on-duty of nightly failures
        if: ${{ steps.summary.outputs.slack_platform != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          errors: true
          payload-file-path: ${{ steps.summary.outputs.slack_platform }}
      - name: Fail if a selected workload did not succeed
        if: ${{ steps.summary.outputs.failed == 'true' }}
        run: exit 1
