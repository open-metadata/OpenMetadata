name: reusable-py-integration
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: true
      ref:
        description: Git commit SHA to test; must match the shared backend image
        type: string
        required: true
      source-database-version:
        description: Connector source database version to test, newest or oldest
        type: string
        required: true
      collect-coverage:
        description: Collect and upload coverage from MySQL shards
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  py-integration-tests:
    name: Integration Tests (${{ matrix.database.name }}, ${{ matrix.shard.name }}, ${{ inputs.python-version }})
    timeout-minutes: 180
    env:
      PYTHON_VERSIONS: ${{ inputs.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: mysql
            compose-args: -m no-ui -s true -i false
            test-profile: python-integration
          - name: postgres
            compose-args: -m no-ui -d postgresql -s true -i false
            test-profile: python-postgresql-integration
        # Keep shard-3 ignores paired with the explicit paths in shards 1 and 2.
        shard:
          - name: shard-1
            nox-args: tests/integration/automations tests/integration/data_quality tests/integration/mysql tests/integration/postgres tests/integration/powerbi tests/integration/sas tests/integration/superset
          - name: shard-2
            needs-disk: true
            nox-args: tests/integration/alationsink tests/integration/auto_classification tests/integration/datalake tests/integration/profiler tests/integration/sources tests/integration/sql_server tests/integration/ssrs
          - name: shard-3
            nox-args: --ignore=tests/integration/automations --ignore=tests/integration/data_quality --ignore=tests/integration/mysql --ignore=tests/integration/postgres --ignore=tests/integration/powerbi --ignore=tests/integration/sas --ignore=tests/integration/superset --ignore=tests/integration/alationsink --ignore=tests/integration/auto_classification --ignore=tests/integration/datalake --ignore=tests/integration/profiler --ignore=tests/integration/sources --ignore=tests/integration/sql_server --ignore=tests/integration/ssrs
    steps:
      # TODO: Measure shard 1/3 disk usage before limiting this cleanup to shard 2.
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use runner data disk for Docker
        if: matrix.shard.needs-disk
        run: bash .github/scripts/configure_docker_storage.sh
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          use-backend-image: 'true'
          args: ${{ matrix.database.compose-args }}
      - name: Prepare Python environment
        uses: ./.github/actions/prepare-python-environment
        with:
          python-version: ${{ inputs.python-version }}
          profile: test-classification
      - name: Reclaim unused disk for the Exasol shard
        if: matrix.shard.needs-disk
        continue-on-error: true
        run: |
          {
            echo "Before Exasol shard disk reclaim"
            df -h
            docker system df
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            docker image prune --all --force || true
            docker builder prune --all --force || true
            echo "After Exasol shard disk reclaim"
            df -h
            docker system df
          } 2>&1 | tee "${RUNNER_TEMP}/exasol-disk-reclaim.log"
        shell: bash
      - name: Run integration tests
        id: tests
        uses: ./.github/actions/python-suite
        env:
          SOURCE_DATABASE_VERSION: ${{ inputs.source-database-version }}
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        with:
          suite: integration
          nox-args: --standalone --durations=5 ${{ matrix.shard.nox-args }}
          collect-coverage: ${{ inputs.collect-coverage && matrix.database.name == 'mysql' }}
          coverage-name: coverage-integration-${{ inputs.python-version }}-${{ matrix.database.name }}-${{ matrix.shard.name }}
      - name: Report test results
        if: ${{ always() }}
        uses: ./.github/actions/report-test-results
        with:
          step-outcome: ${{ steps.tests.outcome }}
          exit-code-file: ingestion/integration-test-exit-code.txt
          test-profile: ${{ matrix.database.test-profile }}
          artifact-name: py-${{ matrix.database.name }}-integration-test-results-${{ matrix.shard.name }}-${{ inputs.python-version }}
      - name: Collect failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/python-diagnostics
        with:
          artifact-name: py-${{ matrix.database.name }}-integration-diagnostics-${{ matrix.shard.name }}-${{ inputs.python-version }}
