name: reusable-py-unit
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: true
      ref:
        description: Git commit SHA to check out and test
        type: string
        required: true
      collect-coverage:
        description: Collect and upload unit coverage for nightly Sonar
        type: boolean
        required: false
        default: false
      prepare-models:
        description: Prepare classification models on this runner instead of consuming the shared artifact
        type: boolean
        required: false
        default: false
      run-meta-tests:
        description: Run CI helper and offline E2E framework tests in the selected nightly lane
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  py-unit-tests:
    name: Unit Tests (${{ inputs.python-version }})
    timeout-minutes: 60
    env:
      PYTHON_VERSIONS: ${{ inputs.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare Python environment
        uses: ./.github/actions/prepare-python-environment
        with:
          python-version: ${{ inputs.python-version }}
          profile: test-classification
          prepare-models: ${{ inputs.prepare-models }}
      - name: Test CI helpers
        if: ${{ inputs.run-meta-tests }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: env/bin/python -m pytest -q --noconftest .github/scripts/tests/test_python_ci.py .github/scripts/test_classify_test_outcome.py
        shell: bash
      - name: Run offline E2E framework tests
        if: ${{ inputs.run-meta-tests }}
        run: |
          source env/bin/activate
          cd ingestion
          env -u OM_JWT_TOKEN OM_SERVER_URL=http://127.0.0.1:1/api \
            python -m pytest tests/cli_e2e_v2/meta -q
        shell: bash
      - name: Run unit tests
        id: tests
        uses: ./.github/actions/python-suite
        with:
          suite: unit
          collect-coverage: ${{ inputs.collect-coverage }}
          coverage-name: coverage-unit-${{ inputs.python-version }}
      - name: Report test results
        if: ${{ always() }}
        uses: ./.github/actions/report-test-results
        with:
          step-outcome: ${{ steps.tests.outcome }}
          exit-code-file: ingestion/unit-test-exit-code.txt
          test-profile: python-unit
          artifact-name: py-unit-test-results-${{ inputs.python-version }}
