# Keep the check name for branch protection. Maps are derived per checkout;
# validation must never push a generated file onto a contributor's branch.
name: Playwright impact-map drift

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'openmetadata-ui/src/main/resources/ui/playwright/e2e/**/*.spec.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/**/*.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/**/*.tsx'
      - '.github/playwright/impact-map.json'
      - '.github/scripts/generate_playwright_impact_map.py'
      - '.github/scripts/select_playwright_tests.py'
      - '.github/scripts/plan_local_playwright.py'
      - '.github/scripts/tests/test_playwright_impact_map.py'
      - '.github/scripts/tests/test_playwright_ci_planning.py'
      - '.github/workflows/playwright-impact-map-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-impact-map-drift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  impact-map-drift:
    name: Playwright impact-map drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate generation and selection
        run: |
          python3 .github/scripts/generate_playwright_impact_map.py \
            --output "$RUNNER_TEMP/impact-map.generated.json"
          python3 .github/scripts/select_playwright_tests.py \
            --event-name pull_request \
            --impact-map .github/playwright/impact-map.json \
            --generated-impact-map "$RUNNER_TEMP/impact-map.generated.json" \
            --output "$RUNNER_TEMP/selection.json"

      - name: Test impact-map generation and routing
        run: |
          python3 -m pip install pytest
          python3 -m pytest \
            .github/scripts/tests/test_playwright_impact_map.py -q
          python3 -m pytest \
            .github/scripts/tests/test_playwright_ci_planning.py \
            -k 'impact_map or generator' -q
