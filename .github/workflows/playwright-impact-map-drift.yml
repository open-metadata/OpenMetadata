# Guardrail for `.github/playwright/impact-map.generated.json`.
#
# The Playwright PR planner reads this file alongside the hand-authored
# `impact-map.json` to route "if source X changes, run these specs". The
# generated half is a deterministic function of the current tree (spec
# imports + testId cross-reference), so drift means the committed file
# no longer matches what the generator would produce — usually because
# a spec, a shared helper, or a `data-testid` string changed and the
# author did not regenerate.
#
# Same-repository PRs regenerate and report drift without writing to the branch.
# Forks retain the planner's unmapped-code fallback to the full suite.
# The merge queue does not regenerate this map because its refs are read-only.

name: Playwright impact-map drift

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'openmetadata-ui/src/main/resources/ui/playwright/e2e/**/*.spec.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/**/*.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/**/*.tsx'
      - '.github/scripts/generate_playwright_impact_map.py'
      - '.github/playwright/impact-map.generated.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to refresh the impact map for (optional)'
        required: false
        type: string

concurrency:
  group: playwright-impact-map-drift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  impact-map-drift:
    name: Playwright impact-map drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Get PR details for workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
        id: pr-details
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view "$PR_NUMBER" --json headRepository,headRefName,headRepositoryOwner,headRefOid --repo "$BASE_REPO")
          echo "head_ref=$(echo "$PR_DATA" | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "head_sha=$(echo "$PR_DATA" | jq -r '.headRefOid')" >> $GITHUB_OUTPUT
          echo "full_repo=$(echo "$PR_DATA" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')" >> $GITHUB_OUTPUT

      - name: Classify fork vs same-repo
        id: check-fork
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REPO: ${{ steps.pr-details.outputs.full_repo }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ] && [ -n "$FULL_REPO" ]; then
            if [ "$FULL_REPO" != "$BASE_REPO" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            # Dependabot runs get no secrets either, so they are handled like a fork.
            if [ "$HEAD_REPO_FULL_NAME" != "$BASE_REPO" ] || [ "$ACTOR" == "dependabot[bot]" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      # Fork PRs are a no-op past this point — see the header docstring
      # for the rationale. The step below records the reason in the log so
      # a reviewer looking at the run can see why nothing else fired.
      - name: Skip on fork PRs
        if: steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "Fork PR detected — impact-map drift is a no-op on forks."
          echo "The 'unmapped code → full' fallback in select_playwright_tests still"
          echo "runs the specs a stale map would have routed to (see PR #32809)."

      - name: Determine checkout ref
        if: steps.check-fork.outputs.is_fork != 'true'
        id: checkout-ref
        env:
          IS_FORK: ${{ steps.check-fork.outputs.is_fork }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_DETAILS_HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
          PR_DETAILS_HEAD_REF: ${{ steps.pr-details.outputs.head_ref }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          if [ "$IS_FORK" == "true" ] && [ "$EVENT_NAME" == "pull_request" ]; then
            echo "ref=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "ref=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ "$IS_FORK" == "true" ] && [ -n "$PR_DETAILS_HEAD_SHA" ]; then
            echo "ref=$PR_DETAILS_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ -n "$PR_DETAILS_HEAD_REF" ]; then
            echo "ref=$PR_DETAILS_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "ref=$GITHUB_SHA_VAL" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-fork.outputs.is_fork != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr-details.outputs.full_repo || github.repository }}
          ref: ${{ steps.checkout-ref.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Python
        if: steps.check-fork.outputs.is_fork != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate impact map
        if: steps.check-fork.outputs.is_fork != 'true'
        run: python3 .github/scripts/generate_playwright_impact_map.py

      - name: Check for drift
        id: git-check
        if: steps.check-fork.outputs.is_fork != 'true'
        continue-on-error: true
        run: |
          git add .github/playwright/impact-map.generated.json
          git diff --cached --quiet

      - name: Summarise the diff
        id: summarise
        # `git-check` is skipped on forks, and a skipped step's outcome is
        # 'skipped' (!= 'success'), so without the fork guard this ran `git show`
        # in a workspace that was never checked out and failed the job.
        if: steps.check-fork.outputs.is_fork != 'true' && steps.git-check.outcome != 'success'
        run: |
          # Cap the summary at what fits comfortably in a PR comment. The full
          # file is a single JSON line — a raw diff would be unreadable — so
          # count the affected entries semantically instead.
          python3 - <<'PY' > "$RUNNER_TEMP/summary.txt"
          import json, subprocess, os
          path = ".github/playwright/impact-map.generated.json"
          # HEAD is the committed version; working tree is the regenerated one.
          old = json.loads(subprocess.check_output(["git", "show", f"HEAD:{path}"]))
          new = json.loads(open(path).read())
          old_by_src = {s: set(e["specs"]) for e in old["mappings"] for s in e["sources"]}
          new_by_src = {s: set(e["specs"]) for e in new["mappings"] for s in e["sources"]}
          added   = sorted(new_by_src.keys() - old_by_src.keys())
          removed = sorted(old_by_src.keys() - new_by_src.keys())
          changed = sorted(
              s for s in old_by_src.keys() & new_by_src.keys()
              if old_by_src[s] != new_by_src[s]
          )
          print(f"- source entries: {len(old_by_src)} → {len(new_by_src)}")
          print(f"- {len(added)} added, {len(removed)} removed, {len(changed)} changed spec-list")
          def sample(rows, label, max_lines=10):
              if not rows:
                  return
              print(f"\n{label}:")
              for r in rows[:max_lines]:
                  print(f"  {r}")
              if len(rows) > max_lines:
                  print(f"  … and {len(rows) - max_lines} more")
          sample(added, "New source→spec entries")
          sample(removed, "Removed source→spec entries")
          sample(changed, "Entries whose spec list changed")
          PY
          {
            echo 'summary<<SUMMARY_EOF'
            cat "$RUNNER_TEMP/summary.txt"
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report impact-map drift
        if: steps.check-fork.outputs.is_fork != 'true' && steps.git-check.outcome != 'success'
        env:
          DRIFT_SUMMARY: ${{ steps.summarise.outputs.summary }}
        run: |
          echo "$DRIFT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Run `python3 .github/scripts/generate_playwright_impact_map.py` and commit the refreshed map.
          EOF
          echo "::error::Playwright impact map is stale. Regenerate it locally and commit the result."
          exit 1
