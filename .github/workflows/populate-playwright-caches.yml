# Keep MAIN-scoped copies of every cache the Playwright pipeline restores.
#
# Why this workflow exists — two GitHub Actions cache mechanics compound:
#
# 1. SCOPING: a workflow run can only restore caches created on its own ref
#    or on the default branch. Merge-queue refs (gh-readonly-queue/main/...)
#    and PR merge refs are unique per entry and die after the run — caches
#    saved there are unreachable by every other run. Only main-scoped copies
#    are universally restorable.
# 2. EVICTION: the repo cache budget is 10 GB, LRU-evicted. When ephemeral
#    refs are allowed to SAVE caches, per-queue-entry duplicates (~700 MB
#    yarn + ~250 MB browser each) blow the budget within the hour and evict
#    the main-scoped copies — observed at 17.5 GB with 49/50 caches on
#    ephemeral refs, the main apt cache evicted ~30 minutes after creation.
#    That eviction turns every downstream "cache hit" into a cold fetch
#    against apt mirrors / registry.yarnpkg.com / the Playwright CDN, and a
#    bad day on any of those takes the whole matrix down (runs 32157314266,
#    32166970973, 32209207109, 32222855561, 32233411840).
#    Re-observed 2026-09-04 for the expensive tier: 11.34 GB active against the
#    10 GB budget, 5.1 GB of it four ~1.28 GB ingestion images stranded on dead
#    merge-queue refs. prune-ephemeral-caches.yml now collects those; the saves
#    that created them are gated off merge_group in the reusable.
#
# The fix has two halves: playwright-e2e-reusable.yml uses RESTORE-ONLY
# cache steps (no saves from ephemeral refs), and THIS workflow is the one
# writer — it saves from main's scope so every downstream run gets a hit.
#
# It covers TWO tiers, in two independent jobs:
#
#   populate     apt, yarn, browser. Cheap, no build, single runner.
#   warm-fixture the OpenMetadata distribution, the golden fixture (seeded DB +
#                OpenSearch + auth state) and the ingestion image. These are
#                what actually cost time: 13 consecutive merge-queue runs
#                measured on 2026-09-04 missed the golden fixture 13 times and
#                rebuilt it for ~17 min each — 31% of a 55 min suite, on the
#                critical path of every entry in the queue. Warming them needs
#                the real build-and-seed pipeline, so this job CALLS
#                playwright-e2e-reusable.yml with `warm_caches_only: true`,
#                which runs it for its cache side effects and stops before the
#                shards. The commit was already tested by the queue entry that
#                produced it; re-running the suite on main proves nothing.
#
# Keeping both tiers here is deliberate. A second warmer workflow would be a
# second writer, which is exactly the drift the one-writer rule above prevents:
# add a cache to the pipeline and you have one place to teach about it.
#
# STRUCTURE: each cache is warmed INDEPENDENTLY. The apt populate runs
# first (most critical, no node/yarn dependency); the yarn and browser
# warmers are continue-on-error so a registry or CDN outage on one cannot
# block refreshing the others; each save is explicitly gated on its warmer
# succeeding so a failed warm can never bake a partial cache under an
# exact key (actions/cache never overwrites an existing key, so a partial
# save would be permanent for that lockfile). A final step fails the job
# if any warmer failed — full signal, but only after every cache had its
# chance.
#
# Triggers:
#   * schedule (6h)      — keeps last_accessed fresh and re-saves after any
#                          eviction or runner-image roll.
#   * workflow_dispatch  — populate immediately (first run / mid-incident).
#   * push to main       — repopulate the new keys right away instead of
#                          waiting ≤6 h.
#
# The push trigger carries NO `paths:` filter. It once listed the reusable
# workflow, this file and yarn.lock, which covers the apt/yarn/browser keys —
# but the fixture and distribution fingerprints span bootstrap/sql,
# openmetadata-spec, the service resources, the sample-data seeds and the
# compose files (see FIXTURE_PREFIXES / DISTRIBUTION_PREFIXES in
# .github/scripts/playwright_cache_fingerprint.py). Restating those lists here
# would rot, and a warm that gets skipped costs every queue entry ~17 min.
# Unchanged fingerprints make the run cheap instead — every cache restores,
# nothing rebuilds — so running on each main push is the safe default.
#
# IMPORTANT: the cache keys and the apt package list below MUST stay
# identical to their counterparts in playwright-e2e-reusable.yml — a drifted
# key populates a cache nobody restores. Update both files together.
name: Playwright main lane and CI cache warm

on:
  # TWO DEPTHS, ONE WRITER.
  #
  # `push` keeps its original job: warm the caches for the next queue entry,
  # cheaply, on every commit to main. Unchanged (see the trigger note below).
  #
  # `schedule` now runs the shards as well — the MAIN LANE. Nothing has run
  # the Playwright suite against `main` since #31628 removed
  # `cron: "30 7 * * *"` from playwright-postgresql-e2e.yml on 2026-08-18, so
  # the suite has existed only on PRs (a targeted subset) and in the merge
  # queue (`main` + up to three PRs). Neither answers "is main green?", and
  # that missing answer is why a merge_group failure cannot be attributed:
  # this PR, the combination, and "main was already broken" are
  # indistinguishable without a main-only baseline.
  #
  # It lives HERE rather than in a new workflow because
  # test_no_cache_is_saved_from_an_ephemeral_merge_queue_ref enforces a
  # one-main-scoped-writer rule, and a second caller on the same event and ref
  # would also collide with the reusable's own concurrency group
  # (`playwright-ci-<database>-<event>-<ref>`) and cancel this one.
  #
  # Every two hours, not hourly: the suite's p50 is ~58 min, so an hourly
  # cadence would have runs cancelling each other and finishing nothing. 12
  # completed runs a day is ample for a 10-run baseline window.
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Concurrency is per-JOB, not workflow-level: the two tiers want opposite
# cancel policies and must not serialise behind each other.

jobs:
  populate:
    # Cheap and quick; let an in-flight warm finish rather than restart it.
    concurrency:
      group: populate-playwright-caches-apt
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # FIRST and independent: the apt cache is the one whose absence takes
      # down whole matrices on Ubuntu-mirror incidents, so nothing may run
      # before it. continue-on-error so a mirror outage during populate
      # still lets the yarn/browser warmers below run.
      - name: Populate Playwright system deps cache
        id: warm-apt
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: >-
            fonts-ipafont-gothic fonts-freefont-ttf fonts-tlwg-loma-otf
            fonts-unifont fonts-wqy-zenhei xfonts-encodings xfonts-utils
            xfonts-cyrillic xfonts-scalable
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64
            libatspi2.0-0t64 libcairo2 libcups2t64 libgbm1 libglib2.0-0t64
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          version: playwright-chromium-deps-v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: openmetadata-ui/src/main/resources/ui/.nvmrc

      - name: Restore yarn package cache
        id: yarn-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/yarn
          key: yarn-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}
          restore-keys: |
            yarn-pkg-cache-${{ runner.os }}-

      - name: Warm yarn cache
        id: warm-yarn
        continue-on-error: true
        working-directory: openmetadata-ui/src/main/resources/ui
        run: |
          corepack enable
          for attempt in 1 2 3; do
            yarn --ignore-scripts --frozen-lockfile --network-timeout 100000 && break
            if [[ "$attempt" -eq 3 ]]; then
              echo "yarn install failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::yarn install attempt $attempt failed (registry blip?); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

      # Save is gated on the warmer SUCCEEDING — a failed install must never
      # bake a partial ~/.cache/yarn under the exact lockfile key, because
      # actions/cache cannot overwrite an existing key and the partial copy
      # would be permanent for this lockfile.
      - name: Save yarn package cache (main-scoped writer)
        if: steps.warm-yarn.outcome == 'success' && steps.yarn-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/yarn
          key: yarn-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}

      - name: Restore Playwright browser cache
        id: browser-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}

      # Needs node_modules from the yarn warmer (npx resolves the pinned
      # @playwright/test from the local install) — skipped if that failed.
      - name: Warm Chromium browser cache
        id: warm-browser
        if: steps.warm-yarn.outcome == 'success'
        continue-on-error: true
        working-directory: openmetadata-ui/src/main/resources/ui
        run: npx playwright install chromium

      - name: Save Playwright browser cache (main-scoped writer)
        if: steps.warm-browser.outcome == 'success' && steps.browser-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}

      # Every warmer ran (or was skipped by a failed dependency); NOW fail
      # the job if anything went wrong so the schedule/dispatch surface a
      # clear signal without ever blocking a sibling cache's refresh.
      - name: Report warm failures
        env:
          APT_OUTCOME: ${{ steps.warm-apt.outcome }}
          YARN_OUTCOME: ${{ steps.warm-yarn.outcome }}
          BROWSER_OUTCOME: ${{ steps.warm-browser.outcome }}
        run: |
          echo "apt=$APT_OUTCOME yarn=$YARN_OUTCOME browser=$BROWSER_OUTCOME"
          failed=""
          [[ "$APT_OUTCOME" == "failure" ]] && failed="$failed apt"
          [[ "$YARN_OUTCOME" == "failure" ]] && failed="$failed yarn"
          [[ "$BROWSER_OUTCOME" == "failure" || "$BROWSER_OUTCOME" == "skipped" ]] && failed="$failed browser"
          if [[ -n "$failed" ]]; then
            echo "::error::cache warmers failed:$failed — downstream runs stay on the previous main-scoped copies (or the resilient miss path) until the next populate"
            exit 1
          fi

  # The expensive tier. Independent of `populate` above: an apt-mirror outage
  # must not stop the fixture refreshing, and a build failure here must not
  # stop the apt/yarn/browser copies being kept warm.
  #
  # COST: when the fingerprints are unchanged this is nearly free — the
  # distribution and fixture both restore and prepare-playwright-fixture
  # short-circuits. Only a main commit that actually changes a fixture or
  # distribution input pays the full build-and-seed.
  #
  # DATABASE: postgresql only, matching the PR/merge-queue pipeline this warms
  # for. Note the three cache keys do NOT encode the database flavour while the
  # fixture itself is a postgres dump — safe today because the mysql nightly is
  # workflow_dispatch-only against release branches and so never writes main's
  # scope, but the keys should grow a flavour segment before that changes.
  warm-fixture:
    # Newest wins WITHIN a depth: a burst of merges to main should leave one
    # run warming the newest tree, not a queue of runs each warming a tree
    # already stale. The two depths never cancel each other, though — a
    # push-warm landing mid-lane must not kill a 58-minute lane run, and a
    # lane run must not hold up the warm the next queue entry is waiting on.
    concurrency:
      group: populate-playwright-caches-fixture-${{ github.event_name == 'push' && 'warm' || 'lane' }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/playwright-e2e-reusable.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    with:
      database: postgresql
      profile: postgresql-warm
      # Reuse the PR pipeline's timing artifacts; the shard planner still runs
      # (prepare-playwright-fixture needs its requires_airflow output) even
      # though no shard is dispatched.
      workflow_filename: playwright-postgresql-e2e.yml
      # push  -> warm only, exactly as before: seed the caches for the next
      #          queue entry and stop before the shards.
      # else  -> the main lane: run the full plan against main itself.
      warm_caches_only: ${{ github.event_name == 'push' }}
      # Must match what the merge queue restores, or the fingerprints differ
      # and the warm populates keys nobody reads.
      full_suite: true
      protocol: http
      coarse_bundle: true

  # THE POINT OF THE LANE. Turns a finished main-lane run into two things the
  # merge queue has never had:
  #
  #   1. A ledger — did `main` itself pass, and which tests did not pass on
  #      their FIRST attempt. `retries: 1` reports a first-attempt failure as
  #      green, which is how two regressions landed on 2026-09-01 survived
  #      three days; the ledger records the first attempt regardless.
  #   2. A baseline — the tests `main` does not reliably pass, so a later gate
  #      can block on "this PR broke it" and stay quiet on "main was already
  #      broken". That is the difference the merge queue cannot currently see.
  #
  # It REPORTS, it does not block: a `schedule` run gates no pull request and
  # nothing here is a required status check.
  main-health:
    name: Main health ledger
    needs: [warm-fixture]
    # Lane runs only. A push warm stops before the shards, so there are no
    # results to classify.
    if: >-
      always() &&
      github.event_name != 'push' &&
      needs.warm-fixture.outputs.playwright_ci_result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      # Bump the version segment to invalidate every stored baseline at once,
      # e.g. after a schema change in refresh_flake_baseline.py.
      BASELINE_PREFIX: playwright-flake-baseline-v1-postgresql-main
      BASELINE_PATH: ${{ github.workspace }}/flake-baseline/flake-baseline.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all results JSON
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-results-json-*
          path: results
          # Keep the per-artifact subdirectory layout
          # (results/playwright-results-json-<shardId>/results.json);
          # classify_playwright_outcome.py infers the shard id from it.
          merge-multiple: false

      - name: Restore the flake baseline
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BASELINE_PATH }}
          # Cache keys are immutable, so each run writes a new key and reads
          # the most recent one back through the prefix. Scoped to
          # refs/heads/main — the one scope merge_group and PR runs can
          # restore from (#32605). NOT a committed file: refresh-timing-
          # baseline documents why main commits have to stay rare, and every
          # push to main resets the merge queue.
          key: ${{ env.BASELINE_PREFIX }}-${{ github.run_id }}
          restore-keys: ${{ env.BASELINE_PREFIX }}-

      - name: Classify the run
        id: classify
        continue-on-error: true
        env:
          EXPECTED_MATRIX: ${{ needs.warm-fixture.outputs.plan_playwright_matrix }}
          MATRIX_OUTCOME: ${{ needs.warm-fixture.outputs.playwright_ci_result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A missing baseline is the first-run state, not an error: without
          # --retry-baseline the ledger still reports every retry pass, it
          # just cannot say which of them are new.
          baseline_args=()
          if [[ -f "$BASELINE_PATH" ]]; then
            baseline_args=(--retry-baseline "$BASELINE_PATH")
          fi
          python3 .github/scripts/classify_playwright_outcome.py \
            --report-glob 'results/playwright-results-json-*/results.json' \
            --status-glob 'results/playwright-results-json-*/ci-status.json' \
            --matrix-outcome "$MATRIX_OUTCOME" \
            --expected-matrix-json "$EXPECTED_MATRIX" \
            --profile postgresql-main \
            --source-sha "$SOURCE_SHA" \
            ${baseline_args[@]+"${baseline_args[@]}"} \
            --output "$RUNNER_TEMP/main-lane/outcome.json"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ledger = json.load(open(os.environ["RUNNER_TEMP"] + "/main-lane/outcome.json"))
          print(f"classification={ledger['classification']}")
          PY

      - name: Refresh the flake baseline
        id: refresh-baseline
        if: ${{ steps.classify.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$BASELINE_PATH")"
          current=()
          if [[ -f "$BASELINE_PATH" ]]; then
            cp "$BASELINE_PATH" "$RUNNER_TEMP/previous-baseline.json"
            current=(--current "$RUNNER_TEMP/previous-baseline.json")
          fi

          python3 .github/scripts/refresh_flake_baseline.py \
            --ledger "$RUNNER_TEMP/main-lane/outcome.json" \
            ${current[@]+"${current[@]}"} \
            --output "$BASELINE_PATH" \
            --window 10 \
            --threshold 2 \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --summary "$RUNNER_TEMP/baseline-summary.md"
          rc=$?

          # 3 = this run measured nothing (cancelled, no results). Keep the
          # stored baseline rather than decaying real entries out of the
          # window on the strength of a run that never observed anything.
          if [[ "$rc" -eq 3 ]]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi

          echo "save=true" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/baseline-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the flake baseline
        if: ${{ steps.refresh-baseline.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BASELINE_PATH }}
          key: ${{ env.BASELINE_PREFIX }}-${{ github.run_id }}

      - name: Publish the ledger to the job summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          [[ -f "$RUNNER_TEMP/main-lane/outcome.json" ]] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          ledger = json.load(open(os.environ["RUNNER_TEMP"] + "/main-lane/outcome.json"))
          counts = ledger["counts"]
          print("### Playwright main lane")
          print()
          print(f"- Classification: `{ledger['classification']}`")
          print(
              f"- Tests: {counts['tests']} · failed {counts['failed']} ·"
              f" passed only on retry {counts['retryPassed']} ·"
              f" skipped {counts['skipped']}"
          )
          for issue in ledger["infrastructureIssues"][:10]:
              print(f"- :warning: {issue}")
          for record in ledger["failures"][:20]:
              print(f"- FAILED `{record['file']}` > {record['title']}")
          for record in ledger["retryPasses"][:20]:
              print(f"- FIRST ATTEMPT FAILED `{record['file']}` > {record['title']}")
          PY

      - name: Upload the main-lane ledger
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-main-lane-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/main-lane/outcome.json
            ${{ env.BASELINE_PATH }}
          if-no-files-found: warn
          retention-days: 30

      # Split routing so a broken main and a flake read differently:
      #   loud  → #ci-cleanup  (test_failure / hung_test / infrastructure_failure /
      #                         missing_results — main is an incident with an owner)
      #   quiet → #pw-health   (passed_with_retries / cancelled — awareness only;
      #                         `retries: 1` has been reporting these as green)
      - name: Route the Slack payload
        id: slack-route
        if: ${{ always() && steps.classify.outputs.classification != '' && steps.classify.outputs.classification != 'passed' }}
        continue-on-error: true
        env:
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        run: |
          set -euo pipefail
          case "$CLASSIFICATION" in
            test_failure|hung_test|infrastructure_failure|missing_results)
              echo "channel=C0AC5T013V1" >> "$GITHUB_OUTPUT"   # #ci-cleanup
              echo "severity=loud" >> "$GITHUB_OUTPUT"
              ;;
            passed_with_retries|cancelled)
              echo "channel=C0C008ZAK0V" >> "$GITHUB_OUTPUT"   # #pw-health
              echo "severity=quiet" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "channel=" >> "$GITHUB_OUTPUT"
              echo "severity=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build the Slack payload
        id: slack-payload
        if: ${{ always() && steps.slack-route.outputs.channel != '' }}
        continue-on-error: true
        env:
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          CHANNEL: ${{ steps.slack-route.outputs.channel }}
          SEVERITY: ${{ steps.slack-route.outputs.severity }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > slack.json
          import json, os
          ledger = json.load(open(os.environ["RUNNER_TEMP"] + "/main-lane/outcome.json"))
          counts = ledger["counts"]
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          severity = os.environ["SEVERITY"]
          emoji, header = (
              (":red_circle:", "*main lane*")
              if severity == "loud"
              else (":large_yellow_circle:", "*main lane (flake awareness)*")
          )
          # Slack mrkdwn has no []() links; it uses <url|text>.
          lines = [
              f"{emoji} {header} — `{os.environ['CLASSIFICATION']}`"
              f" at <{os.environ['COMMIT_URL']}|{sha}>",
              f"{counts['failed']} failed and {counts['retryPassed']} passed only on"
              f" retry, of {counts['tests']} tests.",
          ]
          lines += [f"• `{r['file']}` › {r['title']}" for r in ledger["failures"][:10]]
          lines += [
              f"• (first attempt) `{r['file']}` › {r['title']}"
              for r in ledger["retryPasses"][:10]
          ]
          lines.append(f"<{os.environ['RUN_URL']}|run>")
          json.dump({"channel": os.environ["CHANNEL"], "text": "\n".join(lines)}, open("slack.json", "w"))
          PY

      - name: Post to Slack
        if: ${{ always() && steps.slack-payload.outcome == 'success' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          # Keep on — the action discards Slack API errors by default.
          errors: true
          payload-file-path: slack.json
