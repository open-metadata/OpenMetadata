name: Java Checkstyle

on:
  merge_group:
  # Trigger analysis when pushing in master or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - main
      - "0.[0-9]+.[0-9]+"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "openmetadata-ui/src/main/resources/ui/playwright/docs/**"

permissions:
  contents: read

concurrency:
  group: java-checkstyle-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  java-checkstyle:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      FAILURE_HELP: |
        **The Java checkstyle failed.**

        Please run `mvn spotless:apply` in the root of your repository and commit the changes to this PR.
        You can also use [pre-commit](https://pre-commit.com/) to automate the Java code formatting.

        You can install the pre-commit hooks with `make install_test precommit_install`.

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
            tool-cache: false
            android: true
            dotnet: true
            haskell: true
            large-packages: false
            swap-storage: true
            docker-images: false
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run checkstyle
        run: mvn spotless:apply

      - name: Save checkstyle outcome
        id: git
        continue-on-error: true
        run: |
          git diff-files --quiet

      # Fork and Dependabot PRs get a read-only token, so only other same-repo PRs get the comment;
      # everyone gets the job summary and the error annotation from the next step.
      - name: Create a comment in the PR with the instructions
        if: ${{ steps.git.outcome != 'success' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.FAILURE_HELP }}

      - name: Java checkstyle failed
        if: steps.git.outcome != 'success'
        run: |
          {
            echo "$FAILURE_HELP"
            echo
            echo "Files \`mvn spotless:apply\` reformatted:"
            echo
            git diff --name-only | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Java checkstyle failed::Run 'mvn spotless:apply' in the repository root and commit the changes. The job summary lists the files."
          exit 1
