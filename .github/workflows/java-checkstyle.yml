name: Java Checkstyle

on:
  merge_group:
  # Trigger analysis when pushing in master or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - main
      - "0.[0-9]+.[0-9]+"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "openmetadata-ui/src/main/resources/ui/playwright/docs/**"

permissions:
  contents: read

concurrency:
  group: java-checkstyle-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  java-checkstyle:
    runs-on: ubuntu-latest
    env:
      FAILURE_HELP: |
        **The Java checkstyle failed.**

        Please run `mvn spotless:apply` in the root of your repository and commit the changes to this PR.
        You can also use [pre-commit](https://pre-commit.com/) to automate the Java code formatting.

        You can install the pre-commit hooks with `make install_test precommit_install`.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      # Restore-only: spotless and google-java-format come from the ~/.m2 the
      # unit-test jobs save on main. This job never saves, so PR runs add no
      # PR-scoped copy to the shared cache budget.
      - name: Restore Maven dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run checkstyle
        run: mvn spotless:apply

      - name: Save checkstyle outcome
        id: git
        continue-on-error: true
        run: |
          git diff-files --quiet

      - name: Java checkstyle failed
        if: steps.git.outcome != 'success'
        run: |
          {
            echo "$FAILURE_HELP"
            echo
            echo "Files \`mvn spotless:apply\` reformatted:"
            echo
            git diff --name-only | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Java checkstyle failed::Run 'mvn spotless:apply' in the repository root and commit the changes. The job summary lists the files."
          exit 1
