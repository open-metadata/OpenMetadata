name: Maven Collate Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "openmetadata-service/**"
      - "openmetadata-ui/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/docs/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-dist/**"
      - "openmetadata-clients/**"
      - "openmetadata-sdk/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"
      - "common/**"
      - "pom.xml"
      - "yarn.lock"
      - "Makefile"
      - "bootstrap/**"
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "openmetadata-service/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"

permissions:
  contents: read

concurrency:
  group: maven-build-collate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  maven-collate-ci:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get no COLLATE_PAT, so they skip the Collate build.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    steps:
      - name: Trigger Collate build & wait
        uses: the-actions-org/workflow-dispatch@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha }}
          # Collate's openmetadata-dispatch.yml recognises a PR run by the event name
          # 'pull_request_target' (it skips the Collate integration tests for it), so a
          # pull_request run keeps reporting itself under that name.
          EVENT: ${{ github.event_name == 'pull_request' && 'pull_request_target' || github.event_name }}
        with:
          workflow: OpenMetadata Collate Test
          ref: main
          repo: open-metadata/openmetadata-collate
          token: ${{ secrets.COLLATE_PAT }}
          wait-for-completion: true
          inputs: '{ "sha": "${{ env.SHA }}", "event": "${{ env.EVENT }}" }'
