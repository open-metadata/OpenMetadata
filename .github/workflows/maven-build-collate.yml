name: Maven Collate Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "openmetadata-service/**"
      - "openmetadata-ui/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/docs/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-dist/**"
      - "openmetadata-clients/**"
      - "openmetadata-sdk/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"
      - "common/**"
      - "pom.xml"
      - "yarn.lock"
      - "Makefile"
      - "bootstrap/**"
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "openmetadata-service/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"

permissions:
  contents: read

concurrency:
  group: maven-build-collate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  maven-collate-ci:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get no COLLATE_PAT, so they skip the Collate build.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    steps:
      # Collate mirrors each OpenMetadata release line on an identically named branch, so build the
      # Collate branch matching the PR or merge-queue base: dispatching main for a 1.13 PR builds
      # main-only Collate code against a 1.13 checkout. A push or a manual run builds its own ref.
      - name: Resolve the Collate branch
        id: collate-ref
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name || 'main' }}
        run: echo "ref=${BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
      # Dispatched by file name straight to the REST endpoint, not through
      # the-actions-org/workflow-dispatch: that action looks the workflow up by name on the first
      # page of Collate's workflow list only, 30 of its 71 workflows served in one of two orders
      # at random, so the lookup can miss it with "Unable to find workflow".
      - name: Trigger Collate build & wait
        # Must stay above WAIT_SECONDS below. The step timeout kills the script outright, so when
        # it is the smaller of the two the wait can never run out on its own and the step
        # reports a bare "has timed out" with no downstream conclusion.
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ secrets.COLLATE_PAT }}
          COLLATE_REPO: open-metadata/openmetadata-collate
          COLLATE_REF: ${{ steps.collate-ref.outputs.ref }}
          SHA: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha || github.sha }}
          # Collate recognises a PR run by the event name 'pull_request_target' (its main branch
          # skips the Collate integration tests for it), so a pull_request run keeps reporting
          # itself under that name.
          EVENT: ${{ github.event_name == 'pull_request' && 'pull_request_target' || github.event_name }}
          # The Collate job caps itself at timeout-minutes: 90, so waiting past that point is
          # what guarantees we report its real conclusion instead of giving up first.
          WAIT_SECONDS: 5700
        run: |
          run_id=$(gh api -X POST "repos/$COLLATE_REPO/actions/workflows/openmetadata-dispatch.yml/dispatches" \
            -f ref="$COLLATE_REF" -f "inputs[sha]=$SHA" -f "inputs[event]=$EVENT" \
            -F return_run_details=true --jq .workflow_run_id)
          if [ -z "$run_id" ]; then
            echo "::error::The dispatch returned no run id; find the run at https://github.com/$COLLATE_REPO/actions/workflows/openmetadata-dispatch.yml"
            exit 1
          fi
          run_url="https://github.com/$COLLATE_REPO/actions/runs/$run_id"
          echo "Collate run: $run_url"
          status=0
          timeout "$WAIT_SECONDS" gh run watch "$run_id" --repo "$COLLATE_REPO" \
            --interval 60 --compact --exit-status || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Collate run still in progress after ${WAIT_SECONDS}s: $run_url"
          elif [ "$status" -ne 0 ]; then
            echo "::error::Collate run did not succeed: $run_url"
          fi
          exit "$status"
