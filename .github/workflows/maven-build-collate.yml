name: Maven Collate Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "openmetadata-service/**"
      - "openmetadata-ui/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/doc-generator/**"
      - "!openmetadata-ui/src/main/resources/ui/playwright/docs/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-dist/**"
      - "openmetadata-clients/**"
      - "openmetadata-sdk/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"
      - "common/**"
      - "pom.xml"
      - "yarn.lock"
      - "Makefile"
      - "bootstrap/**"
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]
    paths:
      - "openmetadata-service/**"
      - "openmetadata-ui/src/main/resources/ui/src/**"
      - "!openmetadata-ui/src/main/resources/ui/src/test/**"
      - "!openmetadata-ui/src/main/resources/ui/src/**/*.test.ts"
      - "!openmetadata-ui/src/main/resources/ui/src/**/*.test.tsx"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-mcp/**"

permissions:
  contents: read
  checks: write

concurrency:
  group: maven-build-collate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name != github.repository) }}
jobs:
  maven-collate-ci:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test') }}
    steps:
      - name: Wait for the labeler
        uses: lewagon/wait-on-check-action@v1.9.1
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Team Label
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 90

      - name: Verify PR labels
        uses: jesusvasquez333/verify-pr-label-action@v1.4.0
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          valid-labels: "safe to test"
          pull-request-number: "${{ github.event.pull_request.number }}"
          disable-reviews: true # To not auto approve changes

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Trigger Collate build
        id: dispatch
        uses: benc-uk/workflow-dispatch@v1.3.2
        env:
          SHA: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha || github.sha }}
        with:
          workflow: OpenMetadata Collate Test
          # Collate mirrors each OpenMetadata release line on an identically
          # named branch, so build the Collate branch matching the PR base.
          # Dispatching main for a 1.13 PR builds main-only Collate code
          # against a 1.13 checkout. Falls through to the pushed/dispatched ref
          # when there is no pull request in the payload.
          ref: ${{ github.event.pull_request.base.ref || github.ref_name || 'main' }}
          repo: open-metadata/openmetadata-collate
          token: ${{ secrets.COLLATE_PAT }}
          wait-for-completion: false
          # `pr` lets Collate's own concurrency cancel the run for this PR's previous push, as a
          # backstop for the cancel step below. Every Collate branch this dispatches to must
          # declare `pr`, or GitHub rejects the dispatch.
          inputs: '{ "sha": "${{ env.SHA }}", "event": "${{ github.event_name }}", "pr": "${{ github.event.pull_request.number }}" }'

      - name: Wait for the Collate build
        # Above the Collate job's own timeout-minutes, so this reports the run's real conclusion.
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ secrets.COLLATE_PAT }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
        run: |
          echo "Collate run: ${{ steps.dispatch.outputs.runUrlHtml }}"
          run_api="repos/open-metadata/openmetadata-collate/actions/runs/$RUN_ID"
          # A failed poll yields "", so a transient API error just waits another interval.
          until [ "$(gh api "$run_api" --jq .status)" = completed ]; do sleep 60; done
          conclusion=$(gh api "$run_api" --jq .conclusion)
          echo "Collate run concluded: $conclusion"
          # Same verdict as the action's sync-status: only failure and cancelled fail the check.
          [ "$conclusion" != failure ] && [ "$conclusion" != cancelled ]

      - name: Cancel the Collate build
        # A new push cancels this job; without this the Collate run it started would keep a
        # shared Collate runner busy for a result nobody reads.
        if: ${{ cancelled() && steps.dispatch.outputs.runId }}
        env:
          GH_TOKEN: ${{ secrets.COLLATE_PAT }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
        run: gh run cancel "$RUN_ID" -R open-metadata/openmetadata-collate
