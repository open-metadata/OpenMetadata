# Jest in four shards, without coverage. Called by ci-pr.yml and
# ci-merge-queue.yml; coverage is collected nightly by ui-sonarcloud-nightly.yml.
name: UI Unit Tests

on:
  workflow_call: null

permissions:
  contents: read

env:
  UI_WORKING_DIRECTORY: openmetadata-ui/src/main/resources/ui

jobs:
  jest:
    name: jest (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "openmetadata-ui/src/main/resources/ui/.nvmrc"

      # populate-playwright-caches.yml populates this shared Yarn cache. Validation
      # must not evict main's fixtures with large copies on ephemeral queue refs.
      - name: Restore Yarn dependencies
        uses: actions/cache/restore@v6
        id: yarn-cache
        with:
          path: ~/.cache/yarn
          key: yarn-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}
          restore-keys: |
            yarn-pkg-cache-${{ runner.os }}-

      - name: Install Antlr4 CLI
        run: |
          sudo make install_antlr_cli
      - name: Install Yarn Packages
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: |
          # Retry transient registry failures (5xx on tarball fetches) —
          # yarn v1 does not retry HTTP errors on its own.
          for attempt in 1 2 3; do
            yarn install --network-timeout 100000 && break
            if [[ "$attempt" -eq 3 ]]; then
              echo "yarn install failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::yarn install attempt $attempt failed (registry blip?); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
      - name: Run SSO dev server tests
        if: matrix.shard == 1
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        run: node --test scripts/sso-dev-server.test.mjs
      - name: Run unit tests
        working-directory: ${{ env.UI_WORKING_DIRECTORY }}
        # jest.config.js keeps '50%' for laptops; on the 4-vCPU hosted runner
        # that is only 2 workers, so CI asks for all 4. --silent plus the
        # summary + github-actions reporters drop the ~1.8M log lines (console
        # noise + PASS lines); failures still surface as inline annotations.
        run: yarn jest --silent --reporters=summary --reporters=github-actions --maxWorkers=4 --shard=${{ matrix.shard }}/4
