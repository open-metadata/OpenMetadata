name: Python unit tests
'on':
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact revision to test
        type: string
        required: true
      python-versions:
        description: JSON array of Python versions
        type: string
        required: true
      coverage-python:
        description: Python version supplying coverage and control tests
        type: string
        required: true
permissions:
  contents: read
jobs:
  tests:
    name: Python unit tests (${{ matrix.py-version }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: ${{ matrix.py-version }}
          install-server: 'false'
      - name: Download spaCy model
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: spacy-en-model
          path: /tmp/spacy-model
      - name: Validate Python policy and CI helpers
        if: ${{ matrix.py-version == inputs.coverage-python }}
        run: |
          source env/bin/activate
          python .github/scripts/python_ci.py check-policy
          python -m pytest .github/scripts/tests/test_python_ci.py .github/scripts/tests/test_nox_cli.py -q
        shell: bash
      - name: Run offline E2E framework tests
        if: ${{ matrix.py-version == inputs.coverage-python }}
        run: |
          source env/bin/activate
          cd ingestion
          env -u OM_JWT_TOKEN OM_SERVER_URL=http://127.0.0.1:1/api \
            python -m pytest tests/cli_e2e_v2/meta -q
        shell: bash
      - name: Install and verify spaCy model
        run: |
          source env/bin/activate
          uv pip install --no-deps /tmp/spacy-model/*.whl
          python -c 'import spacy; spacy.load("en_core_web_md")'
        shell: bash
      - name: Run Unit Tests
        id: unit-tests
        run: |
          set -o pipefail
          source env/bin/activate
          cd ingestion
          set +e
          python -m nox --non-interactive --no-venv -s unit-tests 2>&1 | tee unit-test-run.log
          test_exit_code=${PIPESTATUS[0]}
          echo "$test_exit_code" > unit-test-exit-code.txt
          exit "$test_exit_code"
        shell: bash
      - name: Classify Python unit test outcome
        if: ${{ always() }}
        env:
          TEST_LANE: python-${{ matrix.py-version }}
          TEST_PROFILE: python-unit
          TEST_STEP_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: |
          test_exit_code=""
          if [[ -s ingestion/unit-test-exit-code.txt ]]; then
            read -r test_exit_code < ingestion/unit-test-exit-code.txt
          fi
          python3 .github/scripts/classify_test_outcome.py \
            --step-outcome "$TEST_STEP_OUTCOME" \
            --exit-code "$test_exit_code" \
            --report-glob 'ingestion/junit/test-results-*.xml' \
            --diagnostic-glob 'ingestion/*-test-run.log' \
            --diagnostic-glob 'ingestion/static-checks-run.log' \
            --output ingestion/ci-diagnostics/outcome.json
      - name: Upload test results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-unit-test-results-${{ matrix.py-version }}
          path: |
            ingestion/junit/
            ingestion/ci-diagnostics/outcome.json
            ingestion/*-test-run.log
            ingestion/static-checks-run.log
            ingestion/unit-test-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
      - name: Upload coverage artifact
        if: ${{ matrix.py-version == inputs.coverage-python && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-coverage-unit-${{ matrix.py-version }}
          path: ingestion/.coverage
          include-hidden-files: true
