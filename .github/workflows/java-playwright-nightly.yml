# Full run of the UI integration suite (*UIIT.java) — lives inside
# openmetadata-integration-tests under the `ui-it` Maven profile. Runs the
# external-mode matrix (ES + OS). Tracks EPIC #3731 / tickets #3767, #3792.
#
# The schedule trigger is intentionally disabled while the suite stabilises. Run it
# on demand via workflow_dispatch (pick the branch to test as the ref); it also runs
# automatically on any PR that touches search-indexing code (see the `changes` job's
# paths-filter), exercising this whole suite (both engines + search-it) against the PR head
# in embedded mode. Re-add `schedule: - cron: '0 2 * * *'` once green on main.
#
# Topology:
#   - changes: dorny/paths-filter deciding whether the search-indexing paths were touched;
#     everything below is skipped when they were not, so the required `java-ui-it` gate still
#     reports green on unrelated PRs.
#   - ui-it-nightly (x4): matrix over [opensearch, elasticsearch] x [shard 0, 1]. Each leg
#     builds the openmetadata-dist tarball and bakes openmetadata-server:jpw-snapshot itself
#     (BuildKit + shared GHA layer cache), then runs `mvn verify -P ui-it` with OM_TEST_IMAGE
#     pointing at that tag so ContainerizedServer skips its own build. There is deliberately no
#     upstream build-image job: it serialised ~17 min in front of every leg to save an image
#     round-trip through a 461 MB artifact.
#   - search-it-nightly (x3): server-global destructive search ITs (tests/search/*IT.java) via
#     `mvn verify -P search-it`, sharded across runners. They run on the embedded bootstrap
#     (testcontainers), not the baked image, so they need no image build at all.
#   - java-ui-it: the required status check. Aggregates the jobs above under `always()`.
#
# Both suites are serial *within* a runner — they mutate cluster-global search state — so the
# shard matrix plus ShardFilter (a ServiceLoader PostDiscoveryFilter keyed on
# -Djpw.shard.total/-Djpw.shard.index) is the only parallelism available. Shard counts live in
# `env` and MUST match the matrix list lengths.

name: JavaUIIT Integration Tests Running on PRs

on:
  workflow_dispatch:
    inputs:
      includeSsoBootstrap:
        description: 'Also run @Tag("sso-bootstrap") UIITs (slower; second OM lifecycle)'
        required: false
        type: boolean
        default: false
      simpleReindexTables:
        description: 'SimpleReindexTriggerUIIT table cohort size'
        required: false
        type: string
        default: '5000'
      simpleReindexTopics:
        description: 'SimpleReindexTriggerUIIT topic cohort size'
        required: false
        type: string
        default: '1500'
      simpleReindexDashboards:
        description: 'SimpleReindexTriggerUIIT dashboard cohort size'
        required: false
        type: string
        default: '1500'
      simpleReindexPipelines:
        description: 'SimpleReindexTriggerUIIT pipeline cohort size'
        required: false
        type: string
        default: '2000'
      searchAvailableTables:
        description: 'SearchAvailableDuringReindexUIIT table cohort size'
        required: false
        type: string
        default: '5000'
      reindexTimeoutMin:
        description: 'Per-run reindex completion/acceptance timeout (minutes) for ui-it & search-it'
        required: false
        type: string
        default: '60'
  # Auto-run on PRs that modify search-indexing code: the full suite runs against the PR head in
  # embedded mode (testcontainers), NOT the external cluster — so a change to the reindex app,
  # search clients, or index mappings is validated before merge without anyone remembering a label.
  # Uses `pull_request` (NOT pull_request_target) on purpose: fork PRs run WITHOUT secrets, so
  # untrusted code never executes with credentials; same-repo branch PRs (the common case here)
  # still get secrets and full check reporting.
  #
  # `java-ui-it` is a REQUIRED status check on main, so there is deliberately no `paths:` filter
  # here: a path-filtered workflow never reports on PRs that miss the filter, and the required
  # context would hang at "Expected — waiting for status" forever. Path selection lives in the
  # `changes` job below instead (dorny/paths-filter), which skips the expensive jobs while the
  # gate still reports green. `merge_group` is required for the same reason — without it the
  # merge queue waits out `check_response_timeout_minutes` and fails.
  pull_request:
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  # One run per PR (or per ref for dispatch/cron); a new push cancels the prior in-flight run.
  group: java-playwright-nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SERVER_IMAGE_TAG: openmetadata-server:jpw-snapshot
  # Must equal the length of the corresponding job's `shard:` matrix list — ShardFilter drops
  # every class hashing outside [0, total), so a mismatch silently skips tests. Kept here rather
  # than derived because a matrix list cannot reference `env`.
  UI_IT_SHARDS: 2
  SEARCH_IT_SHARDS: 3

jobs:
  # Path selection for the required `java-ui-it` check. The workflow itself has no `paths:`
  # filter (see the trigger comment); this job decides whether the 90-minute matrix actually
  # runs. Keep this filter list as the single source of truth for "search-indexing code".
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      search: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'true' || steps.filter.outputs.search }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        if: ${{ github.event_name == 'merge_group' }}
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            search:
              # --- Production search-indexing code (openmetadata-service) ---
              - 'openmetadata-service/src/main/java/org/openmetadata/service/search/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/apps/bundles/searchIndex/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/searchindex/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/search/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/testsupport/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/events/lifecycle/handlers/SearchIndexHandler.java'
              # --- Index mappings + loader (canonical source lives in the spec module) ---
              - 'openmetadata-spec/src/main/resources/elasticsearch/**'
              - 'openmetadata-spec/src/main/java/org/openmetadata/search/**'
              # --- The search ITs / UIITs, their test harness, and the Maven profiles that run them ---
              - 'openmetadata-integration-tests/src/test/java/org/openmetadata/it/tests/search/**'
              - 'openmetadata-integration-tests/src/test/java/org/openmetadata/it/search/**'
              - 'openmetadata-integration-tests/src/test/java/org/openmetadata/playwright/scenarios/search/**'
              - 'openmetadata-integration-tests/pom.xml'
              # --- This workflow itself ---
              - '.github/workflows/java-playwright-nightly.yml'

  ui-it-nightly:
    needs: changes
    if: ${{ needs.changes.outputs.search == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        searchEngine: [opensearch, elasticsearch]
        shard: [0, 1]
    steps:
      - name: Free Disk Space (Ubuntu)
        # android alone reclaims ~9 GB in seconds; the rest of this action's targets cost
        # minutes of apt/rm for space this job never needs (measured 308s in the old
        # build-image job, 72-99s here). Re-enable a target only with a "no space left"
        # failure to point at.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && github.ref || github.sha) }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Ubuntu dependencies
        # Java-only job: the unixodbc/librdkafka/sasl/ffi set exists for the Python ingestion
        # build and nothing here links against it. ANTLR is the real dependency — openmetadata-spec
        # generates parsers with it.
        run: sudo make install_antlr_cli

      - name: Add /etc/hosts entry for mock OIDC server
        # The SSO test infrastructure (MockOidcServer) needs `om-mock-idp` to resolve to
        # loopback on the host so the same URL works inside the Docker network and from
        # the host-side Playwright browser, keeping the issued tokens' `iss` claim
        # consistent across actors.
        run: echo "127.0.0.1 om-mock-idp" | sudo tee -a /etc/hosts

      - name: Build dependencies for integration-tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -DskipTests install -pl :openmetadata-integration-tests -am

      - name: Restore openmetadata-ui dist cache
        # Only the next step (openmetadata-dist -am) transitively builds UI.
        uses: ./.github/actions/cache-ui-dist

      - name: Build openmetadata-dist tarball
        # ContainerizedServer.buildLocalImageContainer needs
        # openmetadata-dist/target/openmetadata-*.tar.gz to bake the local image.
        # Dist is NOT a transitive dep of integration-tests, so the previous step
        # doesn't produce it — build it explicitly here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -DskipTests install -pl :openmetadata-dist -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build openmetadata-server image (with GHA layer cache)
        # Built per matrix leg rather than once in a upstream job. A separate build-image job
        # serialised ~17 min in front of every test job (build, save 461 MB, upload, download,
        # load) for an image each leg then used alone. Building it here overlaps that cost with
        # the leg's own setup and drops the artifact round-trip entirely; the shared GHA layer
        # scope means the legs are not paying for it from scratch.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/development/Dockerfile
          tags: ${{ env.SERVER_IMAGE_TAG }}
          load: true
          # Shared scope across matrix entries so the cache primed by this build
          # is reused by everything that runs this workflow on the same SHA (or
          # later runs whose Dockerfile + dist tarball haven't changed).
          cache-from: type=gha,scope=jpw-server-image
          # Never WRITE from a merge_group run. The queue's gh-readonly-queue/*
          # ref dies the moment its entry merges or is dequeued, but every
          # buildkit-blob-* entry saved there (mode=max exports each layer —
          # dozens per build, 0–380 MB each) stays charged against the repo's
          # 10 GB LRU budget until evicted. Measured 2026-09-09: one queue ref
          # alone held ~40 blobs and the repo sat at 18 GB, which evicted every
          # main-scoped Playwright cache (golden fixture, distribution,
          # ingestion image). Downstream, 231 of 235 merge_group Playwright runs
          # in 24h missed the fixture cache and rebuilt it from scratch (~17 min
          # each on the critical path). Reads stay unconditional so queue runs
          # still benefit from a PR- or dispatch-primed scope; only those two
          # events, which run on refs that outlive the run, may repopulate it.
          # Same rule the Playwright reusable applies to its own saves.
          # Only shard 0 writes: concurrent legs racing the same scope duplicate blobs.
          cache-to: ${{ (github.event_name != 'merge_group' && matrix.shard == 0 && matrix.searchEngine == 'opensearch') && 'type=gha,scope=jpw-server-image,mode=max' || '' }}

      - name: Install Playwright browsers
        run: |
          mvn -pl :openmetadata-integration-tests dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt -q
          java -cp "$(cat /tmp/cp.txt)" com.microsoft.playwright.CLI install --with-deps chromium

      - name: Free build artifacts
        run: |
          rm -rf openmetadata-service/target/lib openmetadata-service/target/classes
          rm -rf openmetadata-spec/target openmetadata-sdk/target common/target
          rm -rf openmetadata-shaded-deps/*/target
          df -h /

      - name: Run UI integration tests (${{ matrix.searchEngine }} shard ${{ matrix.shard }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OM_TEST_IMAGE makes ContainerizedServer skip its in-test `docker build`
          # and reuse the image built above. Cuts ~10-90s per launch.
          OM_TEST_IMAGE: ${{ env.SERVER_IMAGE_TAG }}
          # UiSessionExtension reads PW_VIDEO and records every test's BrowserContext
          # to target/playwright-videos when true. Kept off locally; on in CI for triage.
          PW_VIDEO: 'true'
        run: |
          # Embedded nightly recreates a fresh stack each run, so data never persists — these
          # small-footprint suites always create on the fly (jpw.data.mode=ingest). Static/ensure
          # reuse only pays off against a cluster you keep around between runs, which no workflow
          # here does; set OM_URL + OM_ADMIN_TOKEN to point the suites at one by hand.
          # Cohort sizes are set ONLY on workflow_dispatch. `github.event.inputs.*` is empty on
          # pull_request/merge_group, so the old unconditional `|| '5000'` fallback meant every PR
          # ingested the full nightly stress cohort (10k entities) instead of the 200/100/100/100
          # baked into each test — 20x the data, ~5 min per test, on a run that only needs the
          # regression signal. Leaving the props unset is what makes the in-test defaults apply.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STRESS_PROPS="-Djpw.simpleReindex.tables=${{ github.event.inputs.simpleReindexTables || '5000' }} \
              -Djpw.simpleReindex.topics=${{ github.event.inputs.simpleReindexTopics || '1500' }} \
              -Djpw.simpleReindex.dashboards=${{ github.event.inputs.simpleReindexDashboards || '1500' }} \
              -Djpw.simpleReindex.pipelines=${{ github.event.inputs.simpleReindexPipelines || '2000' }} \
              -Djpw.searchAvailable.tables=${{ github.event.inputs.searchAvailableTables || '5000' }}"
          else
            STRESS_PROPS=""
          fi
          STRESS_PROPS="$STRESS_PROPS -Djpw.data.mode=ingest \
            -Djpw.reindex.timeoutMin=${{ github.event.inputs.reindexTimeoutMin || '60' }}"
          # Opt-in for SSO bootstrap UIITs (second OM lifecycle); default off.
          if [ "${{ github.event.inputs.includeSsoBootstrap }}" = "true" ]; then
            SSO_PROPS="-Dui.it.excludedGroups="
          else
            SSO_PROPS=""
          fi
          # ShardFilter (PostDiscoveryFilter, ServiceLoader-registered) keeps only the classes
          # hashing to this shard. These suites are serial by construction — they mutate
          # cluster-global search state — so splitting across runners is the only parallelism
          # available to them.
          SHARD_PROPS="-Djpw.shard.total=${{ env.UI_IT_SHARDS }} -Djpw.shard.index=${{ matrix.shard }}"
          if [ "${{ matrix.searchEngine }}" = "elasticsearch" ]; then
            mvn verify -P ui-it -pl :openmetadata-integration-tests $STRESS_PROPS $SSO_PROPS $SHARD_PROPS \
              -DsearchType=elasticsearch \
              -DsearchImage=docker.elastic.co/elasticsearch/elasticsearch:9.3.0
          else
            mvn verify -P ui-it -pl :openmetadata-integration-tests $STRESS_PROPS $SSO_PROPS $SHARD_PROPS
          fi

      - name: Upload Playwright traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.searchEngine }}-s${{ matrix.shard }}-${{ github.run_id }}
          path: openmetadata-integration-tests/target/playwright-traces
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright videos
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos-${{ matrix.searchEngine }}-s${{ matrix.shard }}-${{ github.run_id }}
          path: openmetadata-integration-tests/target/playwright-videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Failsafe Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports-${{ matrix.searchEngine }}-s${{ matrix.shard }}-${{ github.run_id }}
          path: openmetadata-integration-tests/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Test Report
        id: report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: scacap/action-surefire-report@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # mvn verify already fails the job on test failures. This step just
          # publishes the check run with per-test details; it shouldn't itself
          # gate the job conclusion (otherwise a flake here breaks Slack).
          fail_on_test_failures: false
          report_paths: 'openmetadata-integration-tests/target/failsafe-reports/TEST-*.xml'

      # Failures only: a green nightly is the expected case and notifying on it trains
      # the channel to ignore the alert.
      - name: Slack notification
        if: ${{ failure() && github.event_name != 'pull_request' && env.SLACK_JAVA_PLAYWRIGHT_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_JAVA_PLAYWRIGHT_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":fire: Java Playwright Nightly (${{ matrix.searchEngine }}): ${{ job.status }}\nRef: ${{ github.ref_name }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_JAVA_PLAYWRIGHT_URL: ${{ secrets.SLACK_JAVA_PLAYWRIGHT_URL }}

  search-it-nightly:
    # Server-global destructive search ITs (tests/search/*IT.java): full reindex with
    # recreateIndex, alias swaps, and ES container pause. They mutate cluster-wide state, so
    # the default PR profiles exclude them; here the `search-it` Maven profile runs them
    # serially on their own embedded-bootstrap server (testcontainers). That bootstrap needs no
    # server image, which is why this job skips the dist + docker build the ui-it legs pay for.
    needs: changes
    if: ${{ needs.changes.outputs.search == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Free Disk Space (Ubuntu)
        # See the ui-it job: android is the only target worth its runtime here.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && github.ref || github.sha) }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Ubuntu dependencies
        # Java-only job — see the ui-it job for why the Python ingestion packages are gone.
        run: sudo make install_antlr_cli

      - name: Build dependencies for integration-tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -DskipTests install -pl :openmetadata-integration-tests -am

      - name: Run isolated search ITs (postgres + opensearch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Embedded bootstrap = fresh stack each run; these search ITs create their cohorts on the
        # fly (jpw.data.mode=ingest). Static/ensure reuse is for the external cluster only.
        # ShardFilter splits the classes across runners; the profile keeps them serial within a
        # shard because they mutate cluster-global state.
        run: mvn verify -P search-it -pl :openmetadata-integration-tests -DdatabaseType=postgres -DsearchType=opensearch -Djpw.data.mode=ingest -Djpw.reindex.timeoutMin=${{ github.event.inputs.reindexTimeoutMin || '60' }} -Djpw.shard.total=${{ env.SEARCH_IT_SHARDS }} -Djpw.shard.index=${{ matrix.shard }}

      - name: Upload Failsafe Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports-search-it-s${{ matrix.shard }}-${{ github.run_id }}
          path: openmetadata-integration-tests/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Test Report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: scacap/action-surefire-report@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_test_failures: false
          report_paths: 'openmetadata-integration-tests/target/failsafe-reports/TEST-*.xml'

      # Failures only: a green nightly is the expected case and notifying on it trains
      # the channel to ignore the alert.
      - name: Slack notification
        if: ${{ failure() && github.event_name != 'pull_request' && env.SLACK_JAVA_PLAYWRIGHT_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_JAVA_PLAYWRIGHT_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":fire: Java Search ITs Nightly (shard ${{ matrix.shard }}): ${{ job.status }}\nRef: ${{ github.ref_name }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_JAVA_PLAYWRIGHT_URL: ${{ secrets.SLACK_JAVA_PLAYWRIGHT_URL }}

  # Required status check on main (ruleset `merge-rules`). Named to match the context exactly.
  # `always()` so it reports on every PR: when nothing search-related changed the upstream jobs
  # are skipped and this exits 0; otherwise every job must have succeeded.
  java-ui-it:
    name: java-ui-it
    needs: [changes, ui-it-nightly, search-it-nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    steps:
      - name: Verify JavaUIIT suite
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SEARCH_CHANGED: ${{ needs.changes.outputs.search }}
          UI_IT_RESULT: ${{ needs.ui-it-nightly.result }}
          SEARCH_IT_RESULT: ${{ needs.search-it-nightly.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "success" && "$SEARCH_CHANGED" != "true" ]]; then
            echo "No search-indexing paths changed."
            exit 0
          fi

          if [[ "$CHANGES_RESULT" != "success" \
                || "$UI_IT_RESULT" != "success" || "$SEARCH_IT_RESULT" != "success" ]]; then
            echo "JavaUIIT jobs did not complete successfully: changes=${CHANGES_RESULT}, ui-it=${UI_IT_RESULT}, search-it=${SEARCH_IT_RESULT}"
            exit 1
          fi
