#  TEMPORARY — delete before merging PR #31744.
#
#  Posts one [SELFTEST] notification per on-duty team to confirm each configured
#  user-group ID resolves to the intended group and actually pings.

name: ZZ Merge Queue Selftest (temporary)

on:
  push:
    branches:
      - chore/merge-queue-slack-notify

permissions:
  actions: read
  contents: read

jobs:
  selftest:
    name: Ping each on-duty group
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - workflow: UI Checkstyle
            expect: onduty-ui
          - workflow: py-tests
            expect: onduty-integration
          - workflow: Java Checkstyle
            expect: onduty-backend
          - workflow: Validate JSON/YAML
            expect: onduty-devops
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve and post
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.E2E_SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: ${{ vars.MERGE_QUEUE_SLACK_CHANNEL || 'C0B6Q6KDMJN' }}
          TEXT_PREFIX: "[SELFTEST — ignore] "
          WORKFLOW_NAME: ${{ matrix.workflow }}
          CONCLUSION: failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: "31744"
          PR_TITLE: Notify Slack when a PR fails in the merge queue
          PR_AUTHOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          HEAD_BRANCH: gh-readonly-queue/main/pr-31744-${{ github.sha }}
        run: |
          set -euo pipefail
          .github/scripts/resolve-merge-queue-owner.sh > /tmp/owner
          OWNER_HANDLE=$(sed -n 1p /tmp/owner)
          OWNER_GROUP_ID=$(sed -n 2p /tmp/owner)
          export OWNER_HANDLE OWNER_GROUP_ID
          echo "  ${WORKFLOW_NAME} -> ${OWNER_HANDLE} (${OWNER_GROUP_ID})"
          [ "$OWNER_HANDLE" = "${{ matrix.expect }}" ] || {
            echo "::error::expected ${{ matrix.expect }}, got '${OWNER_HANDLE}'"; exit 1; }
          [ -n "$OWNER_GROUP_ID" ] || { echo "::error::no group ID configured"; exit 1; }
          .github/scripts/notify-merge-queue-slack.sh
