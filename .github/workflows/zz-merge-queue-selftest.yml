#  TEMPORARY — delete before merging PR #31744.
#
#  Exercises the parts of Merge Queue Watch that need real credentials: whether
#  the Slack bot has usergroups:read, whether the onduty-* user groups exist,
#  and what the resolver returns for every mapped workflow.

name: ZZ Merge Queue Selftest (temporary)

on:
  push:
    branches:
      - chore/merge-queue-slack-notify

permissions:
  actions: read
  contents: read

jobs:
  selftest:
    name: Verify owner routing and Slack mention
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Every watched workflow has an owner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, yaml, sys
          wf = yaml.safe_load(open('.github/workflows/merge-queue-watch.yml'))
          watched = wf[True]['workflow_run']['workflows']
          owners = json.load(open('.github/merge-queue-owners.json'))
          missing = [w for w in watched if w not in owners['workflows']]
          extra = [w for w in owners['workflows'] if w not in watched]
          for w in watched:
              print(f"  {owners['workflows'].get(w, '!! UNMAPPED'):<12} {w}")
          if missing or extra:
              print(f"::error::unmapped={missing} stale={extra}")
              sys.exit(1)
          print(f"All {len(watched)} watched workflows are mapped.")
          PY

      - name: Resolver returns the mapped team for each workflow
        run: |
          set -euo pipefail
          jq -r '.workflows | keys[]' .github/merge-queue-owners.json | while IFS= read -r wf; do
            handle=$(WORKFLOW_NAME="$wf" .github/scripts/resolve-merge-queue-owner.sh 2>/dev/null)
            printf '  %-22s %s\n' "$handle" "$wf"
            [ -n "$handle" ] || { echo "::error::no handle for $wf"; exit 1; }
          done

      - name: Infra failure overrides the name mapping
        run: |
          set -euo pipefail
          # A real TypeScript Type Generation run that failed in "Set up job";
          # the name mapping says ui, so this must come back as the infra team.
          handle=$(WORKFLOW_NAME="TypeScript Type Generation" RUN_ID=32044383548 \
            .github/scripts/resolve-merge-queue-owner.sh)
          echo "  resolved: $handle"
          [ "$handle" = "onduty-devops" ] || { echo "::error::expected onduty-devops, got '$handle'"; exit 1; }

      - name: Report Slack user-group visibility
        env:
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.E2E_SLACK_BOT_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer ${SLACK_BOT_USER_OAUTH_TOKEN}" \
            https://slack.com/api/usergroups.list)
          if [ "$(printf '%s' "$resp" | jq -r '.ok')" != "true" ]; then
            echo "::warning::usergroups.list failed: $(printf '%s' "$resp" | jq -r '.error')"
            echo "  -> mentions will be unlinked plain text until the scope is granted"
            exit 0
          fi
          echo "  usergroups.list OK; matching onduty-* groups:"
          printf '%s' "$resp" | jq -r '.usergroups[]? | select(.handle | startswith("onduty")) | "    \(.handle) -> \(.id)"'
          for h in $(jq -r '.teams[]' .github/merge-queue-owners.json); do
            found=$(printf '%s' "$resp" | jq -r --arg h "$h" '[.usergroups[]? | select(.handle==$h)] | length')
            [ "$found" = "0" ] && echo "::warning::no Slack user group with handle '$h'"
          done

      - name: Post a routed test notification
        env:
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.E2E_SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: ${{ vars.MERGE_QUEUE_SLACK_CHANNEL || 'C0B6Q6KDMJN' }}
          TEXT_PREFIX: "[SELFTEST — ignore] "
          WORKFLOW_NAME: TypeScript Type Generation
          CONCLUSION: failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: "31744"
          PR_TITLE: Notify Slack when a PR fails in the merge queue
          PR_AUTHOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          HEAD_BRANCH: gh-readonly-queue/main/pr-31744-${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_HANDLE=$(WORKFLOW_NAME="TypeScript Type Generation" RUN_ID=32044383548 \
            .github/scripts/resolve-merge-queue-owner.sh 2>/dev/null)
          export OWNER_HANDLE
          echo "  tagging: ${OWNER_HANDLE:-<none>}"
          .github/scripts/notify-merge-queue-slack.sh
