#  TEMPORARY — delete before merging PR #31744.
#
#  Read-only check that the bot can reach the configured channel. Posts nothing:
#  a wrong channel ID or a bot that was never invited would otherwise only show
#  up on the first real merge-queue failure.

name: ZZ Merge Queue Selftest (temporary)

on:
  push:
    branches:
      - chore/merge-queue-slack-notify

permissions:
  contents: read

jobs:
  selftest:
    name: Check channel reachability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Inspect the target channel
        env:
          SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.E2E_SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: ${{ vars.MERGE_QUEUE_SLACK_CHANNEL || 'C0AC5T013V1' }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer ${SLACK_BOT_USER_OAUTH_TOKEN}" \
            "https://slack.com/api/conversations.info?channel=${SLACK_CHANNEL}")
          if [ "$(printf '%s' "$resp" | jq -r '.ok')" != "true" ]; then
            echo "::warning::conversations.info failed: $(printf '%s' "$resp" | jq -r '.error')"
            echo "  cannot confirm reachability without posting; scope may be missing"
            exit 0
          fi
          printf '%s' "$resp" | jq -r '"  channel: #\(.channel.name)  id=\(.channel.id)  is_member=\(.channel.is_member)  archived=\(.channel.is_archived)"'
          if [ "$(printf '%s' "$resp" | jq -r '.channel.is_member')" != "true" ]; then
            echo "::error::the bot is not a member of this channel; chat.postMessage will fail with not_in_channel"
            exit 1
          fi
