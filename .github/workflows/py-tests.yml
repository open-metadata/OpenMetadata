name: py-tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Workload to run manually
        type: choice
        options: [pull-request, merge-queue, nightly]
        default: nightly
      connectors:
        description: CLI E2E connectors as a JSON array (nightly mode)
        type: string
        default: '["bigquery", "dbt_redshift", "metabase", "mssql", "mysql", "redash", "snowflake", "tableau", "redshift", "quicksight", "datalake_s3", "postgres", "oracle", "athena", "bigquery_multiple_project", "exasol", "powerbi"]'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'auto' }}
  cancel-in-progress: true

jobs:
  # Detect whether relevant paths changed before the matrix fans out.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      python: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'true' || steps.filter.outputs.python }}
      e2e: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'true' || steps.filter.outputs.e2e }}
      integration: ${{ steps.matrix.outputs.run-integration }}
      versions: ${{ steps.matrix.outputs.versions }}
      static-version: ${{ steps.matrix.outputs.static-version }}
      coverage-version: ${{ steps.matrix.outputs.coverage-version }}
      latest-version: ${{ steps.matrix.outputs.latest-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          filter: blob:none
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            python:
              - 'ingestion/**'
              - 'scripts/prepare_classification_models.py'
              - '.github/actions/prepare-classification-models/**'
              - '.github/actions/prepare-classification-model/**'
              - '.github/workflows/warm-classification-models.yml'
              - '.github/workflows/py-tests.yml'
              - '.github/workflows/py-tests-shared.yml'
              - '.github/workflows/py-cli-e2e-tests-v2.yml'
              - '.github/workflows/py-cli-e2e-tests.yml'
              - '.github/actions/setup-openmetadata-test-environment/action.yml'
              - 'openmetadata-spec/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/resources/**'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/JsonPatchMessageBodyReader.java'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/JsonPatchProvider.java'
              - 'openmetadata-service/src/main/java/org/openmetadata/service/ResourceRegistry.java'
            e2e:
              - 'ingestion/tests/cli_e2e_v2/**'
              - 'ingestion/pyproject.toml'
              - 'ingestion/setup.py'
              - 'ingestion/src/_openmetadata_testutils/pytest_openmetadata/**'
              - 'openmetadata-spec/src/main/resources/json/schema/**'
              - '.github/workflows/py-tests.yml'
              - '.github/workflows/py-tests-shared.yml'
              - '.github/workflows/py-cli-e2e-tests-v2.yml'
              - '.github/workflows/py-cli-e2e-tests.yml'
              - '.github/actions/setup-openmetadata-test-environment/action.yml'

      - id: matrix
        env:
          CI_EVENT: ${{ github.event_name }}
          TEST_MODE: ${{ inputs.mode }}
        run: |
          if [ "$CI_EVENT" = "workflow_dispatch" ]; then
            case "$TEST_MODE" in
              pull-request) CI_EVENT="pull_request" ;;
              merge-queue) CI_EVENT="merge_group" ;;
              nightly) CI_EVENT="schedule" ;;
              *) echo "Invalid test mode: $TEST_MODE"; exit 1 ;;
            esac
          fi
          python3 scripts/prepare_classification_models.py test-matrix --project ingestion --event "$CI_EVENT" \
            | jq -r 'to_entries[] | "\(.key)=\(.value | if type == "array" or type == "boolean" then tojson else . end)"' >> "$GITHUB_OUTPUT"

  prepare-spacy-model:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    cache-mode: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-classification-models

  # Produces the one artifact docker/development/Dockerfile needs, so shards can skip Maven.
  build-distribution:
    name: Build Backend Distribution
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' && needs.changes.outputs.integration == 'true' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Restore-only: pull_request / merge_group writes are scoped to refs no
      # other run can read, so saving would only consume the repo's cache quota.
      - name: Restore Maven dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # -am builds only openmetadata-dist's dependency closure, and -DonlyBackend is what
      # drops openmetadata-ui from it. Removing either pulls the whole frontend build back
      # in, which also needs the antlr4 CLI that this job deliberately does not install.
      - name: Build backend distribution
        run: mvn -DskipTests -DonlyBackend clean package -pl openmetadata-dist -am
        shell: bash

      - name: Upload backend distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmetadata-backend-distribution
          path: openmetadata-dist/target/openmetadata-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  python:
    needs: [changes, prepare-spacy-model, build-distribution]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.prepare-spacy-model.result == 'success' && (needs.build-distribution.result == 'success' || (needs.changes.outputs.integration == 'false' && needs.build-distribution.result == 'skipped')) }}
    uses: ./.github/workflows/py-tests-shared.yml
    with:
      python-versions: ${{ needs.changes.outputs.versions }}
      static-python: ${{ needs.changes.outputs.static-version }}
      coverage-python: ${{ needs.changes.outputs.coverage-version }}
      run-integration: ${{ needs.changes.outputs.integration == 'true' }}
      run-e2e: ${{ needs.changes.outputs.e2e == 'true' }}

  cli-e2e:
    needs: [changes, prepare-spacy-model, build-distribution]
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/py-cli-e2e-tests.yml
    secrets: inherit
    with:
      python-version: ${{ needs.changes.outputs.latest-version }}
      connectors: ${{ inputs.connectors || '["bigquery", "dbt_redshift", "metabase", "mssql", "mysql", "redash", "snowflake", "tableau", "redshift", "quicksight", "datalake_s3", "postgres", "oracle", "athena", "bigquery_multiple_project", "exasol", "powerbi"]' }}

  py-tests-status:
    name: py-tests-status
    needs: [changes, prepare-spacy-model, build-distribution, python, cli-e2e]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the selected Python pipeline succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          MODELS_RESULT: ${{ needs.prepare-spacy-model.result }}
          BUILD_RESULT: ${{ needs.build-distribution.result }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.integration }}
          CLI_RESULT: ${{ needs.cli-e2e.result }}
          RUN_CLI: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')) }}
          PIPELINE_RESULT: ${{ needs.python.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Python selection failed: $CHANGES_RESULT"
            exit 1
          fi
          case "$PYTHON_CHANGED" in
            true) expected="success" ;;
            false) expected="skipped" ;;
            *) echo "Invalid Python change result: $PYTHON_CHANGED"; exit 1 ;;
          esac
          expected_build="skipped"
          if [ "$PYTHON_CHANGED" = "true" ] && [ "$RUN_INTEGRATION" = "true" ]; then
            expected_build="success"
          fi
          expected_cli="skipped"
          if [ "$RUN_CLI" = "true" ]; then
            expected_cli="success"
          fi
          if [ "$BUILD_RESULT" != "$expected_build" ] || [ "$CLI_RESULT" != "$expected_cli" ]; then
            echo "Unexpected Python results: build=$BUILD_RESULT (expected $expected_build) cli=$CLI_RESULT (expected $expected_cli)"
            exit 1
          fi
          if [ "$MODELS_RESULT" != "$expected" ] || [ "$PIPELINE_RESULT" != "$expected" ]; then
            echo "Expected $expected: models=$MODELS_RESULT pipeline=$PIPELINE_RESULT"
            exit 1
          fi
        shell: bash

  notify:
    needs: [changes, prepare-spacy-model, build-distribution, python, cli-e2e, py-tests-status]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')) && needs.py-tests-status.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Slack on nightly failure
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.COLLATE_BOT_SLACK_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C03EYBDDX17",
              "text": "<!subteam^S0AH093PEQL> 🔥 *Python Tests Nightly* failed on `${{ github.ref_name }}` 🔥\nselection: ${{ needs.changes.result }} · models: ${{ needs.prepare-spacy-model.result }} · build: ${{ needs.build-distribution.result }} · tests: ${{ needs.python.result }} · CLI E2E: ${{ needs.cli-e2e.result }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  sonar-cloud-coverage-upload:
    runs-on: ubuntu-latest
    needs: [changes, python, cli-e2e]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.python.result == 'success' && needs.cli-e2e.result == 'success' }}
    continue-on-error: true
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.changes.outputs.latest-version }}

      - name: Install coverage dependencies
        run: |
          python3 -m venv env
          env/bin/python -m pip install "coverage[toml]"

      - name: Download coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*coverage-*'
          path: artifacts

      - name: Download CLI test results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: tests-*
          path: test-artifacts

      - name: Download unit and integration test results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: py-*-test-results-*
          path: test-artifacts

      - name: Generate report
        run: |
          shopt -s nullglob
          for folder in artifacts/*coverage-*; do
            artifact=$(basename "$folder")
            for file in "$folder"/.coverage*; do
              [ -f "$file" ] && cp "$file" "ingestion/.coverage.${artifact}.$(basename "$file")"
            done
          done
          mkdir -p ingestion/junit
          find test-artifacts -name 'test-results-*.xml' | while IFS= read -r file; do
            name="${file#test-artifacts/}"
            name="${name//\//-}"
            cp "$file" "ingestion/junit/test-results-${name}"
          done
          source env/bin/activate
          cd ingestion
          coverage combine --rcfile=pyproject.toml --keep .coverage*
          coverage xml --rcfile=pyproject.toml --data-file=.coverage
        shell: bash

      - name: Push Results to Sonar
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.INGESTION_SONAR_SECRET }}
        with:
          projectBaseDir: ingestion/
