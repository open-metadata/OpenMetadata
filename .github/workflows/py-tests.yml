name: py-tests
on:
  merge_group:
  workflow_dispatch:
  pull_request_target:
    types: [labeled, opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test' }}

jobs:
  # MySQL + Elasticsearch lane. This lane also owns the unit-test matrix and the
  # combined-coverage/Sonar push, which are database-independent and must not be
  # duplicated in py-tests-postgres.
  #
  # -s true : skip Maven; the shared workflow builds the distribution once and the
  #           shards restore it as an artifact.
  # -i false: skip the Airflow ingestion image and the sample_data DAG seeding. No
  #           Python integration test consumes the seeded sample data — the Airflow
  #           connector tests are mocked at TrackedREST, and usage/test_sample_usage.py
  #           reads ingestion/examples/sample_data from disk and creates its own service.
  python:
    uses: ./.github/workflows/py-tests-shared.yml
    with:
      compose-args: "-m no-ui -s true -i false"
      artifact-prefix: py
      test-profile: python-integration
      run-unit-tests: true
      run-coverage: true
    secrets: inherit

  # Set "py-tests / py-tests-status" as the sole required check for this workflow.
  # Kept in the caller so the required check context survives the move to a reusable
  # workflow; a job inside py-tests-shared.yml would report as
  # "py-tests / python / <job>" instead and break the ruleset.
  py-tests-status:
    name: ${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name != 'safe to test' && 'py-tests-status (ignored label)' || 'py-tests-status' }}
    needs: python
    if: ${{ always() && !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the shared Python pipeline succeeded
        env:
          PIPELINE_RESULT: ${{ needs.python.result }}
        run: |
          if [ "$PIPELINE_RESULT" != "success" ]; then
            echo "Shared Python pipeline did not succeed: $PIPELINE_RESULT"
            exit 1
          fi
        shell: bash
