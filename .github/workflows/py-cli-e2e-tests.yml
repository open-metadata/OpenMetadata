name: py-cli-e2e-tests
on:
  workflow_call:
    inputs:
      python-version:
        description: Highest supported Python version for connector E2E tests
        required: true
        type: string
      connectors:
        description: Connector names as a JSON array; empty selects all connectors
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  py-cli-e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        e2e-test: ${{ fromJSON(inputs.connectors || '["bigquery", "dbt_redshift", "metabase", "mssql", "mysql", "redash", "snowflake", "tableau", "redshift", "quicksight", "datalake_s3", "postgres", "oracle", "athena", "bigquery_multiple_project", "exasol", "powerbi"]') }}
    # Snowflake drops and recreates the E2E database that the v2 Snowflake job also uses, so both
    # workflows put their Snowflake jobs in one group that runs one at a time. A newer pending job
    # replaces an older one.
    concurrency:
      group: ${{ matrix.e2e-test == 'snowflake' && 'cli-e2e-snowflake-database' || format('{0}-{1}-{2}', github.workflow, github.run_id, matrix.e2e-test) }}
      cancel-in-progress: false
    environment: test

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        swap-storage: true
        docker-images: false

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: configure aws credentials
      if: contains('quicksight', matrix.e2e-test) || contains('datalake_s3', matrix.e2e-test) || contains('athena', matrix.e2e-test)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.E2E_AWS_IAM_ROLE_ARN }}
        role-session-name: github-ci-aws-e2e-tests
        aws-region: ${{ secrets.E2E_AWS_REGION }}

    - name: Download shared backend distribution
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: openmetadata-backend-distribution
        path: openmetadata-dist/target

    - name: Setup Openmetadata Test Environment
      uses: ./.github/actions/setup-openmetadata-test-environment
      with:
        python-version: ${{ inputs.python-version }}
        classification-models: 'true'
        args: "-m no-ui -s true"

    - name: Reclaim unused disk for Exasol
      if: matrix.e2e-test == 'exasol'
      continue-on-error: true
      run: |
        {
          echo "Before Exasol disk reclaim"
          df -h
          docker system df
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force || true
          docker builder prune --all --force || true
          echo "After Exasol disk reclaim"
          df -h
          docker system df
        } 2>&1 | tee "${RUNNER_TEMP}/exasol-disk-reclaim.log"
      shell: bash

    - name: Run CLI E2E Python Tests & record coverage
      id: e2e-test
      env:
        E2E_TEST: ${{ matrix.e2e-test }}
        E2E_BQ_PROJECT_ID_TAXONOMY: ${{ secrets.TEST_BQ_PROJECT_ID_TAXONOMY }}
        E2E_BQ_PRIVATE_KEY: ${{ secrets.TEST_BQ_PRIVATE_KEY_E2E }}
        E2E_BQ_PROJECT_ID: ${{ secrets.TEST_BQ_PROJECT_ID }}
        E2E_BQ_PROJECT_ID2: ${{ secrets.TEST_BQ_PROJECT_ID2 }}
        E2E_BQ_PRIVATE_KEY_ID: ${{ secrets.TEST_BQ_PRIVATE_KEY_ID }}
        E2E_BQ_CLIENT_EMAIL: ${{ secrets.TEST_BQ_CLIENT_EMAIL }}
        E2E_BQ_CLIENT_ID: ${{ secrets.TEST_BQ_CLIENT_ID }}
        E2E_SNOWFLAKE_PASSWORD: ${{ secrets.TEST_SNOWFLAKE_PASSWORD_YAML }}
        E2E_SNOWFLAKE_PASSPHRASE: ${{ secrets.TEST_SNOWFLAKE_PASSPHRASE }}
        E2E_SNOWFLAKE_USERNAME: ${{ secrets.TEST_SNOWFLAKE_USERNAME }}
        E2E_SNOWFLAKE_ACCOUNT: ${{ secrets.TEST_SNOWFLAKE_ACCOUNT }}
        E2E_SNOWFLAKE_DATABASE: ${{ secrets.TEST_SNOWFLAKE_DATABASE_E2E }}
        E2E_SNOWFLAKE_WAREHOUSE: ${{ secrets.TEST_SNOWFLAKE_WAREHOUSE }}
        E2E_REDSHIFT_DBT_CATALOG_HTTP_FILE_PATH: ${{ secrets.E2E_REDSHIFT_DBT_CATALOG_HTTP_FILE_PATH }}
        E2E_REDSHIFT_DBT_MANIFEST_HTTP_FILE_PATH: ${{ secrets.E2E_REDSHIFT_DBT_MANIFEST_HTTP_FILE_PATH }}
        E2E_REDSHIFT_DBT_RUN_RESULTS_HTTP_FILE_PATH: ${{ secrets.E2E_REDSHIFT_DBT_RUN_RESULTS_HTTP_FILE_PATH }}
        E2E_REDSHIFT_HOST_PORT: ${{ secrets.E2E_REDSHIFT_HOST_PORT }}
        E2E_REDSHIFT_USERNAME: ${{ secrets.E2E_REDSHIFT_USERNAME }}
        E2E_REDSHIFT_PASSWORD: ${{ secrets.E2E_REDSHIFT_PASSWORD }}
        E2E_REDSHIFT_DATABASE: ${{ secrets.E2E_REDSHIFT_DATABASE }}
        E2E_REDSHIFT_DB: ${{ secrets.E2E_REDSHIFT_DB }}
        E2E_MSSQL_USERNAME: ${{ secrets.E2E_MSSQL_USERNAME }}
        E2E_MSSQL_PASSWORD: ${{ secrets.E2E_MSSQL_PASSWORD }}
        E2E_MSSQL_HOST: ${{ secrets.E2E_MSSQL_HOST }}
        E2E_MSSQL_DATABASE: ${{ secrets.E2E_MSSQL_DATABASE }}
        E2E_VERTICA_USERNAME: ${{ secrets.E2E_VERTICA_USERNAME }}
        E2E_VERTICA_PASSWORD: ${{ secrets.E2E_VERTICA_PASSWORD }}
        E2E_VERTICA_HOST_PORT: ${{ secrets.E2E_VERTICA_HOST_PORT }}
        E2E_TABLEAU_PAT_NAME: ${{ secrets.E2E_TABLEAU_PAT_NAME }}
        E2E_TABLEAU_PAT_SECRET: ${{ secrets.E2E_TABLEAU_PAT_SECRET }}
        E2E_TABLEAU_HOST_PORT: ${{ secrets.E2E_TABLEAU_HOST_PORT }}
        E2E_TABLEAU_SITE: ${{ secrets.E2E_TABLEAU_SITE }}
        E2E_REDASH_HOST_PORT: ${{ secrets.E2E_REDASH_HOST_PORT }}
        E2E_REDASH_USERNAME: ${{ secrets.E2E_REDASH_USERNAME }}
        E2E_REDASH_API_KEY: ${{ secrets.E2E_REDASH_API_KEY }}
        E2E_POWERBI_CLIENT_SECRET: ${{ secrets.E2E_POWERBI_CLIENT_SECRET }}
        E2E_POWERBI_CLIENT_ID: ${{ secrets.E2E_POWERBI_CLIENT_ID }}
        E2E_POWERBI_TENANT_ID: ${{ secrets.E2E_POWERBI_TENANT_ID }}
        E2E_METABASE_HOST_PORT: ${{ secrets.TEST_METABASE_HOST_PORT }}
        E2E_METABASE_PASSWORD: ${{ secrets.TEST_METABASE_PASSWORD }}
        E2E_METABASE_USERNAME: ${{ secrets.TEST_METABASE_USERNAME }}
        E2E_HIVE_HOST_PORT: ${{ secrets.E2E_HIVE_HOST_PORT }}
        E2E_HIVE_AUTH: ${{ secrets.E2E_HIVE_AUTH }}
        E2E_QUICKSIGHT_AWS_ACCOUNTID: ${{ secrets.E2E_QUICKSIGHT_AWS_ACCOUNTID }}
        E2E_QUICKSIGHT_REGION: ${{ secrets.E2E_QUICKSIGHT_REGION }}
        E2E_DATALAKE_S3_BUCKET_NAME: ${{ secrets.E2E_DATALAKE_S3_BUCKET_NAME }}
        E2E_DATALAKE_S3_PREFIX: ${{ secrets.E2E_DATALAKE_S3_PREFIX }}
        E2E_DATALAKE_S3_REGION: ${{ secrets.E2E_AWS_REGION }}
        E2E_POSTGRES_USERNAME: ${{ secrets.E2E_POSTGRES_USERNAME }}
        E2E_POSTGRES_PASSWORD: ${{ secrets.E2E_POSTGRES_PASSWORD }}
        E2E_POSTGRES_HOSTPORT: ${{ secrets.TEST_POSTGRES_HOST_PORT }}
        E2E_POSTGRES_DATABASE: ${{ secrets.E2E_POSTGRES_DATABASE }}
        E2E_ORACLE_HOST_PORT: ${{ secrets.E2E_ORACLE_HOST_PORT }}
        E2E_ORACLE_USERNAME: ${{ secrets.E2E_ORACLE_USERNAME }}
        E2E_ORACLE_PASSWORD: ${{ secrets.E2E_ORACLE_PASSWORD }}
        E2E_ORACLE_SERVICE_NAME: ${{ secrets.E2E_ORACLE_SERVICE_NAME }}
        E2E_ATHENA_REGION: ${{ secrets.E2E_AWS_REGION }}
        E2E_ATHENA_S3STAGINGDIR: ${{ secrets.E2E_ATHENA_S3STAGINGDIR }}
        E2E_ATHENA_WORKGROUP: ${{ secrets.E2E_ATHENA_WORKGROUP }}
      run: |
        set -o pipefail
        source env/bin/activate
        site_packages_path="$(python -c "import site; import os; from pathlib import Path; print(os.path.relpath(site.getsitepackages()[0], str(Path.cwd())))")"
        SITE_CUSTOMIZE_PATH="${site_packages_path}/sitecustomize.py"
        export SITE_CUSTOMIZE_PATH
        {
          echo "import os"
          echo "try:"
          echo "    import coverage"
          echo "    os.environ['COVERAGE_PROCESS_START'] = os.path.join(os.environ.get('GITHUB_WORKSPACE', os.getcwd()), 'ingestion', 'pyproject.toml')"
          echo "    coverage.process_startup()"
          echo "except ImportError:"
          echo "    pass"
        } >> "$SITE_CUSTOMIZE_PATH"
        coverage run --rcfile ingestion/pyproject.toml --branch -m pytest -c ingestion/pyproject.toml "--junitxml=ingestion/junit/test-results-${E2E_TEST}.xml" --ignore=ingestion/tests/unit/source "ingestion/tests/cli_e2e/test_cli_${E2E_TEST}.py" 2>&1 | tee ingestion/cli-e2e-test-run.log
        coverage combine "--data-file=.coverage.${E2E_TEST}" --rcfile=ingestion/pyproject.toml --keep .coverage* || true
        coverage report --rcfile ingestion/pyproject.toml "--data-file=.coverage.${E2E_TEST}" || true
      shell: bash

    - name: Upload coverage artifact for CLI E2E tests
      if: steps.e2e-test.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: cli-coverage-${{ matrix.e2e-test }}
        path: .coverage.${{ matrix.e2e-test }}
        include-hidden-files: true

    - name: Classify Python CLI E2E test outcome
      if: ${{ always() }}
      env:
        CLI_E2E_OUTCOME: ${{ steps.e2e-test.outcome }}
        E2E_TEST: ${{ matrix.e2e-test }}
        TEST_PROFILE: python-cli-e2e
        TEST_LANE: ${{ matrix.e2e-test }}
      run: |
          python3 .github/scripts/classify_test_outcome.py \
            --step-outcome "$CLI_E2E_OUTCOME" \
            --report-glob 'ingestion/junit/test-results-*.xml' \
            --diagnostic-glob 'ingestion/*-test-run.log' \
            --output ingestion/ci-diagnostics/outcome.json
      shell: bash

    - name: Upload tests artifact
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: tests-${{ matrix.e2e-test }}
        path: |
          ingestion/junit/test-results-*.xml
          ingestion/ci-diagnostics/outcome.json
          ingestion/*-test-run.log
        if-no-files-found: warn
        retention-days: 14
        compression-level: 1

    - name: Collect runner and service diagnostics
      if: ${{ failure() || cancelled() }}
      continue-on-error: true
      run: |
        diagnostics="${RUNNER_TEMP}/python-ci-diagnostics"
        rm -rf "$diagnostics"
        mkdir -p "$diagnostics"
        df -h > "$diagnostics/disk-usage.txt" 2>&1 || true
        free -h > "$diagnostics/memory-usage.txt" 2>&1 || true
        docker system df > "$diagnostics/docker-disk-usage.txt" 2>&1 || true
        docker ps --all --no-trunc > "$diagnostics/docker-containers.txt" 2>&1 || true
        if [ -d docker/development ]; then
          (cd docker/development && docker compose ps --all) > "$diagnostics/docker-compose-ps.txt" 2>&1 || true
          (cd docker/development && docker compose logs --no-color --tail 2000) > "$diagnostics/docker-compose.log" 2>&1 || true
        fi
        coredumpctl --no-pager list > "$diagnostics/coredumps.txt" 2>&1 || true
        coredumpctl --no-pager info >> "$diagnostics/coredumps.txt" 2>&1 || true
        find "$GITHUB_WORKSPACE" /tmp /var/crash -maxdepth 3 -type f \
          \( -name 'core' -o -name 'core.*' -o -name '*.core' -o -name '*.dmp' -o -name '*.crash' \) \
          -printf '%p %s bytes\n' >> "$diagnostics/core-files.txt" 2>/dev/null || true
        if [ -f "${RUNNER_TEMP}/exasol-disk-reclaim.log" ]; then
          cp "${RUNNER_TEMP}/exasol-disk-reclaim.log" "$diagnostics/"
        fi
      shell: bash

    - name: Upload runner and service diagnostics
      if: ${{ failure() || cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: py-cli-e2e-diagnostics-${{ matrix.e2e-test }}
        path: ${{ runner.temp }}/python-ci-diagnostics/
        if-no-files-found: warn
        retention-days: 14
        compression-level: 1

    - name: Clean Up
      if: ${{ always() }}
      continue-on-error: true
      run: |
        cd ./docker/development
        docker compose down --remove-orphans || true
        sudo rm -rf "${PWD}/docker-volume"

  py-cli-e2e-tests-status:
    name: py-cli-e2e-tests-status
    needs: py-cli-e2e-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all expected CLI E2E jobs completed
        env:
          TEST_RESULT: ${{ needs.py-cli-e2e-tests.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Expected CLI E2E jobs did not succeed: tests=$TEST_RESULT"
            exit 1
          fi
        shell: bash
