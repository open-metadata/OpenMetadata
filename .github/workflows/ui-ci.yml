# All UI CI for one revision, called as the single `ui` job of ci-pr.yml and
# ci-merge-queue.yml. Checkstyle runs first; Jest and the browser tests fan out
# to parallel shards only once it passes, so a lint failure costs one runner
# and the slowest path is checkstyle plus the slowest shard.
name: UI CI

on:
  workflow_call:
    inputs:
      ref:
        description: Revision to check out.
        type: string
        required: true
      unit:
        description: Whether the change selects Jest (the ui-unit paths).
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Changed-file detection diffs against the base.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/ui-checkstyle

  unit:
    name: unit (shard ${{ matrix.shard }})
    needs: lint
    if: ${{ inputs.unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/ui-unit
        with:
          shard: ${{ matrix.shard }}/4

  browser:
    name: browser
    needs: lint
    permissions:
      contents: read
      # Downloads the impact map from earlier runs.
      actions: read
    uses: ./.github/workflows/ui-browser-tests.yml

  # Fails the call when a selected job did not succeed or an unselected one ran.
  status:
    name: status
    needs: [lint, unit, browser]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-status-gate
      - uses: ./.github/actions/ci-status-gate
        with:
          needs: ${{ toJSON(needs) }}
          expected: |
            {
              "lint": "success",
              "unit": "${{ inputs.unit && 'success' || 'skipped' }}",
              "browser": "success"
            }
