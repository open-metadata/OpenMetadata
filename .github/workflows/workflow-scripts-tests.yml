name: CI Scripts Tests
# Runs the tests of the CI's own scripts, including the Guard tests that decision
# records in docs/decisions/ name. Those read the workflows themselves, so a workflow
# change runs them too.

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/merge-gate/**'
      - '.github/java-tests/**'
      - '.github/playwright/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-scripts-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scripts-tests:
    name: scripts-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # anthropic: without it the CI AI model and explain tests skip instead of running.
      # The two whole-repository audits of the Java impact map stay out: map ownership
      # is checked before the PR by the agent and pre-push hooks (#34984), not by CI, so
      # code another PR left unowned never fails this one.
      - name: Run the CI scripts' tests
        run: |
          pip install --quiet pytest pyyaml anthropic
          python -m pytest -q -p no:cacheprovider .github/scripts/tests .github/scripts/test_*.py \
            --deselect .github/scripts/test_plan_local_java_tests.py::test_impact_map_owns_every_test_and_production_file \
            --deselect .github/scripts/test_plan_local_java_tests.py::test_the_committed_map_owns_every_committed_test_and_production_file
