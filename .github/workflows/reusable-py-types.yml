name: reusable-py-types
on:
  workflow_call:
    inputs:
      ref:
        description: Git commit SHA to check for type errors
        type: string
        required: true
      python-version:
        description: Lowest supported Python version for type checks
        type: string
        required: true
permissions:
  contents: read
jobs:
  types:
    name: Check Python types
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/prepare-python-environment
        with:
          python-version: ${{ inputs.python-version }}
          profile: types
      - name: Check types
        env:
          PYTHON_VERSIONS: ${{ inputs.python-version }}
        run: |
          set -o pipefail
          make static-checks 2>&1 | tee ingestion/static-checks-run.log
        shell: bash
      - name: Upload static check log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: py-static-checks
          path: ingestion/static-checks-run.log
          if-no-files-found: warn
          retention-days: 14
