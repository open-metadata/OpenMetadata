name: Classification models changed

on:
  push:
    branches: [main]
    paths:
      - ingestion/pyproject.toml
      - ingestion/uv.lock
      - scripts/prepare_classification_models.py
      - .github/workflows/reusable-prepare-classification-models.yml
      - .github/workflows/reusable-write-classification-models.yml
      - .github/workflows/warm-classification-models.yml

permissions:
  contents: read
cache-mode: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Model metadata revision is ready for the default-branch warmer.'
