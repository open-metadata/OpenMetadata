# The dequeue report runs main's copy under pull_request_target, so its script
# is tested here, before it merges, on the same ubuntu-latest python3.
name: Merge queue dequeue tests

on:
  pull_request:
    paths:
      - .github/scripts/merge_queue_dequeue.py
      - .github/scripts/test_merge_queue_dequeue.py
      - .github/scripts/merge_queue_metrics.py
      - .github/workflows/merge-queue-dequeue-tests.yml
      - .github/workflows/merge-queue-dequeue-report.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p test_merge_queue_dequeue.py -v
