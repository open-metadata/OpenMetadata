# CLI E2E v2 — strangler-fig replacement for py-cli-e2e-tests.yml.
#
# Each connector lives under ingestion/tests/cli_e2e_v2/<connector>/ and
# is a self-contained pytest module (no inheritance). The matrix below
# grows as migrated connector suites are ready for CI; each connector's
# v1 entry remains until the replacement has passed its stability window.
#
# Triggers: workflow_dispatch during the v2 stabilization window. A
# schedule can be added after the connector suites are consistently green.

name: py-cli-e2e-tests-v2
on:
  workflow_dispatch:
    inputs:
      connectors:
        description: "Connectors to run (JSON array)"
        required: true
        default: '["mysql", "postgres", "bigquery", "snowflake"]'

permissions:
  id-token: write
  contents: read

jobs:
  py-cli-e2e-tests-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(inputs.connectors || '["mysql", "postgres", "bigquery", "snowflake"]') }}
    environment: test
    env:
      E2E_CONNECTOR: ${{ matrix.connector }}

    steps:
      - name: Validate connector
        shell: bash
        run: |
          case "$E2E_CONNECTOR" in
            mysql|postgres|bigquery|snowflake) ;;
            *) echo "Unsupported E2E connector" >&2; exit 1 ;;
          esac

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Openmetadata Test Environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: '3.10'

      - name: Run CLI E2E v2 tests
        id: e2e-v2-test
        if: matrix.connector != 'bigquery' && matrix.connector != 'snowflake'
        env:
          # The bundled server uses these admin credentials to mint a JWT.
          OM_ADMIN_EMAIL: admin@open-metadata.org
          OM_ADMIN_PASSWORD: admin
        run: |
          source env/bin/activate
          cd ingestion
          mkdir -p junit
          pytest -v \
            --e2e-contract-check \
            --junitxml="junit/test-results-v2-${E2E_CONNECTOR}.xml" \
            "tests/cli_e2e_v2/${E2E_CONNECTOR}"
        shell: bash

      - name: Run BigQuery CLI E2E v2 tests
        id: e2e-v2-bigquery-test
        if: matrix.connector == 'bigquery'
        env:
          OM_ADMIN_EMAIL: admin@open-metadata.org
          OM_ADMIN_PASSWORD: admin
          E2E_BQ_PROJECT_ID: ${{ secrets.TEST_BQ_PROJECT_ID }}
          E2E_BQ_PROJECT_ID2: ${{ secrets.TEST_BQ_PROJECT_ID2 }}
          E2E_BQ_PRIVATE_KEY: ${{ secrets.TEST_BQ_PRIVATE_KEY_E2E }}
          E2E_BQ_PRIVATE_KEY_ID: ${{ secrets.TEST_BQ_PRIVATE_KEY_ID }}
          E2E_BQ_CLIENT_EMAIL: ${{ secrets.TEST_BQ_CLIENT_EMAIL }}
        run: |
          source env/bin/activate
          cd ingestion
          mkdir -p junit
          pytest -v \
            --e2e-contract-check \
            -n 6 \
            --junitxml="junit/test-results-v2-${E2E_CONNECTOR}.xml" \
            "tests/cli_e2e_v2/${E2E_CONNECTOR}"
        shell: bash

      - name: Run Snowflake CLI E2E v2 tests
        id: e2e-v2-snowflake-test
        if: matrix.connector == 'snowflake'
        env:
          OM_ADMIN_EMAIL: admin@open-metadata.org
          OM_ADMIN_PASSWORD: admin
          # The same key-pair identity and E2E database the v1 Snowflake job uses. v1 drops and
          # recreates that database per test, so do not dispatch this job while v1 runs.
          E2E_SNOWFLAKE_ACCOUNT: ${{ secrets.TEST_SNOWFLAKE_ACCOUNT }}
          E2E_SNOWFLAKE_USERNAME: ${{ secrets.TEST_SNOWFLAKE_USERNAME }}
          E2E_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.TEST_SNOWFLAKE_PASSWORD_YAML }}
          E2E_SNOWFLAKE_PASSPHRASE: ${{ secrets.TEST_SNOWFLAKE_PASSPHRASE }}
          E2E_SNOWFLAKE_WAREHOUSE: ${{ secrets.TEST_SNOWFLAKE_WAREHOUSE }}
          E2E_SNOWFLAKE_DATABASE: ${{ secrets.TEST_SNOWFLAKE_DATABASE_E2E }}
        run: |
          source env/bin/activate
          cd ingestion
          mkdir -p junit
          pytest -v \
            --e2e-contract-check \
            -n 4 \
            --junitxml="junit/test-results-v2-${E2E_CONNECTOR}.xml" \
            "tests/cli_e2e_v2/${E2E_CONNECTOR}"
        shell: bash

      - name: Upload tests artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-v2-${{ matrix.connector }}
          path: ingestion/junit/test-results-v2-*.xml

      - name: Clean Up
        if: always()
        run: |
          cd ./docker/development
          docker compose down --remove-orphans
          sudo rm -rf "${PWD}/docker-volume"
