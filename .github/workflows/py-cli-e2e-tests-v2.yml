name: py-cli-e2e-tests-v2
on:
  workflow_dispatch:
    inputs:
      connectors:
        description: CLI E2E connectors as a JSON array (subset of the default list)
        required: true
        default: &default-connectors '["mysql", "postgres", "bigquery", "oracle", "snowflake", "mssql"]'
permissions:
  id-token: write
  contents: read
  packages: read
env:
  DEFAULT_CONNECTORS: *default-connectors
jobs:
  prepare-classification-models:
    permissions:
      contents: read
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      connectors: ${{ steps.connectors.outputs.connectors }}
      python-version: ${{ steps.versions.outputs.highest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/python_ci.py
            scripts/prepare_classification_models.py
            ingestion/pyproject.toml
            .github/actions/prepare-classification-models
            .github/actions/prepare-classification-model
          sparse-checkout-cone-mode: false
      - name: Select connectors
        id: connectors
        env:
          SELECTED_CONNECTORS: ${{ inputs.connectors }}
        run: python3 scripts/python_ci.py connectors --output "$GITHUB_OUTPUT"
      - name: Read Python versions
        id: versions
        run: python3 scripts/python_ci.py versions --output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prepare-classification-models

  backend:
    needs: prepare-classification-models
    uses: ./.github/workflows/reusable-build-backend.yml
    with:
      ref: ${{ github.sha }}

  ingestion-image:
    needs: prepare-classification-models
    uses: ./.github/workflows/reusable-build-ingestion.yml
    with:
      ref: ${{ github.sha }}

  py-cli-e2e-tests-v2:
    needs: [prepare-classification-models, backend, ingestion-image]
    uses: ./.github/workflows/reusable-py-cli-e2e-tests.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      python-version: ${{ needs.prepare-classification-models.outputs.python-version }}
      connectors: ${{ needs.prepare-classification-models.outputs.connectors }}
      test-suite: v2
      collect-coverage: false
