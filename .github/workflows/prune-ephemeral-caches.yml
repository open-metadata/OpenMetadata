# Delete Actions caches stranded on dead merge-queue refs.
#
# A merge-queue entry runs on gh-readonly-queue/main/pr-<n>-<sha>, which GitHub
# deletes the moment the entry merges or is dequeued. Caches saved there
# outlive the ref: unreachable by every future run (Actions scopes a cache to
# the ref that wrote it) but still charged against the repo's 10 GB LRU budget,
# where they evict the main-scoped copies that every run does restore from.
#
# Observed 2026-09-04: 11.3 GB active against a 10 GB budget, with 5.1 GB of it
# in four ~1.28 GB ingestion images on queue refs, three of them already dead.
#
# playwright-e2e-reusable.yml no longer saves from merge_group, which stops the
# Playwright assets accumulating, and setup-uv is now gated the same way (it
# does take an `enable-cache` input — the earlier note here claiming otherwise
# was wrong, and it cost 3.3 GB across 19 dead queue refs). This workflow is
# the backstop for what still cannot be gated — cache-apt-pkgs has no such
# input — and it clears whatever was stranded before those changes landed.
#
# Note the backstop alone cannot win: it runs every 30 minutes while the queue
# writes continuously, so 19 setup-uv entries came back within 19 minutes of
# run 33878696968 deleting them. Prefer gating a save over pruning it.
#
# SAFETY: a cache is deleted only when its ref no longer resolves. Entries
# still in the queue keep their caches, so an in-flight run is never forced
# into a rebuild. If the ref listing fails the job aborts without deleting —
# an empty list must never be read as "every queue ref is dead".
name: Prune ephemeral Actions caches

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it.
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-ephemeral-caches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      QUEUE_PREFIX: refs/heads/gh-readonly-queue/
    steps:
      - name: Delete caches on dead merge-queue refs
        shell: bash
        run: |
          set -euo pipefail

          # Live queue refs first. `set -e` aborts the job if this fails, so a
          # transient API error can never be mistaken for "nothing is queued".
          live=$(gh api --paginate \
            "repos/${GH_REPO}/git/matching-refs/heads/gh-readonly-queue/" \
            --jq '.[].ref' | sort -u)
          echo "live queue refs:"
          printf '%s\n' "${live:-  (none)}"

          # /actions/caches returns an object, not an array, so --paginate
          # cannot flatten it; walk the pages by hand until one comes back empty.
          caches=$(mktemp)
          truncated=no
          page=1
          while :; do
            body=$(gh api "repos/${GH_REPO}/actions/caches?per_page=100&page=${page}")
            count=$(jq '.actions_caches | length' <<<"$body")
            if [[ "$count" -eq 0 ]]; then
              break
            fi
            jq -r '.actions_caches[] | [.id, .ref, .size_in_bytes, .key] | @tsv' \
              <<<"$body" >> "$caches"
            page=$((page + 1))
            # Runaway guard. Hitting it means the listing was TRUNCATED and the
            # sweep is incomplete, which would otherwise be indistinguishable
            # from a clean one — say so rather than report a partial reclaim as
            # the whole job. 2000 entries is far past the 10 GB budget, so this
            # firing is itself the signal something else is wrong.
            if [[ "$page" -gt 20 ]]; then
              truncated=yes
              listed=$(wc -l < "$caches" | tr -d ' ')
              echo "::warning::cache listing truncated at the 20-page cap after ${listed} entries; caches beyond it were not examined and may still be stranded"
              break
            fi
          done

          deleted=0
          reclaimed=0
          kept=0
          while IFS=$'\t' read -r id ref size key; do
            [[ "$ref" == "${QUEUE_PREFIX}"* ]] || continue
            if grep -qxF "$ref" <<<"$live"; then
              kept=$((kept + 1))
              continue
            fi
            printf 'delete %s (%s MB) %s\n' "$key" "$((size / 1048576))" "$ref"
            if [[ "$DRY_RUN" != "true" ]]; then
              # A cache can be evicted between the listing and the delete;
              # that is the outcome we wanted, so do not fail the job for it.
              gh api -X DELETE "repos/${GH_REPO}/actions/caches/${id}" \
                --silent || echo "::warning::could not delete cache ${id} (${key})"
            fi
            deleted=$((deleted + 1))
            reclaimed=$((reclaimed + size))
          done < "$caches"

          {
            echo "### Ephemeral cache prune"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| dry run | \`${DRY_RUN}\` |"
            echo "| caches on live queue refs (kept) | ${kept} |"
            echo "| caches on dead queue refs (deleted) | ${deleted} |"
            echo "| reclaimed | $((reclaimed / 1048576)) MB |"
            echo "| listing truncated | \`${truncated}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
