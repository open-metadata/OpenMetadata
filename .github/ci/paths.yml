  - 'docker/development/Dockerfile'
  - 'docker/development/Dockerfile.dockerignore'
  - 'docker/docker-compose-quickstart/Dockerfile'
  - 'docker/docker-compose-quickstart/Dockerfile.dockerignore'
  - 'scripts/docker_smoke_test.sh'
  - 'openmetadata-dist/**'
  - 'conf/**'
  - 'bin/**'
