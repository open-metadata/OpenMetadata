# Area labels applied by the `Team Label` job (.github/workflows/team-labeler.yml) from the files a
# PR changes (ADR:2026-11-05-pr-labels-follow-paths-and-ci-trust-follows-org-membership).
# A PR touching several areas gets every matching label. Keys are the repository's label names.

UI:
  - changed-files:
      - any-glob-to-any-file:
          - openmetadata-ui/**
          - openmetadata-ui-core-components/**
          - tooling/**

backend:
  - changed-files:
      - any-glob-to-any-file:
          - openmetadata-service/**
          - openmetadata-spec/**
          - openmetadata-clients/**
          - openmetadata-dist/**
          - openmetadata-sdk/**
          - openmetadata-mcp/**
          - openmetadata-integration-tests/**
          - openmetadata-shaded-deps/**
          - openmetadata-k8s-operator/**
          - common/**
          - bootstrap/**
          - conf/**
          - bin/**
          - pom.xml

Ingestion:
  - changed-files:
      - any-glob-to-any-file:
          - ingestion/**
          - openmetadata-airflow-apis/**

devops:
  - changed-files:
      - any-glob-to-any-file:
          - docker/**
          - .github/**
          - openmetadata-k8s-operator/**
          - .devcontainer/**
          - Makefile

spec:
  - changed-files:
      - any-glob-to-any-file:
          - openmetadata-spec/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
