name: Validate CI configuration
description: Check JSON, YAML, and workflow contracts.
runs:
  using: composite
  steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.10'

    - name: Install Ubuntu related dependencies
      shell: bash
      run: |
        sudo apt-get update  && sudo apt-get install -y libsasl2-dev unixodbc-dev python3-venv

    - name: Install Python & Openmetadata related dependencies
      shell: bash
      run: |
        python3 -m venv env
        source env/bin/activate
        pip install pyyaml==6.0.3 pytest==9.1.1

    - name: Verify PR workflow security
      shell: bash
      run: |
        source env/bin/activate
        python .github/scripts/check_pr_workflow_security.py
        python -m pytest .github/scripts/tests/test_pr_workflow_security.py -q

    # Speed settings that are easy to undo by accident (cache saves on PRs, disk purges, worker counts).
    - name: Verify CI speed guards
      shell: bash
      run: |
        source env/bin/activate
        python -m pytest .github/scripts/tests/test_ci_speed_*.py .github/scripts/tests/test_summarize_surefire.py .github/scripts/tests/test_prune_ghcr_package.py -q

    # Add back linting once we have 10/10 on main
    - name: Code style check
      id: style
      continue-on-error: true
      shell: bash
      run: |
        source env/bin/activate
        pip install pyyaml
        ./scripts/validate_json_yaml.sh

    - name: JSON/Yaml validation failed
      if: steps.style.outcome != 'success'
      shell: bash
      run: |
        echo "::error title=JSON/YAML validation failed::The Code style check step lists the invalid files. Reproduce locally with ./scripts/validate_json_yaml.sh."
        exit 1
