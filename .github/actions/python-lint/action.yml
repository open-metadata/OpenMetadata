name: Lint Python
description: Run formatting and lint with the locked style tools.
inputs:
  python-version:
    description: Python interpreter for the style tools.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        version-file: ingestion/pyproject.toml
        enable-cache: false
    - name: Check formatting and lint
      run: make py_format_check
      shell: bash
