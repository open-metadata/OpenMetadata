name: Load backend image
description: Download, verify, and tag the backend image built for this workflow run.
runs:
  using: composite
  steps:
    - name: Download backend image
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ci-backend-image
        path: ${{ runner.temp }}
    - name: Load backend image
      run: bash .github/scripts/ci_backend_image.sh load "$RUNNER_TEMP/ci-backend.tar.zst"
      shell: bash
