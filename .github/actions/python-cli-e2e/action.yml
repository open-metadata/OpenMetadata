name: Run connector E2E
description: Run a connector through Nox and upload its subprocess coverage.
inputs:
  connector:
    description: connector
    required: true
  python-version:
    description: python-version
    required: true
runs:
  using: composite
  steps:
    - name: Run connector tests
      id: e2e-test
      shell: bash
      env:
        E2E_TEST: ${{ inputs.connector }}
      run: |
        set -o pipefail
        source env/bin/activate
        cd ingestion
        nox --no-venv -s cli-e2e -- "$E2E_TEST" 2>&1 | tee cli-e2e-test-run.log
    - name: Upload coverage artifact for CLI E2E tests
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cli-coverage-${{ inputs.python-version }}-${{ inputs.connector }}
        path: ingestion/.coverage.${{ inputs.connector }}
        include-hidden-files: true
