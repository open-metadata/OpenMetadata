name: UI browser tests setup
description: Node, ANTLR, yarn deps and Playwright Chromium for the Vitest browser suite.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: openmetadata-ui/src/main/resources/ui/.nvmrc
    - name: Restore Yarn dependencies
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/yarn
        key: yarn-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}
        restore-keys: |
          yarn-pkg-cache-${{ runner.os }}-
    # The UI's postinstall needs the antlr4 CLI. `make install_antlr_cli` tries
    # apt first, which took ~10 min on slow runners; use the Makefile's pinned
    # jar (same version and checksum) from a cache instead.
    - name: Cache ANTLR CLI
      id: antlr-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/antlr-cli
        key: antlr-cli-4.9.2-bb117b1476691dc2915a318efd36f8957c0ad93447fb1dac01107eb15fe137cd
    - name: Install ANTLR CLI
      if: steps.antlr-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/antlr-cli
        jar=$(mktemp)
        curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
          --output "$jar" \
          https://repo1.maven.org/maven2/org/antlr/antlr4/4.9.2/antlr4-4.9.2-complete.jar
        echo "bb117b1476691dc2915a318efd36f8957c0ad93447fb1dac01107eb15fe137cd  $jar" | sha256sum --check
        { printf '%s\n' '#!/usr/bin/java -jar'; cat "$jar"; } > ~/.cache/antlr-cli/antlr4
        chmod 755 ~/.cache/antlr-cli/antlr4
    - name: Put ANTLR CLI on PATH
      shell: bash
      run: |
        echo "$HOME/.cache/antlr-cli" >> "$GITHUB_PATH"
        "$HOME/.cache/antlr-cli/antlr4" 2>&1 | grep -q 'Version 4.9.2'
    - name: Install Yarn packages
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: yarn install --frozen-lockfile
    # Chromium is cached per Playwright version; the runner image already has
    # headless Chromium's system libraries, so no `--with-deps` (its apt fetch
    # from a slow mirror once cost a run ~10 minutes).
    - name: Playwright version
      id: playwright
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Chromium
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: npx playwright install chromium
