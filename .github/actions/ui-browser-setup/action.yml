name: UI browser tests setup
description: UI setup plus Playwright Chromium for the Vitest browser suite.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ui
    # Chromium is cached per Playwright version; the runner image already has
    # headless Chromium's system libraries, so no `--with-deps` (its apt fetch
    # from a slow mirror once cost a run ~10 minutes).
    - name: Playwright version
      id: playwright
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Restore Chromium
      id: chromium-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: npx playwright install chromium
    - name: Save Chromium
      if: steps.chromium-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
