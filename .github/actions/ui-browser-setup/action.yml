name: UI browser tests setup
description: Node, ANTLR, yarn deps and Playwright Chromium for the Vitest browser suite.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: openmetadata-ui/src/main/resources/ui/.nvmrc
    - name: Restore Yarn dependencies
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/yarn
        key: yarn-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}
        restore-keys: |
          yarn-pkg-cache-${{ runner.os }}-
    - name: Install Antlr4 CLI
      shell: bash
      run: sudo make install_antlr_cli
    - name: Install Yarn packages
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: yarn install --frozen-lockfile
    # Chromium is cached per Playwright version; the runner image already has
    # headless Chromium's system libraries, so no `--with-deps` (its apt fetch
    # from a slow mirror once cost a run ~10 minutes).
    - name: Playwright version
      id: playwright
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Chromium
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: npx playwright install chromium
