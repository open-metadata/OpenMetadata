name: UI browser test selection
description: >-
  Selects the browser test files a change executes, from the impact map of the
  latest passing run on code that reached main, and plans the shards. Uploads
  the selection as the browser-selection artifact for sharded callers.
outputs:
  mode:
    description: all, selected or none.
    value: ${{ steps.plan.outputs.mode }}
  summary:
    description: Why this mode was chosen.
    value: ${{ steps.plan.outputs.summary }}
  shards:
    description: JSON list of shard numbers.
    value: ${{ steps.plan.outputs.shards }}
  shard-count:
    description: Number of shards.
    value: ${{ steps.plan.outputs.shard-count }}
  core:
    description: Whether core components changed.
    value: ${{ steps.changes.outputs.core }}
runs:
  using: composite
  steps:
    - name: Changed areas
      id: changes
      env:
        UI_DIR: openmetadata-ui/src/main/resources/ui
        CORE_DIR: openmetadata-ui-core-components/src/main/resources/ui
        # What the scheduled run must see changed since the last full run to run
        # at all. Callers select pull requests and merge-queue entries themselves.
        UI_PATHS: "openmetadata-ui/src/main/resources/ui/ openmetadata-ui-core-components/src/main/resources/ui/ .github/workflows/ui-browser-tests.yml .github/actions/ui-browser- .github/actions/setup-ui/"
        BASE: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "${{ github.event_name }}" = "merge_group" ]; then
          git fetch --no-tags --depth=1 origin "$BASE"
        fi
        if [ "${{ github.event_name }}" = "schedule" ]; then
          # A scheduled run compares against the last passing scheduled or
          # manual run, and is skipped when no UI file changed since.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ui-browser-tests.yml/runs?branch=main&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty')
          # Comparing the two trees needs only the two commits, not the history between.
          if [ -n "$last" ] && git fetch --no-tags --depth=1 origin "$last"; then
            changed=$(git diff --name-only "$last" HEAD)
          else
            changed="$UI_DIR/"
          fi
        else
          changed=$(git diff --name-only "$BASE" HEAD)
        fi
        ui=false
        for prefix in $UI_PATHS; do
          if grep -q "^$prefix" <<< "$changed"; then ui=true; fi
        done
        core=false
        if grep -q "^$CORE_DIR/" <<< "$changed"; then core=true; fi
        { echo "ui=$ui"; echo "core=$core"; } >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/setup-node@v5
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      with:
        node-version-file: openmetadata-ui/src/main/resources/ui/.nvmrc
    # Only esbuild is needed to read the import graph; the full UI install
    # builds core components first.
    - name: Install esbuild
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      env:
        UI_DIR: openmetadata-ui/src/main/resources/ui
      run: |
        version=$(awk '/^"?esbuild@/ {found=1} found && /^  version / {gsub(/"/, "", $2); print $2; exit}' "$UI_DIR/yarn.lock")
        mkdir -p "$RUNNER_TEMP/esbuild"
        cd "$RUNNER_TEMP/esbuild"
        echo '{"private": true}' > package.json
        yarn add --silent "esbuild@$version"
        echo "ESBUILD_PATH=$RUNNER_TEMP/esbuild/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
      shell: bash
    # The map travels as an artifact of the latest passing run on code that
    # reached main: a scheduled or manual run on main, or a merge-queue entry.
    # A pull request's map reflects code that may never merge (or a fork's
    # unreviewed code) and could hide tests from every later pull request.
    - name: Download the impact map from the latest full run
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      continue-on-error: true
      env:
        UI_DIR: openmetadata-ui/src/main/resources/ui
        GH_TOKEN: ${{ github.token }}
      run: |
        # Queried per event, so pull-request runs cannot push a good map off
        # the list while main's full run stays red; newest first across them.
        # Merge-queue entries run this workflow from ci-merge-queue.yml.
        runs=$(for query in "ui-browser-tests.yml event=schedule&branch=main" "ui-browser-tests.yml event=workflow_dispatch&branch=main" "ci-merge-queue.yml event=merge_group"; do
          read -r workflow filter <<< "$query"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=success&per_page=50&$filter" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\") | \"\\(.created_at) \\(.id)\""
        done | sort -r | cut -d' ' -f2)
        for run in $runs; do
          if gh run download "$run" -R "$GITHUB_REPOSITORY" -n browser-impact-map -D "$UI_DIR" 2>/dev/null; then
            echo "Impact map from run $run" >> "$GITHUB_STEP_SUMMARY"
            break
          fi
        done
      shell: bash
    - name: Test the selection script
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      working-directory: openmetadata-ui/src/main/resources/ui
      run: |
        node --test scripts/select-browser-tests.test.mjs scripts/browser-tests-report.test.mjs
      shell: bash
    - name: Select tests
      id: plan
      working-directory: openmetadata-ui/src/main/resources/ui
      env:
        # At most this many runners; with ~1,070 tests three ran past 10 min each.
        SHARDS: 5
        # Test files per runner when only some run (130 files over 5 runners).
        FILES_PER_SHARD: 26
        BASE: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
      run: |
        if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.changes.outputs.ui }}" = "false" ]; then
          echo '{"mode": "none", "reason": "no UI change since the last full run", "tests": [], "uncovered": []}' > selection.json
        elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
          # A pull request's merge commit has its base at HEAD^1; a merge-queue
          # group may batch several pull requests, so it diffs from the group's base.
          node scripts/select-browser-tests.mjs --map impact-map.json --base "$BASE" --out selection.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo '{"mode": "all", "reason": "full run on ${{ github.event_name }}", "tests": [], "uncovered": []}' > selection.json
        fi
        mode=$(jq -r .mode selection.json)
        count=$(jq '.tests | length' selection.json)
        shard_count=0
        if [ "$mode" = "all" ]; then
          shard_count=$SHARDS
        elif [ "$mode" = "selected" ]; then
          shard_count=$(( (count + FILES_PER_SHARD - 1) / FILES_PER_SHARD ))
          shard_count=$(( shard_count > SHARDS ? SHARDS : shard_count ))
        fi
        {
          echo "mode=$mode"
          echo "summary=$(jq -r .reason selection.json)"
          echo "shard-count=$shard_count"
          echo "shards=$(jq -cn --argjson n "$shard_count" '[range(1; $n + 1)]')"
        } >> "$GITHUB_OUTPUT"
      shell: bash
    # A merge-queue entry carries its map along, to update it for the tests it ran.
    - uses: actions/upload-artifact@v7
      with:
        name: browser-selection
        path: |
          openmetadata-ui/src/main/resources/ui/selection.json
          ${{ github.event_name == 'merge_group' && 'openmetadata-ui/src/main/resources/ui/impact-map.json' || '' }}
        retention-days: 1
    # When nothing runs, the report job is skipped; say why in the summary.
    - name: Report that no browser test ran
      if: github.event_name == 'pull_request' && steps.plan.outputs.mode == 'none'
      working-directory: openmetadata-ui/src/main/resources/ui
      run: |
        {
          echo '### UI browser tests'
          echo
          echo "**Ran:** none ($(jq -r .reason selection.json))"
          uncovered=$(jq -r '.uncovered[] | "- `\(.)`"' selection.json)
          if [ -n "$uncovered" ]; then
            echo
            echo '<details><summary>Changed files no browser test loads</summary>'
            echo
            echo "$uncovered"
            echo
            echo '</details>'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
