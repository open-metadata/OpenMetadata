name: Authorize PR
description: Wait for the trusted Team Label check and verify safe-to-test authorization

inputs:
  ref:
    description: Commit ref whose Team Label check must be observed
    required: true
  pull-request-number:
    description: Pull request number to validate
    required: true
  repo-token:
    description: GitHub token used to inspect the check and labels
    required: true
  wait-interval:
    description: Seconds between Team Label check polls
    required: false
    default: '90'

runs:
  using: composite
  steps:
    - name: Wait for the labeler
      uses: lewagon/wait-on-check-action@v1.7.0
      with:
        ref: ${{ inputs.ref }}
        check-name: Team Label
        repo-token: ${{ inputs.repo-token }}
        wait-interval: ${{ inputs.wait-interval }}

    - name: Verify PR labels
      uses: jesusvasquez333/verify-pr-label-action@v1.4.0
      with:
        github-token: ${{ inputs.repo-token }}
        valid-labels: 'safe to test'
        pull-request-number: ${{ inputs.pull-request-number }}
        disable-reviews: true
