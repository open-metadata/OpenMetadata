name: Collect diagnostics and clean up
description: Collect runner diagnostics and stop the test stack
inputs:
  artifact-name:
    description: artifact-name
    required: true
runs:
  using: composite
  steps:
    - name: Collect runner and service diagnostics
      continue-on-error: true
      run: bash .github/scripts/python_ci_diagnostics.sh
      shell: bash
      if: ${{ always() && (job.status == 'failure' || job.status == 'cancelled') }}
    - name: Upload runner and service diagnostics
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/python-ci-diagnostics/
        if-no-files-found: warn
        retention-days: 14
        compression-level: 1
      if: ${{ always() && (job.status == 'failure' || job.status == 'cancelled') }}
    - name: Clean Up
      continue-on-error: true
      run: |
        cd ./docker/development
        docker compose down --remove-orphans || true
        sudo rm -rf "${PWD}/docker-volume"
      if: ${{ always() }}
      shell: bash
