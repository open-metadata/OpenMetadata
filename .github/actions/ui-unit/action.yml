name: UI unit tests
description: >-
  One shard of the Jest suite, without coverage (coverage is collected
  nightly). Expects the caller to have run ./.github/actions/setup-ui.
inputs:
  shard:
    description: Jest --shard value such as "2/4".
    required: true
runs:
  using: composite
  steps:
    - name: Run SSO dev server tests
      if: ${{ startsWith(inputs.shard, '1/') }}
      working-directory: openmetadata-ui/src/main/resources/ui
      run: node --test scripts/sso-dev-server.test.mjs
      shell: bash
    - name: Run unit tests
      working-directory: openmetadata-ui/src/main/resources/ui
      env:
        SHARD: ${{ inputs.shard }}
      # jest.config.js keeps '50%' for laptops; on the 4-vCPU hosted runner that
      # is only 2 workers, so CI asks for all 4. --silent plus the summary and
      # github-actions reporters keep the log to failures and a summary.
      run: yarn jest --silent --reporters=summary --reporters=github-actions --maxWorkers=4 --shard="$SHARD"
      shell: bash
