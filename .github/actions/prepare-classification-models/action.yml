name: Prepare classification models
description: Sequentially restore or prepare all four declared model cache archives
inputs:
  project:
    description: Directory containing the project metadata to prepare
    default: ingestion
  save-cache:
    description: Save cache misses in the default-branch warmer
    default: 'false'
runs:
  using: composite
  steps:
    - id: discover
      shell: bash
      env:
        MODEL_PROJECT: ${{ inputs.project }}
      run: |
        project=$(python3 scripts/prepare_classification_models.py discover --project "$MODEL_PROJECT")
        jq -e '.include | length == 4' <<< "$project" >/dev/null
        {
          echo "python=$(jq -r '."discovery-python"' <<< "$project")"
          echo "uv=$(jq -r '.include[0]."uv-version"' <<< "$project")"
          echo "models=$(jq -c '.include' <<< "$project")"
        } >> "$GITHUB_OUTPUT"
        rm -rf "$RUNNER_TEMP/classification-models"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ steps.discover.outputs.python }}
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: ${{ steps.discover.outputs.uv }}
        enable-cache: false
    - name: Prepare model 1
      uses: ./.github/actions/prepare-classification-model
      with:
        model: ${{ toJSON(fromJSON(steps.discover.outputs.models)[0]) }}
        save-cache: ${{ inputs.save-cache }}
    - name: Prepare model 2
      uses: ./.github/actions/prepare-classification-model
      with:
        model: ${{ toJSON(fromJSON(steps.discover.outputs.models)[1]) }}
        save-cache: ${{ inputs.save-cache }}
    - name: Prepare model 3
      uses: ./.github/actions/prepare-classification-model
      with:
        model: ${{ toJSON(fromJSON(steps.discover.outputs.models)[2]) }}
        save-cache: ${{ inputs.save-cache }}
    - name: Prepare model 4
      uses: ./.github/actions/prepare-classification-model
      with:
        model: ${{ toJSON(fromJSON(steps.discover.outputs.models)[3]) }}
        save-cache: ${{ inputs.save-cache }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: inputs.save-cache != 'true'
      with:
        name: classification-models
        path: ${{ runner.temp }}/classification-models
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
