name: Prepare classification models
description: Sequentially restore or prepare the declared model cache archives

inputs:
  models:
    description: Discovered model records; empty selects the checked-out project
    default: ''
  save-cache:
    description: Save cache misses in the default-branch warmer
    default: 'false'

runs:
  using: composite
  steps:
    - id: discover
      shell: bash
      env:
        REQUESTED_MODELS: ${{ inputs.models }}
      run: |
        project=$(python3 scripts/prepare_classification_models.py discover --project ingestion)
        echo "python=$(jq -r '."discovery-python"' <<< "$project")" >> "$GITHUB_OUTPUT"
        echo "uv=$(jq -r '.include[0]."uv-version"' <<< "$project")" >> "$GITHUB_OUTPUT"
        echo "models=${REQUESTED_MODELS:-$(jq -c '.include' <<< "$project")}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ steps.discover.outputs.python }}
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: ${{ steps.discover.outputs.uv }}
        enable-cache: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '24'
    - name: Install cache toolkit
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/classification-model-toolkit"
        cp "$GITHUB_ACTION_PATH"/package*.json "$RUNNER_TEMP/classification-model-toolkit/"
        cd "$RUNNER_TEMP/classification-model-toolkit"
        npm ci --ignore-scripts --no-audit --no-fund
    - name: Prepare model archives sequentially
      shell: bash
      env:
        NODE_PATH: ${{ runner.temp }}/classification-model-toolkit/node_modules
        MODELS: ${{ steps.discover.outputs.models }}
        UV_VERSION: ${{ steps.discover.outputs.uv }}
        ARCHIVE_DIRECTORY: ${{ runner.temp }}/classification-models
        SAVE_CACHE: ${{ inputs.save-cache }}
      run: node "$GITHUB_ACTION_PATH/prepare.cjs"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: inputs.save-cache != 'true'
      with:
        name: classification-models
        path: ${{ runner.temp }}/classification-models
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
