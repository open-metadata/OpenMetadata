name: Run Kubernetes operator unit tests
description: Run Kubernetes operator unit tests.
runs:
  using: composite
  steps:
    - name: Hydrate Maven dependencies
      id: maven-cache
      uses: ./.github/actions/hydrate-maven-cache

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Build k8s-operator dependencies
      shell: bash
      run: |
        mvn -B -T 1C clean install -pl openmetadata-k8s-operator -am -DskipTests

    - name: Run k8s-operator unit tests
      id: k8s-tests
      continue-on-error: true
      shell: bash
      run: |
        mvn -B test -pl openmetadata-k8s-operator

    - name: Summarize k8s-operator unit tests
      if: ${{ always() }}
      shell: bash
      run: |
        python3 .github/scripts/summarize_surefire.py \
          --title "K8s Operator Unit Tests" \
          --checkstyle-outcome "skipped" \
          --unit-tests-outcome "${{ steps.k8s-tests.outcome }}" \
          --report-glob "openmetadata-k8s-operator/target/surefire-reports/TEST-*.xml" \
          --emit-annotations

    - name: Save Maven dependencies
      if: github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ~/.m2
        key: ${{ steps.maven-cache.outputs.cache-primary-key }}

    - name: Upload surefire reports
      if: ${{ steps.k8s-tests.outcome == 'failure' && hashFiles('openmetadata-k8s-operator/target/surefire-reports/TEST-*.xml') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: k8s-operator-surefire-reports
        path: openmetadata-k8s-operator/target/surefire-reports/

    - name: Enforce k8s-operator outcome
      if: ${{ steps.k8s-tests.outcome == 'failure' }}
      shell: bash
      run: exit 1
