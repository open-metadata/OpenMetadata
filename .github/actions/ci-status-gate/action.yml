name: CI status gate
description: >-
  Fail unless every job in `needs` ended with its expected result. A job
  expected to run must succeed, one not selected must be skipped, and the two
  lists must name the same jobs, so a dependency added to `needs` without an
  expectation (or the reverse) fails the gate.
inputs:
  needs:
    description: The caller's `toJSON(needs)`.
    required: true
  expected:
    description: JSON object mapping each job id to "success" or "skipped".
    required: true
runs:
  using: composite
  steps:
    - name: Verify selected workloads
      env:
        NEEDS_JSON: ${{ inputs.needs }}
        EXPECTED_RESULTS: ${{ inputs.expected }}
      run: |
        jq -r -n --argjson needs "$NEEDS_JSON" --argjson expected "$EXPECTED_RESULTS" '
          $expected | to_entries[] | "\(.key): expected \(.value), got \($needs[.key].result // "missing")"
        ' || true
        jq -e -n --argjson needs "$NEEDS_JSON" --argjson expected "$EXPECTED_RESULTS" '
          $expected | length > 0 and
          (keys == ($needs | keys)) and
          all(to_entries[]; . as $job |
            ($job.value == "success" or $job.value == "skipped") and
            $needs[$job.key].result == $job.value)
        '
      shell: bash
