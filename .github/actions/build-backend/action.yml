name: Build backend
description: Set up Java, restore Maven dependencies, and build the requested modules.
inputs:
  maven-args:
    description: Whitespace-separated Maven build arguments.
    default: -DskipTests clean package
runs:
  using: composite
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        java-version: '21'
        distribution: temurin
    - name: Restore Maven dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build
      env:
        BACKEND_MAVEN_ARGS: ${{ inputs.maven-args }}
      run: |
        read -r -a args <<< "$BACKEND_MAVEN_ARGS"
        mvn "${args[@]}"
      shell: bash
