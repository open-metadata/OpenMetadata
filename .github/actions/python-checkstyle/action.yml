name: Python checkstyle
description: Run the repository Python style gate with Ruff only
inputs:
  python-version:
    description: Minimum supported Python
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: false
    - name: Install Ruff and check style
      shell: bash
      run: |
        uv venv env --python "${{ inputs.python-version }}"
        uv pip install --python env/bin/python "ruff~=0.15.12"
        source env/bin/activate
        make py_format_check
