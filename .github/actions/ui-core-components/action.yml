name: UI core components tests
description: Installs, tests and builds openmetadata-ui-core-components. Expects Node set up.
runs:
  using: composite
  steps:
    - name: Install
      working-directory: openmetadata-ui-core-components/src/main/resources/ui
      run: |
        for attempt in 1 2 3; do
          yarn install --frozen-lockfile --network-timeout 120000 && exit 0
          echo "yarn install failed (attempt $attempt), retrying"
          sleep 15
        done
        exit 1
      shell: bash
    - name: Test
      working-directory: openmetadata-ui-core-components/src/main/resources/ui
      run: yarn test
      shell: bash
    - name: Build
      working-directory: openmetadata-ui-core-components/src/main/resources/ui
      run: yarn build
      shell: bash
