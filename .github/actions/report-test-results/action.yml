name: Report test results
description: Classify test outcomes and upload reports and logs, including when setup fails.
inputs:
  step-outcome:
    description: Outcome of the test execution step
    required: true
  exit-code-file:
    description: File containing the raw test process exit code, when available
    required: true
  test-profile:
    description: Test profile recorded in the outcome
    required: true
  artifact-name:
    description: Name of the uploaded result artifact and reported lane
    required: true
runs:
  using: composite
  steps:
    - name: Classify test outcome
      if: ${{ always() }}
      env:
        TEST_LANE: ${{ inputs.artifact-name }}
        TEST_PROFILE: ${{ inputs.test-profile }}
        TEST_STEP_OUTCOME: ${{ job.status == 'cancelled' && 'cancelled' || inputs.step-outcome }}
        EXIT_CODE_FILE: ${{ inputs.exit-code-file }}
      run: |
        test_exit_code=""
        if [[ -s "$EXIT_CODE_FILE" ]]; then
          read -r test_exit_code < "$EXIT_CODE_FILE"
        fi
        python3 .github/scripts/classify_test_outcome.py \
          --step-outcome "$TEST_STEP_OUTCOME" --exit-code "$test_exit_code" \
          --report-glob 'ingestion/junit/test-results-*.xml' \
          --diagnostic-glob 'ingestion/*-test-run.log' \
          --output ingestion/ci-diagnostics/outcome.json
      shell: bash
    - name: Upload test results
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ingestion/junit/
          ingestion/ci-diagnostics/outcome.json
          ingestion/*-test-run.log
          ingestion/*-test-exit-code.txt
        if-no-files-found: warn
        retention-days: 14
        compression-level: 1
