name: Record test evidence for dequeue attribution
description: Save executed Java tests and their revision for an exact-base comparison.
inputs:
  check-name:
    description: The displayed Actions job name.
    required: true
  suite:
    description: Maven profiles executed by this job.
    required: true
  reports:
    description: Newline-separated JUnit XML globs.
    required: true
runs:
  using: composite
  steps:
    - name: Record test results and revision
      shell: bash
      env:
        CHECK_NAME: ${{ inputs.check-name }}
        SUITE: ${{ inputs.suite }}
        REPORTS: ${{ inputs.reports }}
      run: |
        python3 .github/scripts/merge_queue_evidence.py record \
          --job "$CHECK_NAME" --suite "$SUITE" --reports "$REPORTS" \
          --output "$RUNNER_TEMP/ci-test-evidence/evidence.json"
    - name: Upload test evidence
      uses: actions/upload-artifact@v7
      with:
        name: ci-test-evidence-${{ inputs.check-name }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-test-evidence/evidence.json
        retention-days: 7
