name: Upload artifact with bounded recovery
description: Retry immutable files under a fresh name after a failed upload
inputs:
  name:
    description: Artifact name
    default: ""
    required: false
  path:
    description: Files to upload
    default: ""
    required: false
  retention-days:
    description: Retention
    default: "1"
    required: false
  compression-level:
    description: Compression level
    default: "6"
    required: false
  if-no-files-found:
    description: Missing files policy
    default: "error"
    required: false
  overwrite:
    description: Replace an existing finalized artifact
    default: "false"
    required: false
runs:
  using: composite
  steps:
  - id: primary
    uses: actions/upload-artifact@v6
    continue-on-error: true
    with:
      name: ${{ inputs.name }}
      path: ${{ inputs.path }}
      retention-days: ${{ inputs.retention-days }}
      compression-level: ${{ inputs.compression-level }}
      if-no-files-found: ${{ inputs.if-no-files-found }}
      overwrite: ${{ inputs.overwrite }}
  - name: Back off before retrying transport
    if: ${{ !cancelled() && steps.primary.outcome == 'failure' }}
    shell: bash
    run: sleep 5
  - id: retry
    if: ${{ !cancelled() && steps.primary.outcome == 'failure' }}
    uses: actions/upload-artifact@v6
    with:
      name: ${{ inputs.name }}-retry
      path: ${{ inputs.path }}
      retention-days: ${{ inputs.retention-days }}
      compression-level: ${{ inputs.compression-level }}
      if-no-files-found: ${{ inputs.if-no-files-found }}
      overwrite: ${{ inputs.overwrite }}
