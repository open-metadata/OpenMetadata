name: Run Python tests
description: Run a Nox test suite, retain its exit code, and optionally upload coverage.
inputs:
  suite:
    description: suite
    required: true
  nox-args:
    description: Whitespace-separated pytest arguments forwarded to Nox.
    default: ''
  collect-coverage:
    description: collect-coverage
    default: 'false'
  coverage-name:
    description: coverage-name
    required: true
runs:
  using: composite
  steps:
    - name: Run Python suite
      id: tests
      env:
        SUITE: ${{ inputs.suite }}
        NOX_ARGS: ${{ inputs.nox-args }}
      run: |
        source env/bin/activate
        cd ingestion
        read -r -a args <<< "$NOX_ARGS"
        set +e
        nox --no-venv -s "${SUITE}-tests" -- "${args[@]}" 2>&1 | tee "${SUITE}-test-run.log"
        test_exit_code=${PIPESTATUS[0]}
        echo "$test_exit_code" > "${SUITE}-test-exit-code.txt"
        exit "$test_exit_code"
      shell: bash
    - name: Upload coverage artifact
      if: ${{ inputs.collect-coverage == 'true' && !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.coverage-name }}
        path: ingestion/.coverage
        include-hidden-files: true
