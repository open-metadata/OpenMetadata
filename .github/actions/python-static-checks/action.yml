name: Run Python static checks
description: Run formatting, lint, and optional type checks with locked tools.
inputs:
  python-version:
    description: Python interpreter for the checks.
    required: true
  check-types:
    description: Run ingestion type checks in addition to formatting and lint.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-python
      with:
        python-version: ${{ inputs.python-version }}
    - name: Check formatting and lint
      run: make py_format_check
      shell: bash
    - uses: ./.github/actions/prepare-python-build
      if: inputs.check-types == 'true'
    - name: Check types
      id: types
      if: inputs.check-types == 'true'
      env:
        PYTHON_VERSIONS: ${{ inputs.python-version }}
      run: |
        set -o pipefail
        make static-checks 2>&1 | tee ingestion/static-checks-run.log
      shell: bash
    - name: Upload static check log
      if: ${{ !cancelled() && steps.types.outcome == 'failure' && hashFiles('ingestion/static-checks-run.log') != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: py-static-checks
        path: ingestion/static-checks-run.log
        if-no-files-found: warn
        retention-days: 14
