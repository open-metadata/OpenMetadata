name: Check Python types
description: Run basedpyright with the locked typing profile.
inputs:
  python-version:
    description: python-version
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare-python-environment
      with:
        python-version: ${{ inputs.python-version }}
        profile: types
    - name: Check types
      env:
        PYTHON_VERSIONS: ${{ inputs.python-version }}
      run: |
        set -o pipefail
        make static-checks 2>&1 | tee ingestion/static-checks-run.log
      shell: bash
    - name: Upload static check log
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: py-static-checks
        path: ingestion/static-checks-run.log
        if-no-files-found: warn
        retention-days: 14
