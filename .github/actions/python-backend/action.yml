name: Build and upload the backend distribution
description: Build and upload the backend distribution
runs:
  using: composite
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        java-version: '21'
        distribution: temurin
    - name: Restore Maven dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build backend distribution
      run: mvn -DskipTests -DonlyBackend clean package -pl openmetadata-dist -am
      shell: bash
    - name: Upload backend distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: openmetadata-backend-distribution
        path: openmetadata-dist/target/openmetadata-*.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
