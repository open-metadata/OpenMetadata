name: UI setup
description: >-
  Node, the cached ANTLR CLI and the UI's installed dependencies, the setup every
  UI job shares. The installed node_modules of the UI and core components, and
  core components' built dist, come from caches that only runs on main save, so
  most jobs skip `yarn install` and the core build. A lockfile or package.json
  change misses the node_modules cache and installs as before; a core-components
  source change misses only the dist cache and rebuilds core (about 10 s).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: openmetadata-ui/src/main/resources/ui/.nvmrc
    # Keyed on everything that decides what `yarn install` produces. Pull
    # requests and queue entries only restore: saving there would put a copy per
    # ref against the shared cache budget and evict main's entries.
    - name: Cache keys
      id: keys
      shell: bash
      run: |
        echo "deps=ui-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.yarnrc.yml', 'openmetadata-ui/src/main/resources/ui/.nvmrc', 'openmetadata-ui/src/main/resources/ui/package.json', 'openmetadata-ui/src/main/resources/ui/yarn.lock', 'openmetadata-ui-core-components/src/main/resources/ui/package.json', 'openmetadata-ui-core-components/src/main/resources/ui/yarn.lock') }}" >> "$GITHUB_OUTPUT"
        echo "dist=ui-core-dist-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/.nvmrc', 'openmetadata-ui-core-components/src/main/resources/ui/package.json', 'openmetadata-ui-core-components/src/main/resources/ui/yarn.lock', 'openmetadata-ui-core-components/src/main/resources/ui/src/**', 'openmetadata-ui-core-components/src/main/resources/ui/*.ts', 'openmetadata-ui-core-components/src/main/resources/ui/*.json') }}" >> "$GITHUB_OUTPUT"
    - name: Restore installed UI dependencies
      id: deps
      uses: actions/cache/restore@v6
      with:
        path: |
          openmetadata-ui/src/main/resources/ui/node_modules
          openmetadata-ui/src/main/resources/ui/.yarn/install-state.gz
          openmetadata-ui-core-components/src/main/resources/ui/node_modules
          openmetadata-ui-core-components/src/main/resources/ui/.yarn/install-state.gz
        key: ${{ steps.keys.outputs.deps }}
    - name: Restore Yarn dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn4-pkg-cache-${{ runner.os }}-${{ hashFiles('openmetadata-ui/src/main/resources/ui/yarn.lock') }}
        restore-keys: |
          yarn4-pkg-cache-${{ runner.os }}-
    # The UI's postinstall needs the antlr4 CLI. `make install_antlr_cli` tries
    # apt first, which took ~10 min on slow runners; use the Makefile's pinned
    # jar (same version and checksum) from a cache instead.
    # Pull requests only restore caches; merge-queue and manual runs save them.
    - name: Restore ANTLR CLI
      id: antlr-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/antlr-cli
        key: antlr-cli-4.9.2-bb117b1476691dc2915a318efd36f8957c0ad93447fb1dac01107eb15fe137cd
    - name: Install ANTLR CLI
      if: steps.antlr-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/antlr-cli
        jar=$(mktemp)
        sum="bb117b1476691dc2915a318efd36f8957c0ad93447fb1dac01107eb15fe137cd  $jar"
        # Google's Central mirror first: repo1 throttles shared CI IPs with 429s (see Makefile install_antlr_cli).
        for base in https://maven-central.storage-download.googleapis.com/maven2 https://repo1.maven.org/maven2; do
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "$jar" "$base/org/antlr/antlr4/4.9.2/antlr4-4.9.2-complete.jar" \
            && echo "$sum" | sha256sum --check && break
        done
        echo "$sum" | sha256sum --check
        { printf '%s\n' '#!/usr/bin/java -jar'; cat "$jar"; } > ~/.cache/antlr-cli/antlr4
        chmod 755 ~/.cache/antlr-cli/antlr4
    - name: Save ANTLR CLI
      if: steps.antlr-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/antlr-cli
        key: antlr-cli-4.9.2-bb117b1476691dc2915a318efd36f8957c0ad93447fb1dac01107eb15fe137cd
    - name: Put ANTLR CLI on PATH
      shell: bash
      run: |
        echo "$HOME/.cache/antlr-cli" >> "$GITHUB_PATH"
        "$HOME/.cache/antlr-cli/antlr4" 2>&1 | grep -q 'Version 4.9.2'
    - name: Install Yarn packages
      if: steps.deps.outputs.cache-hit != 'true'
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      # The registry occasionally answers 502; retry rather than fail the job.
      run: |
        for attempt in 1 2 3; do
          YARN_HTTP_TIMEOUT=120000 yarn install --immutable && exit 0
          echo "yarn install failed (attempt $attempt), retrying"
          sleep 15
        done
        exit 1
    # The install above builds core components and generates the ANTLR parser;
    # with restored node_modules, restore core's dist (or build it) and
    # generate the parser here instead.
    - name: Restore core components dist
      id: dist
      if: steps.deps.outputs.cache-hit == 'true'
      uses: actions/cache/restore@v6
      with:
        path: openmetadata-ui-core-components/src/main/resources/ui/dist
        key: ${{ steps.keys.outputs.dist }}
    - name: Build core components
      if: steps.deps.outputs.cache-hit == 'true' && steps.dist.outputs.cache-hit != 'true'
      shell: bash
      working-directory: openmetadata-ui-core-components/src/main/resources/ui
      run: yarn build
    - name: Generate the ANTLR parser
      if: steps.deps.outputs.cache-hit == 'true'
      shell: bash
      working-directory: openmetadata-ui/src/main/resources/ui
      run: yarn run build-check
    - name: Save installed UI dependencies
      if: steps.deps.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: |
          openmetadata-ui/src/main/resources/ui/node_modules
          openmetadata-ui/src/main/resources/ui/.yarn/install-state.gz
          openmetadata-ui-core-components/src/main/resources/ui/node_modules
          openmetadata-ui-core-components/src/main/resources/ui/.yarn/install-state.gz
        key: ${{ steps.keys.outputs.deps }}
    - name: Save core components dist
      if: steps.dist.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: openmetadata-ui-core-components/src/main/resources/ui/dist
        key: ${{ steps.keys.outputs.dist }}
