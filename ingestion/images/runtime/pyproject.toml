# Generated aliases: python scripts/python_image_environment.py manifest --artifacts DIR --write
[project]
name = "openmetadata-image-environment"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openmetadata-ingestion[airflow]",
    "apache-airflow-providers-docker",
    "apache-airflow-providers-cncf-kubernetes",
    "apache-airflow-providers-smtp",
    "python-daemon>=3.0.0",
    "aiomysql>=0.3.2",
    "asyncpg>=0.31.0",
    "psycopg2==2.9.13",
    "pip>=26.2.2,<27",
    "setuptools>=83",
    "uv==0.13.4",
    "sqlalchemy-ibmi==0.9.3"
]

[project.optional-dependencies]
"airflow" = ["openmetadata-ingestion[airflow]"]
"all" = ["openmetadata-ingestion[all]"]
