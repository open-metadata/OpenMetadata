source:
  type: dremio
  serviceName: local_dremio
  serviceConnection:
    config:
      type: Dremio
      # Dremio Software: the REST URL of the coordinator, with a user and its password.
      # The connector reaches Arrow Flight on port 32010 of the same host.
      authType:
        hostPort: http://localhost:9047
        username: user
        password: password
      # Dremio Cloud instead: the region (US or EU), a personal access token and the project.
      # authType:
      #   region: EU
      #   personalAccessToken: token
      #   projectId: 00000000-0000-0000-0000-000000000000
      # Optional: restrict the ingestion to one namespace (a space or a source).
      # database: namespace
  sourceConfig:
    config:
      type: DatabaseMetadata
      # databaseFilterPattern:
      #   includes:
      #     - sales.*
      # schemaFilterPattern:
      #   includes:
      #     - gold.*
      tableFilterPattern:
        includes:
          - customer.*
sink:
  type: metadata-rest
  config: {}
