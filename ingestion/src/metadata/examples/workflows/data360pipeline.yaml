source:
  type: data360pipeline
  serviceName: local_data360pipeline
  serviceConnection:
    config:
      type: Data360Pipeline
      consumerKey: <your-connected-app-consumer-key>
      consumerSecret: <your-connected-app-consumer-secret>
      salesforceDomain: <your-org>.my  # The org's My Domain; `login` and `test` are rejected.
      # salesforceApiVersion: "63.0"   # Default: 63.0
      # paginationLimit: 10            # Default: 10. Valid range: 1-200.
      # data360DbServiceName: local_data360  # Required for lineage resolution.
      # serviceMapping: '{"SalesforceDotCom_Home": "local_salesforce"}'  # Data Stream source -> OpenMetadata service.
      # includeBulkLineage: false      # Data Lake Object -> Data Model Object lineage for every dataspace.
  sourceConfig:
    config:
      type: PipelineMetadata
      # includeTags: true
      # includeLineage: true           # Lineage is extracted in this run.
      # statusLookbackDays: 1          # Run status is extracted in this run.
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "<ingestion-bot-jwt>"
