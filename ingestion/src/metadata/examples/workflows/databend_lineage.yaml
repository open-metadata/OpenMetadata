source:
  type: databend-lineage
  serviceName: local_databend
  serviceConnection:
    config:
      type: Databend
      username: databend
      password: databend
      hostPort: localhost:8000
      connectionOptions:
        sslmode: disable
  sourceConfig:
    config:
      type: DatabaseLineage
      queryLogDuration: 1
      overrideViewLineage: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "<ingestion-bot-jwt>"
