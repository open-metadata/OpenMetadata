# Yarn 4 for every UI project in this repo (ADR:2026-10-29-ui-yarn-4-registry-from-config).
# The registry comes from config, never from yarn.lock: CI points installs at a mirror
# with YARN_NPM_REGISTRY_SERVER, local installs keep the default public registry.
yarnPath: .yarn/releases/yarn-4.18.1.cjs
nodeLinker: node-modules
enableTelemetry: false
# Yarn 1 behaviour, which Yarn 4.18 tightened by default: dependency install scripts run,
# and a version is installable as soon as it is published.
enableScripts: true
npmMinimalAgeGate: 0
plugins:
  - .yarn/plugins/engines-node.cjs
